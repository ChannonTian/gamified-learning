<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sterke werkwoorden · match-3</title>
<style>
  :root{
    --ink:#33415c;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#e4dfd4;
    --accent:#e8734a;
    --dim:rgba(51,65,92,.42);
    --tile-s:42%; --tile-l:92%; --tile-ink:28%; --tile-edge:80%;
  }
  body.dark{
    --ink:#dfe5f0;
    --paper:#222834;
    --card:#2b3342;
    --line:#3d4757;
    --dim:rgba(10,14,22,.55);
    --tile-s:30%; --tile-l:26%; --tile-ink:84%; --tile-edge:15%;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
    overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}

  /* ---------- HUD:三区(左菜单 / 中 关卡+目标 / 右 连击+分数) ---------- */
  #hud{
    width:min(94vw,640px);
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:10px 2px 8px;
  }
  .hud-btn{
    width:46px; height:46px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .hud-btn:active{transform:scale(.94);}
  .ic{width:25px; height:25px; flex:none; display:block;}
  .menu-btn .ic{width:24px; height:24px;}
  .dock-btn .ic{width:22px; height:22px;}
  .hud-btn{justify-self:start;}
  .hud-center{display:flex; align-items:center; gap:7px; justify-self:center;}
  .hud-right{display:flex; align-items:center; gap:7px; justify-self:end; min-width:0;}
  .tag{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:7px 13px; font-size:15px; font-weight:800; white-space:nowrap;
  }
  .goal-pill{
    position:relative; overflow:hidden; min-width:96px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:14px; font-weight:800; text-align:center;
  }
  .goal-pill i{
    position:absolute; inset:0; width:0%;
    background:linear-gradient(90deg, hsl(150 55% 65% / .5), hsl(150 60% 48% / .8));
    transition:width .45s cubic-bezier(.3,1.2,.5,1);
  }
  .goal-pill span{position:relative;}
  .score-tag{
    font-size:20px; font-weight:800; letter-spacing:.3px; line-height:1;
    padding:3px 6px;
    background:linear-gradient(135deg,#f5b942,#e8734a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .score-tag.bump{animation:scoreBump .32s ease;}
  @keyframes scoreBump{ 0%{scale:1;} 40%{scale:1.22;} 100%{scale:1;} }
  .combo-tag{
    background:linear-gradient(135deg,#ff9d2e,#e8554a); color:#fff; border:none;
    padding:6px 13px; border-radius:999px; font-size:14px; font-weight:800;
    animation:comboPop .25s ease, comboGlow 1.6s ease-in-out infinite;
  }
  @keyframes comboPop{ 0%{scale:.6;} 70%{scale:1.15;} 100%{scale:1;} }
  @keyframes comboGlow{ 0%,100%{box-shadow:0 0 8px rgba(232,85,74,.35);} 50%{box-shadow:0 0 18px rgba(232,85,74,.6);} }
  @media (max-width:430px){
    .hud-btn{width:40px; height:40px;}
    .ic{width:22px; height:22px;}
    .tag{padding:6px 10px; font-size:13.5px;}
    .goal-pill{padding:6px 10px; font-size:13px; min-width:84px;}
    .score-tag{font-size:17px;}
    .combo-tag{padding:5px 11px; font-size:13px;}
    #hud{padding-top:8px; gap:6px;}
  }

  /* ---------- 底部操作坞(拇指区,不贴屏幕底) ---------- */
  #dock{
    position:relative;
    display:flex; gap:12px; justify-content:center;
    margin-top:10px;
    padding:2px 14px calc(24px + env(safe-area-inset-bottom));
  }
  .dock-btn{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:14px; padding:12px 20px; font-size:15px; font-weight:700;
    box-shadow:0 2px 8px rgba(51,65,92,.06);
  }
  .dock-btn:active{transform:scale(.95);}

  /* ---------- 计分弹字 ---------- */
  .score-pop{
    position:absolute; z-index:15; pointer-events:none;
    transform:translate(-50%,-50%);
    font-weight:800; color:#fff; font-size:15px;
    text-shadow:0 1px 4px rgba(51,65,92,.55), 0 0 2px rgba(51,65,92,.4);
    animation:popUp .9s ease-out forwards; white-space:nowrap;
  }
  .score-pop.big{font-size:19px; color:#ffd166;}
  @keyframes popUp{
    0%{opacity:0; transform:translate(-50%,-30%) scale(.7);}
    25%{opacity:1; transform:translate(-50%,-60%) scale(1.05);}
    100%{opacity:0; transform:translate(-50%,-160%) scale(1);}
  }

  /* ---------- Board (4:3 tiles → 4:3 board) ---------- */
  #boardWrap{
    position:relative;
    width:min(94vw,400px);
    aspect-ratio:16/27;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:6px;
    margin:2px 0 10px;
    box-shadow:0 6px 24px rgba(51,65,92,.06);
  }
  #board{
    position:relative; width:100%; height:100%;
    touch-action:none; overflow:hidden;
  }
  .tile{
    position:absolute; left:0; top:0;
    width:calc(100%/var(--cols)); height:calc(100%/var(--rows));
    transition:transform .16s cubic-bezier(.35,1.25,.55,1);
    will-change:transform;
  }
  .tile.spawn{transition:transform .22s cubic-bezier(.3,1.2,.5,1);}
  .face{
    width:92%; height:90%; margin:4% 4%;
    display:flex; align-items:center; justify-content:center;
    background:hsl(var(--h) var(--tile-s) var(--tile-l));
    color:hsl(var(--h) 45% var(--tile-ink));
    box-shadow:inset 0 -3px 0 hsl(var(--h) var(--tile-s) var(--tile-edge));
    font-weight:700; line-height:1.05; text-align:center;
    overflow:hidden; padding:0 2px;
    border-radius:18%;                     /* enk.: afgeronde hoeken */
    transition:filter .15s, scale .15s;
  }
  .tile.f-pl .face{border-radius:6%;}      /* mv.: (bijna) rechte hoeken */
  .tile.f-pp .face{                        /* v.d.: afgesneden hoeken */
    border-radius:0;
    clip-path:polygon(0 0, 74% 0, 100% 26%, 100% 100%, 26% 100%, 0 74%);
  }
  /* 设置里关闭形状/颜色提示 */
  body.no-shape .tile.f-pl .face,
  body.no-shape .tile.f-pp .face{border-radius:18%; clip-path:none;}
  body.no-color .face{
    background:hsl(215 8% var(--tile-l));
    color:hsl(215 12% var(--tile-ink));
    box-shadow:inset 0 -3px 0 hsl(215 8% var(--tile-edge));
  }
  .tile.sel .face{
    scale:1.07;
    filter:drop-shadow(0 0 4px hsl(var(--h) 55% 45%));
  }
  .tile.hint .face{animation:hintPulse 1.1s ease-in-out 3;}
  @keyframes hintPulse{
    0%,100%{filter:none; scale:1;}
    50%{filter:drop-shadow(0 0 7px hsl(var(--h) 60% 50%)); scale:1.09;}
  }
  .tile.burst{z-index:5;}
  .tile.burst .face{animation:burstAnim .3s ease forwards;}
  @keyframes burstAnim{ to{ scale:1.45; opacity:0; } }

  /* ---------- flash (herhaalde werkwoorden) ---------- */
  #flash{
    position:absolute; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0;
    font-size:clamp(26px,8vw,44px); font-weight:800; color:var(--ink);
    text-shadow:0 0 14px var(--paper),0 0 24px var(--paper),0 0 34px var(--paper);
    text-align:center; padding:0 12px;
  }
  #flash.show{animation:flashAnim 1.05s ease forwards;}
  @keyframes flashAnim{
    0%{opacity:0; transform:scale(.7);}
    22%{opacity:1; transform:scale(1.04);}
    70%{opacity:1; transform:scale(1);}
    100%{opacity:0; transform:scale(1.02);}
  }

  /* ---------- 图例(仅帮助弹窗内使用) ---------- */
  .leg{display:flex; align-items:center; gap:5px;}
  .leg i{
    width:15px; height:12px; display:inline-block; flex:none;
    background:#dfe6f2; box-shadow:inset 0 -2px 0 #c3cfe4;
    border-radius:18%;
  }
  .leg i.s-pl{border-radius:6%;}
  .leg i.s-pp{border-radius:0; clip-path:polygon(0 0, 74% 0, 100% 26%, 100% 100%, 26% 100%, 0 74%);}

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:var(--dim);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .overlay.on{opacity:1; pointer-events:auto;}
  .panel{
    background:var(--card); border-radius:20px;
    padding:22px 22px 20px; width:min(88vw,380px);
    box-shadow:0 18px 50px rgba(20,30,50,.25);
    position:relative; max-height:86vh; overflow:auto;
  }
  .panel h1{margin:0 0 4px; font-size:22px;}
  .panel h2{margin:0 0 10px; font-size:17px;}
  .panel p{font-size:13px; line-height:1.65; color:#5a6577; margin:8px 0;}
  .close-x{
    position:absolute; top:10px; right:10px; width:30px; height:30px;
    border:none; background:none; font-size:18px; color:#98a1b0;
  }

  /* menu (standaard startscherm) */
  #menuScreen .panel{width:min(90vw,380px);}
  .menu-btn{
    display:flex; align-items:center; gap:12px;
    width:100%; padding:13px 16px; margin:9px 0;
    border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    font-size:15.5px; font-weight:700; text-align:left;
  }
  .menu-btn:active{transform:scale(.97);}
  .menu-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .menu-btn.ghost{background:var(--paper);}
  .menu-btn .m-label{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .menu-btn small{font-size:10.5px; font-weight:600; color:#8b93a3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .menu-btn.primary small{color:rgba(255,255,255,.8);}
  .menu-btn.locked{opacity:.5;}
  .menu-btn.locked small{color:#c05621;}
  .back-btn{
    border:none; background:none; color:var(--ink); font-size:20px;
    padding:4px 8px; margin-left:-8px; cursor:pointer;
  }
  .lv-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:14px 0 6px;}
  .lv-btn{
    border:1px solid var(--line); background:var(--paper); border-radius:14px;
    padding:14px 6px; text-align:center; color:var(--ink); font-weight:800; font-size:15px;
  }
  .lv-btn small{display:block; color:#8b93a3; font-size:10.5px; font-weight:600; margin-top:3px;}
  .lv-btn.locked{opacity:.4; pointer-events:none;}
  .style-row{display:flex; gap:10px; margin-top:8px;}
  .style-opt{
    flex:1; border:2px solid var(--line); border-radius:14px; padding:8px 6px 6px;
    background:var(--paper); text-align:center; font-size:11px; color:#5a6577;
  }
  .style-opt.sel{border-color:var(--accent);}

  /* instellingen */
  .set-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .set-row:last-child{border-bottom:none;}
  .set-row>label{font-weight:700;}
  .seg{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .seg button{
    padding:7px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:700;
  }
  .seg button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .set-row input[type=range]{width:140px; accent-color:var(--accent);}
  .set-row select{
    padding:7px 10px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:600;
  }

  /* leerbanner:绝对定位覆盖操作坞(按钮+留白),不接触棋盘 */
  #learnBanner{
    position:absolute; left:0; right:0; top:0; bottom:0; z-index:5;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 30px rgba(20,30,50,.28);
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; cursor:pointer; overflow:hidden;
    opacity:0; visibility:hidden; transform:translateY(16px);
    transition:transform .25s cubic-bezier(.3,1.2,.5,1), opacity .22s, visibility .25s;
  }
  #learnBanner.show{opacity:1; visibility:visible; transform:none;}
  #bannerArt{width:46px; height:46px; flex:none;}
  .b-main{flex:1; min-width:0;}
  .b-main b{font-size:24px; font-weight:800; line-height:1.1;}
  #bannerForms{font-size:16px; font-weight:700; color:var(--ink); opacity:.85; margin-top:2px;}
  #bannerGloss{
    margin-left:auto; flex:none; max-width:34%;
    font-size:12.5px; line-height:1.35; text-align:right;
    color:var(--ink); opacity:.6;
  }
  .b-progress{position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--paper);}
  .b-progress i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff9d2e,#e8554a);}
  #learnBanner.show .b-progress i{animation:bprog var(--bdur,10s) linear forwards;}
  @keyframes bprog{ from{width:100%;} to{width:0;} }

  /* collection card (eerste keer) — z 级高于图鉴/结果,可直接关闭 */
  #cardModal{z-index:70;}
  #cardModal .panel{width:min(84vw,330px); text-align:center; cursor:pointer;}
  #cardArt{width:150px; height:150px; margin:6px auto 2px; display:block;}
  #cardInf{font-size:34px; font-weight:800; letter-spacing:.5px;}
  #cardForms{font-size:13px; color:#7a8496; margin-top:6px;}
  #cardGloss{
    margin-top:12px; padding:10px 12px; border-radius:12px;
    background:var(--paper); font-size:14px; color:var(--ink); display:none;
  }
  #cardModal.gloss-open #cardGloss{display:block;}
  #cardTip{font-size:11px; color:#a3abb8; margin-top:12px;}

  /* book */
  #bookDrawer{justify-content:flex-end; align-items:stretch;}
  #bookDrawer .panel{
    width:min(88vw,360px); height:100%; max-height:none;
    border-radius:20px 0 0 20px; padding:18px 16px;
  }
  .book-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 6px; border-bottom:1px dashed var(--line);
  }
  .book-row.viewable{cursor:pointer; border-radius:10px;}
  .book-row.viewable:active{background:var(--paper);}
  .book-art{width:44px; height:44px; flex:none;}
  .book-art.empty{
    border-radius:12px; background:var(--paper); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:#b6bdc9; font-size:16px;
  }
  .book-main b{font-size:15px;}
  .book-main small{display:block; color:#8b93a3; font-size:11.5px; margin-top:2px;}
  .book-tag{margin-left:auto; font-size:11px; color:#8b93a3; flex:none; text-align:right; line-height:1.5;}
  .book-count{
    display:inline-block; background:var(--paper); border:1px solid var(--line);
    border-radius:8px; padding:1px 6px; font-size:10.5px; font-weight:700; color:#5a6577;
  }
  .book-group{font-size:12px; color:#98a1b0; margin:14px 0 2px; font-weight:700;}
  @media (max-width:520px){
    #bookDrawer{align-items:flex-end;}
    #bookDrawer .panel{
      width:100%; height:auto; max-height:74vh;
      border-radius:20px 20px 0 0; padding:16px 16px calc(14px + env(safe-area-inset-bottom));
    }
  }

  /* result */
  #resultModal .panel{text-align:center;}
  .btn{
    display:inline-block; border:none; border-radius:12px;
    padding:11px 20px; font-size:14px; font-weight:700; margin:6px 4px 0;
    background:var(--accent); color:#fff;
  }
  .btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
  .btn:active{transform:scale(.96);}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:9vh; transform:translateX(-50%) translateY(8px);
    background:rgba(51,65,92,.88); color:#fff; font-size:13px;
    padding:8px 16px; border-radius:20px; opacity:0; transition:.25s; z-index:80;
    pointer-events:none; white-space:nowrap; max-width:92vw;
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

  .rule-legend{display:flex; gap:10px; margin:10px 0; flex-wrap:wrap;}
  .rule-legend .leg{color:#5a6577; font-size:12px;}

</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <button class="hud-btn" id="btnMenu" title="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button>
    <div class="hud-center">
      <span class="tag" id="lvlTag">A2.1</span>
      <span class="goal-pill" id="goalTag"><i id="goalBar"></i><span id="goalTxt">🎯 0/4</span></span>
      <span class="tag" id="timerTag" style="display:none;">⏱ 3:00</span>
    </div>
    <div class="hud-right">
      <span class="combo-tag" id="comboTag" style="display:none;">🔥 ×2</span>
      <span class="score-tag" id="scoreTag">⭐ 0</span>
    </div>
  </header>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="flash"></div>
  </div>


  <div id="dock">
    <button class="dock-btn" id="btnHint"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.8a6.6 6.6 0 0 0-4.1 11.8c.8.6 1.1 1.5 1.1 2.5h6c0-1 .3-1.9 1.1-2.5A6.6 6.6 0 0 0 12 2.8z" fill="currentColor"/><rect x="9.4" y="18.4" width="5.2" height="2.4" rx="1.2" fill="currentColor"/></svg><span data-i18n="dock.hint">Hint</span></button>
    <button class="dock-btn" id="btnBook"><svg class="ic" viewBox="0 0 24 24"><path d="M11.2 5.2C9.2 3.9 6.6 3.9 5 4.9v14c1.6-1 4.2-1 6.2.3zM12.8 5.2c2-1.3 4.6-1.3 6.2-.3v14c-1.6-1-4.2-1-6.2.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-i18n="dock.book">Verzameling</span></button>
    <div id="learnBanner">
      <svg id="bannerArt" viewBox="0 0 120 120"></svg>
      <div class="b-main">
        <b id="bannerInf"></b>
        <div id="bannerForms"></div>
      </div>
      <div id="bannerGloss"></div>
      <div class="b-progress"><i></i></div>
    </div>
  </div>
</div>

<!-- Hoofdmenu -->
<div class="overlay on" id="menuScreen">
  <div class="panel">
    <div id="menuMain">
      <h1 style="margin-bottom:14px;">Sterke werkwoorden</h1>
      <button class="menu-btn primary" id="mResume" style="display:none;"><svg class="ic" viewBox="0 0 24 24"><path d="M20 4v16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M15 12H5M9 8l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="menu.back">Terug naar spel</span></button>
      <button class="menu-btn primary" id="mNew"><svg class="ic" viewBox="0 0 24 24"><path d="M9.2 7.4v9.2l7.6-4.6z" fill="currentColor"/></svg><span data-i18n="menu.new">Nieuw spel</span></button>

/* ================= 语音(Web Speech API) ================= */
let nlVoice=null;
function updateVoiceName(){
  const el=document.getElementById("voiceName");
  if(el) el.textContent = nlVoice ? nlVoice.name : t("set.novoice");
}
function initVoices(){
  if(!("speechSynthesis" in window)) return;
  const pick=()=>{
    const vs=window.speechSynthesis.getVoices();
    nlVoice = vs.find(v=>(v.lang||"").toLowerCase().replace("_","-")==="nl-nl")
           || vs.find(v=>(v.lang||"").toLowerCase().startsWith("nl")) || null;
    updateVoiceName();
  };
  pick();
  window.speechSynthesis.onvoiceschanged=pick;
}
function speakVerb(V){
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || save.settings.ttsVolume<=0){ res(); return; }
    try{
      window.speechSynthesis.cancel();
      const seq=[V.inf,V.sg,V.pl,V.pp];
      let i=0;
      const next=()=>{
        if(i>=seq.length){ res(); return; }
        const u=new SpeechSynthesisUtterance(seq[i++]);
        u.lang="nl-NL"; if(nlVoice) u.voice=nlVoice;
        u.rate=0.82; u.volume=save.settings.ttsVolume/100;
        u.onend=next; u.onerror=next;
        window.speechSynthesis.speak(u);
      };
      next();
    }catch(e){ res(); }
  });
}
function stopSpeech(){ if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} } }

function ctxOf(style){
  const dark=document.body.classList.contains("dark");
  return style==="B"
    ? {ink: dark?"#cfd8e3":"#3a4750", sw:4, body:"none", acc:"rgba(255,150,100,.25)", teal:"rgba(84,184,165,.25)", white:"rgba(255,255,255,.45)"}
    : {ink: dark?"#e8edf5":"#39424e", sw:0, body: dark?"#ff9d7a":"#ff8a66", acc:"#ffc94d", teal:"#54b8a5", white:"#ffffff"};
}
function limb(ctx,pts){
  const d=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  return `<path d="${d}" fill="none" stroke="${ctx.ink}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function person(ctx,pose,x,y,flip=false){
  const flipG=flip?` transform="translate(${2*x},0) scale(-1,1)"`:"";
  let s="";
  const head=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="8.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>${ctx.sw?"":`<circle cx="${cx-2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/><circle cx="${cx+2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/>`}`;
  if(pose==="sit"){
    s+=head(x,y-38);
    s+=limb(ctx,[[x,y-29.5],[x,y-14]]);
    s+=limb(ctx,[[x,y-14],[x+9,y-11],[x+11,y]]);
    s+=limb(ctx,[[x,y-14],[x+6,y-9],[x+7,y]]);
    s+=limb(ctx,[[x,y-24],[x+8,y-17]]);
    s+=limb(ctx,[[x,y-24],[x-6,y-16]]);
    return `<g${flipG}>${s}</g>`;
  }
  if(pose==="jump"){
    s+=head(x,y-40);
    s+=limb(ctx,[[x,y-31],[x,y-14]]);
    s+=limb(ctx,[[x,y-14],[x-8,y-20]]);
    s+=limb(ctx,[[x,y-14],[x+8,y-22]]);
    s+=limb(ctx,[[x,y-27],[x-11,y-38]]);
    s+=limb(ctx,[[x,y-27],[x+11,y-38]]);
    return `<g${flipG}>${s}</g>`;
  }
  if(pose==="duck"){
    s+=head(x+10,y-32);
    s+=limb(ctx,[[x+9,y-23],[x+2,y-12]]);
    s+=limb(ctx,[[x+2,y-12],[x-4,y]]);
    s+=limb(ctx,[[x+2,y-12],[x+8,y]]);
    s+=limb(ctx,[[x+8,y-20],[x+14,y-14]]);
    return `<g${flipG}>${s}</g>`;
  }
  if(pose==="lie"){
    s+=limb(ctx,[[x-14,y-30],[x-26,y-27]])
      +limb(ctx,[[x-6,y-31],[x-20,y-24]])
      +`<rect x="${x-24}" y="${y-40}" width="34" height="13" rx="6.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>`
      +head(x+18,y-34);
    return `<g${flipG}>${s}</g>`;
  }
  const lean=pose==="run"?3:0;
  s+=head(x+lean,y-38);
  s+=limb(ctx,[[x+lean,y-29.5],[x,y-12]]);
  const legEnds={
    stand:[[-6,0],[6,0]], open:[[-6,0],[6,0]],
    walk:[[-9,0],[8,-1]], run:[[-10,-1],[9,0]],
    hold:[[-5,0],[6,0]],  reach:[[-5,0],[6,0]],
  }[pose]||[[-6,0],[6,0]];
  s+=limb(ctx,[[x,y-12],[x+legEnds[0][0],y+legEnds[0][1]]]);
  s+=limb(ctx,[[x,y-12],[x+legEnds[1][0],y+legEnds[1][1]]]);
  const armEnds={
    stand:[[-8,-14],[8,-14]], open:[[-13,-33],[13,-33]],
    walk:[[-9,-18],[9,-15]],  run:[[-9,-20],[13,-24]],
    hold:[[10,-20],[12,-16]], reach:[[16,-24],[-7,-15]],
  }[pose]||[[-8,-14],[8,-14]];
  for(const e of armEnds) s+=limb(ctx,[[x+lean,y-26],[x+e[0],y+e[1]]]);
  return `<g${flipG}>${s}</g>`;
}

function genericArt(vIdx,c){
  const V=VERBS[vIdx];
  const letter=V.inf[0].toUpperCase();
  let deco=`<circle cx="35" cy="31" r="3.2" fill="${c.acc}"/><circle cx="88" cy="38" r="2.6" fill="${c.acc}"/><circle cx="83" cy="89" r="3.2" fill="${c.teal}"/>`;
  if(V.inf.length>=7) deco+=`<path d="M28 94 Q 60 102 92 94" stroke="${c.ink}" stroke-opacity=".3" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const txt = c.sw
    ? `<text x="60" y="75" text-anchor="middle" font-weight="800" font-size="52" font-family="inherit" fill="none" stroke="${c.ink}" stroke-width="1.6">${letter}</text>`
    : `<text x="60" y="75" text-anchor="middle" font-weight="800" font-size="52" font-family="inherit" fill="${c.ink}">${letter}</text>`;
  return bgCircle(c,V.hue)+txt+deco+ground(c);
}

let actx=null;
function blip(freq,dur=.08,type="sine",gain=.12){
  const vol=(save.settings?save.settings.volume:70)/100;
  if(vol<=0) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain*vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

function dailySeed(){
  const d=new Date();
  const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  let h=1779033703 ^ key.length;
  for(const ch of key){ h=Math.imul(h^ch.charCodeAt(0),3432918353); h=((h<<13)|(h>>>19))>>>0; }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function sampleVerbs(pool,count,r){

}

function computeLevelFont(){
  // 用 canvas 实测本关最长词的渲染宽度,统一字号保证任何词都完整显示
  const ctx=measureCanvas.getContext("2d");

    for(const w of [V.sg,V.pl,V.pp]) maxW=Math.max(maxW, ctx.measureText(w).width);
  }
  levelFont=Math.max(9,Math.min(22, 100*usable/maxW));
}

function pickRefillTile(nbrVerb){
  const act=level.verbs;
  const cnt={};
  for(let r=0;r<ROWS;r++)for(let cc=0;cc<COLS;cc++){const t=board[r][cc]; if(t) cnt[t.v*3+t.f]=(cnt[t.v*3+t.f]||0)+1;}
  const per=COLS*ROWS/(act.length*3);
  const opts=[];
  for(const v of act)for(let f=0;f<3;f++){
    let w=Math.max(.2, per-(cnt[v*3+f]||0)+.6);
    if(nbrVerb!=null && v===nbrVerb) w*=2.2;
    opts.push({v,f,w});
  }
  let sum=opts.reduce((s,o)=>s+o.w,0), x=Math.random()*sum;
  for(const o of opts){ x-=o.w; if(x<=0) return {v:o.v,f:o.f}; }
  return opts[0];
}

function fillBoard(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    let t=null;
    for(let tries=0;tries<40;tries++){
      const cand=randTileAt(r,c);
      if(!createsTriple(cand,r,c)){ t=cand; break; }
    }
    if(!t){
      const act=level.verbs;
      const left=c>0?board[r][c-1]:null, up=r>0?board[r-1][c]:null;
      let v; do{ v=act[Math.floor(Math.random()*act.length)]; }while((left&&left.v===v)||(up&&up.v===v));
      t={v,f:Math.floor(Math.random()*3)};
    }
    board[r][c]=t;
  }
}
function randTileAt(r,c){
  const act=level.verbs;
  let v;
  const left=c>0?board[r][c-1]:null, up=r>0?board[r-1][c]:null;
  if((left||up)&&Math.random()<0.62){          // 聚类偏置:让同动词词块更容易相邻
    const src=(left&&up)?(Math.random()<.5?left:up):(left||up);
    v=src.v;
  }else{
    v=act[Math.floor(Math.random()*act.length)];
  }
  return {v,f:Math.floor(Math.random()*3)};
}
function createsTriple(t,r,c){
  const L1=c>0?board[r][c-1]:null, L2=c>1?board[r][c-2]:null;
  if(L1&&L2&&L1.v===t.v&&L2.v===t.v) return true;
  const U1=r>0?board[r-1][c]:null, U2=r>1?board[r-2][c]:null;
  if(U1&&U2&&U1.v===t.v&&U2.v===t.v) return true;
  return false;
}

// 值网格扫描:返回「三种形式齐全」的连段(≥3 个同动词连续,且 sg/pl/pp 各 ≥1)
function scan(g){
  const runs=[];
  const consider=(cells)=>{
    if(cells.length<3) return;
    const forms=new Set(cells.map(([r,c])=>g[r][c].f));
    if(forms.size===3) runs.push({cells,v:g[cells[0][0]][cells[0][1]].v});
  };
  for(let r=0;r<ROWS;r++){
    let s=0;
    for(let c=1;c<=COLS;c++){
      if(c===COLS||g[r][c].v!==g[r][s].v){ consider(Array.from({length:c-s},(_,i)=>[r,s+i])); s=c; }
    }
  }
  for(let c=0;c<COLS;c++){
    let s=0;
    for(let r=1;r<=ROWS;r++){
      if(r===ROWS||g[r][c].v!==g[s][c].v){ consider(Array.from({length:r-s},(_,i)=>[s+i,c])); s=r; }
    }
  }
  return runs;
}

// 找一个可行交换 + 指出「补全连线的那一块」(提示只高亮它)
function findHintMove(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const [dr,dc] of [[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;
      if(r2>=ROWS||c2>=COLS) continue;
      const a=board[r][c], b=board[r2][c2];
      board[r][c]=b; board[r2][c2]=a;
      const runs=scan(board);
      board[r][c]=a; board[r2][c2]=b;
      if(runs.length){
        let answer=null;
        for(const run of runs){
          if(run.cells.some(([rr,cc])=>rr===r2&&cc===c2)){ answer=[r,c]; break; }   // 原在 (r,c) 的块滑入成线
          if(run.cells.some(([rr,cc])=>rr===r&&cc===c)){ answer=[r2,c2]; break; }   // 原在 (r2,c2) 的块滑入成线
        }
        if(!answer) answer=[r2,c2];
        return {a:[r,c], b:[r2,c2], answer};
      }
    }
  }
  return null;
}
function countMoves(){
  let n=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    for(const [dr,dc] of [[0,1],[1,0]]){
      const r2=r+dr,c2=c+dc;
      if(r2>=ROWS||c2>=COLS) continue;
      const a=board[r][c], b=board[r2][c2];
      board[r][c]=b; board[r2][c2]=a;
      const ok=scan(board).length>0;
      board[r][c]=a; board[r2][c2]=b;
      if(ok) n++;
    }
  }
  return n;
}

function buildBoardDOM(){
  boardEl.innerHTML="";
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) boardEl.appendChild(makeTileEl(board[r][c],r,c));
}

const HUE_PALETTE=[215,12,275,160,48,330,65,190,130,356,250,300];
function beginSession(){
  collectedRun=new Set(); selected=null; pendingHint=false;
  scoreRun=0; zettenRun=0; streak=0; lastScoreShown=-1;
  // 本会话激活动词按调色板取色,保证同盘绝不撞色
  level.verbs.forEach((vi,k)=>{ VERBS[vi].hue=HUE_PALETTE[k%HUE_PALETTE.length]; });
  updateHUD();
  busy=true;
  boardEl.style.setProperty("--cols",COLS);
  boardEl.style.setProperty("--rows",ROWS);
  syncWidths();
  // 开局保底:至少两个可行组合
  let ok=false;
  for(let i=0;i<120&&!ok;i++){ fillBoard(); if(countMoves()>=2) ok=true; }
  if(!ok) forceTwoNearMiss();
  computeLevelFont();
  buildBoardDOM();
  return sleep(200).then(()=>{ busy=false; lastAction=Date.now(); });
}

  document.getElementById("lvlTag").textContent=t("mode.daily");
  beginSession().then(startDailyTimer);
}

// 兜底:手工埋两个「差一块就成线」的布局
function forceTwoNearMiss(){
  fillBoard();
  const [V1,V2]=level.verbs;
  const others=level.verbs.filter(x=>x!==V1&&x!==V2);
  const junk=(notV,notF)=>{
    let t;
    do{ t={v:others[Math.floor(Math.random()*others.length)],f:Math.floor(Math.random()*3)}; }
    while(t.v===notV&&t.f===notF);
    return t;
  };
  board[0][0]={v:V1,f:SG}; board[0][1]={v:V1,f:PL}; board[0][2]=junk(V1,PP); board[1][2]={v:V1,f:PP};
  board[ROWS-3][COLS-3]={v:V2,f:SG}; board[ROWS-3][COLS-2]={v:V2,f:PL};
  board[ROWS-3][COLS-1]=junk(V2,PP); board[ROWS-2][COLS-1]={v:V2,f:PP};
  if(scan(board).length) forceTwoNearMiss();
}

let lastScoreShown=-1;
function updateHUD(){

/* ---- 交换与消除 ---- */
async function trySwap(r1,c1,r2,c2){
  if(busy) return false;
  busy=true;
  try{
    await doSwap(r1,c1,r2,c2);
  }catch(err){
    console.error(err);
    window.__errors=window.__errors||[];
    window.__errors.push(String(err&&err.stack||err));
    toast("出错了,已自动恢复");
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(!board[r][c]){
        const t=pickRefillTile(null);
        board[r][c]=t;
        boardEl.appendChild(makeTileEl(t,r,c));
        placeTile(t,r,c,true);
      }
    }
  }finally{
    busy=false;
  }
  if(pendingHint){ pendingHint=false; hint(); }
  if(mode==='levels') checkEnd();
  return true;
}
async function doSwap(r1,c1,r2,c2){
  clearSel();
  lastAction=Date.now();
  const a=board[r1][c1], b=board[r2][c2];
  placeTile(a,r2,c2); placeTile(b,r1,c1);
  blip(340,.05,"triangle",.06);
  await sleep(170);
  board[r1][c1]=b; board[r2][c2]=a;
  const runs=scan(board);
  if(!runs.length){
    board[r1][c1]=a; board[r2][c2]=b;
    placeTile(a,r1,c1); placeTile(b,r2,c2);
    blip(180,.08,"sine",.05);
    if(streak>0){ streak=0; updateHUD(); }      // 无效交换打断连击
    await sleep(180);
    lastAction=Date.now();
    return false;
  }
  zettenRun++;
  await resolve(runs);
  streak++;                                     // 成功交换延续连击
  if(streak>=2){
    const bonus=25*(streak-1);
    scoreRun+=bonus;
    popScore(0.6, COLS/2-0.5, `🔥 combo +${bonus}`, true);
  }
  updateHUD();
  lastAction=Date.now();
}

async function resolve(runs){
  let chain=0;
  while(runs.length){
    chain++;
    const verbSet=[...new Set(runs.flatMap(run=>run.cells.map(([r,c])=>board[r][c].v)))];
    // 行连段与列连段可能交叉共享同一块:必须去重,否则二次处理时 board[r][c] 已为 null → 崩溃冻结
    const cellSet=new Set(), cells=[];
    for(const run of runs) for(const [r,c] of run.cells){
      const k=r*COLS+c;
      if(!cellSet.has(k)){ cellSet.add(k); cells.push([r,c]); }
    }
    blip(520+Math.min(cells.length,6)*40,.1,"triangle",.09);
    for(const [r,c] of cells){
      const t=board[r][c];
      if(!t) continue;                      // 双重保险:交叉去重后不应出现
      t.el.classList.add("burst");
      board[r][c]=null;
    }
    // 计分:每块 10 分 × 连锁倍数;每词消除次数 +1
    const pts=cells.length*10*chain;
    scoreRun+=pts;
    const cr=cells.reduce((s,[r,c])=>s+r,0)/cells.length;
    const cc=cells.reduce((s,[r,c])=>s+c,0)/cells.length;
    popScore(cr, cc, `+${pts}${chain>1?` ×${chain}`:""}`, chain>1);
    for(const v of verbSet){
      const inf=VERBS[v].inf;
      save.counts[inf]=(save.counts[inf]||0)+1;
    }
    persist();
    const fresh=verbSet.filter(v=>!save.collected.includes(VERBS[v].inf));   // 全局首次解锁才弹卡
    for(const v of fresh){
      save.collected.push(VERBS[v].inf); persist();
    }
    for(const v of verbSet) collectedRun.add(v);                             // 关卡目标按本次对局计
    updateHUD();
    for(const v of fresh){ await showCard(v); }
    // 所有模式:教学横幅(不阻挡操作);首次解锁的刚看过完整卡片,跳过
    for(const v of verbSet){
      if(!fresh.includes(v)) showLearnBanner(v);
    }
    await sleep(340);
    boardEl.querySelectorAll(".burst").forEach(el=>el.remove());
    await gravityRefill();
    runs=scan(board);
  }
  if(!findHintMove()){
    toast(t("toast.shuffle"));
    await sleep(500);
    await reshuffle();
  }
}

// 计分弹字:(r,c) 为棋盘坐标(可为小数),在 boardWrap 内浮起消失

async function gravityRefill(){
  const spawned=[];
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      const t=board[r][c];
      if(t){
        if(write!==r){ board[write][c]=t; board[r][c]=null; placeTile(t,write,c); }
        write--;
      }
    }
    let above=1;
    for(let r=write;r>=0;r--){
      const nb=(r+1<ROWS&&board[r+1][c])?board[r+1][c].v:null;
      const t=pickRefillTile(Math.random()<.35?nb:null);
      board[r][c]=t;
      const el=makeTileEl(t,r,c);
      boardEl.appendChild(el);
      el.classList.add("spawn");
      el.style.transition="none";
      el.style.transform=`translate(${c*100}%, -${above*100}%)`;
      void el.offsetWidth;
      el.style.transition="";
      placeTile(t,r,c);
      above++;
      spawned.push(t);
    }
  }
  // 自愈:任何残留空格直接补随机块(正常流程不会走到)
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!board[r][c]){
      const t=pickRefillTile(null);
      board[r][c]=t;
      const el=makeTileEl(t,r,c);
      boardEl.appendChild(el);
      placeTile(t,r,c,true);
    }
  }
  if(spawned.length){
    await sleep(120);
    spawned.forEach(t=>t.el&&t.el.classList.remove("spawn"));
    await sleep(160);
  }else{
    await sleep(60);
  }
}

async function reshuffle(){
  busy=true;
  const vals=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) vals.push({v:board[r][c].v,f:board[r][c].f});
  let placed=false;
  for(let tries=0;tries<300&&!placed;tries++){
    for(let i=vals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [vals[i],vals[j]]=[vals[j],vals[i]]; }
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ board[r][c].v=vals[r*COLS+c].v; board[r][c].f=vals[r*COLS+c].f; }
    if(!scan(board).length&&countMoves()>=2) placed=true;
  }
  boardEl.classList.add("fading");
  await sleep(220);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=board[r][c];
    t.el.className="tile f-"+["sg","pl","pp"][t.f];
    t.el.style.setProperty("--h",VERBS[t.v].hue);
    t.el.firstChild.textContent=wordOf(t);
    t.el.firstChild.style.fontSize=levelFont+"px";
    placeTile(t,r,c,true);
  }
  boardEl.classList.remove("fading");
  busy=false;
}

/* ---- 每日挑战计时 ---- */
const DAILY_SECONDS=180;
let dailyLeft=0, dailyIv=null;
function stopDailyTimer(){ if(dailyIv){ clearInterval(dailyIv); dailyIv=null; } }
function updateTimerTag(){
  const m=Math.floor(dailyLeft/60), s=String(dailyLeft%60).padStart(2,"0");
  document.getElementById("timerTag").textContent=`⏱ ${m}:${s}`;
}
function startDailyTimer(){
  dailyLeft=DAILY_SECONDS;
  resumeDailyTimer();
}
function resumeDailyTimer(){
  updateTimerTag();
  stopDailyTimer();
  dailyIv=setInterval(()=>{
    if(mode!=='daily'){ stopDailyTimer(); return; }
    dailyLeft--; updateTimerTag();
    if(dailyLeft<=0){ stopDailyTimer(); endTimeUp(); }
  },1000);
}
function endTimeUp(){
  const wait=()=>{
    if(busy){ setTimeout(wait,250); return; }
    busy=true; stopSpeech(); hideBanner();
    const key=todayKey();
    const prev=save.dailyBest[key]||0;
    const rec=scoreRun>prev;
    if(rec){ save.dailyBest[key]=scoreRun; persist(); }
    level=null;
    document.getElementById("resultTitle").textContent=t("result.timeup");
    document.getElementById("resultText").innerHTML=
      `⭐ <b>${scoreRun}</b>${rec?" — "+t("result.record"):""} · ${t("result.best")}: ${Math.max(prev,scoreRun)}`;
    const btns=document.getElementById("resultBtns");
    btns.innerHTML="";
    const b2=document.createElement("button"); b2.className="btn ghost"; b2.textContent=t("btn.again");
    b2.onclick=()=>{hideResult(); startDaily();};
    btns.appendChild(b2);
    const b3=document.createElement("button"); b3.className="btn ghost"; b3.textContent=t("btn.menu");
    b3.onclick=()=>{hideResult(); openMenu();};
    btns.appendChild(b3);
    document.getElementById("resultModal").classList.add("on");
    blip(392,.12); setTimeout(()=>blip(330,.16),130);
  };
  wait();
}

function checkEnd(){
  if(mode!=='levels') return;
  if(collectedRun.size>=level.goal){
    const idx=LEVELS.findIndex(l=>l.id===level.id);
    const hasNext=idx>=0 && idx<LEVELS.length-1;
    if(idx>=0 && idx+2>save.unlocked){ save.unlocked=idx+2; }
    const oldBest=save.best[level.id]||0;
    const newBest=scoreRun>oldBest;
    if(newBest){ save.best[level.id]=scoreRun; }
    save.done[level.id]=true;
    persist();
    showResult(hasNext,newBest,oldBest);
  }
}
function showResult(hasNext,newBest,oldBest){
  const finishedId=level && level.id;      // 按钮闭包用
  const goalN=level ? level.goal : collectedRun.size;
  level=null;                              // 会话结束:菜单不再显示"回到当前游戏"
  document.getElementById("resultTitle").textContent=t("result.title");
  const bestTxt=newBest?` — ${t("result.record")}`:` (${t("result.best")}: ${oldBest})`;
  document.getElementById("resultText").innerHTML=
    t("result.done").replace("{n}",goalN)+"<br>"+
    `⭐ <b>${scoreRun}</b>${bestTxt} · ${zettenRun} ${t("result.zetten")}`;
  const btns=document.getElementById("resultBtns");
  btns.innerHTML="";
  if(hasNext){ const b=document.createElement("button"); b.className="btn"; b.textContent=t("btn.next"); b.onclick=()=>{hideResult(); startLevel(LEVELS[LEVELS.findIndex(l=>l.id===finishedId)+1].id);}; btns.appendChild(b); }
  const b2=document.createElement("button"); b2.className="btn ghost"; b2.textContent=t("btn.again");
  b2.onclick=()=>{hideResult(); startLevel(finishedId);};
  btns.appendChild(b2);
  const b3=document.createElement("button"); b3.className="btn ghost"; b3.textContent=t("btn.menu");
  b3.onclick=()=>{hideResult(); openMenu();};
  btns.appendChild(b3);
  document.getElementById("resultModal").classList.add("on");
  if(scoreRun>0){ blip(523,.1); setTimeout(()=>blip(659,.1),110); setTimeout(()=>blip(784,.16),220); }
}
function hideResult(){ document.getElementById("resultModal").classList.remove("on"); }

/* ---- 选择/拖拽输入 ---- */
let dragInfo=null;
function clearSel(){ if(selected){ selected.el.classList.remove("sel"); selected=null; } }
function selectTile(t){ clearSel(); selected=t; t.el.classList.add("sel"); blip(420,.04,"sine",.04); }
boardEl.addEventListener("pointerdown",e=>{
  lastAction=Date.now();
  if(busy) return;
  const el=e.target.closest(".tile");
  if(!el) return;
  dragInfo={t:el._t, x:e.clientX, y:e.clientY, moved:false};
  el.setPointerCapture?.(e.pointerId);
});
boardEl.addEventListener("pointermove",e=>{
  if(!dragInfo||busy) return;
  const dx=e.clientX-dragInfo.x, dy=e.clientY-dragInfo.y;
  if(Math.hypot(dx,dy)>14){
    dragInfo.moved=true;
    const t=dragInfo.t;
    let dr=0,dc=0;
    if(Math.abs(dx)>Math.abs(dy)) dc=dx>0?1:-1; else dr=dy>0?1:-1;
    const r2=t.r+dr,c2=t.c+dc;
    dragInfo=null;
    if(r2>=0&&r2<ROWS&&c2>=0&&c2<COLS) trySwap(t.r,t.c,r2,c2);
  }
});
boardEl.addEventListener("pointerup",e=>{
  lastAction=Date.now();
  const info=dragInfo; dragInfo=null;
  if(!info||info.moved||busy) return;
  const t=info.t;
  if(selected===t){ clearSel(); return; }
  if(selected&&Math.abs(selected.r-t.r)+Math.abs(selected.c-t.c)===1){
    const s=selected;
    trySwap(s.r,s.c,t.r,t.c);
  }else{
    selectTile(t);
  }
});

/* ================= 菜单/设置/图鉴 ================= */
/* 离开当前会话时记录未完成的最佳分 */
function abandonSession(){
  if(mode==='endless'){
    const prev=save.best["Oneindig"]||0;
    if(scoreRun>prev){ save.best["Oneindig"]=scoreRun; persist(); }
  }
  if(mode==='daily'){
    const k=todayKey(); const prev=save.dailyBest[k]||0;
    if(scoreRun>prev){ save.dailyBest[k]=scoreRun; persist(); }
  }
  stopDailyTimer(); stopSpeech(); hideBanner();
}
function openMenu(){
  // 会话保持存活:无尽/每日暂停计时,关卡保留棋盘;菜单提供"回到当前游戏"
  if(mode==='daily') stopDailyTimer();
  if(mode==='endless'){
    const prev=save.best["Oneindig"]||0;
    if(scoreRun>prev){ save.best["Oneindig"]=scoreRun; persist(); }
  }
  stopSpeech(); hideBanner();
  showMenuView("main");
  // 有进行中的会话 → 显示"回到当前游戏",隐藏"继续游戏"(避免误触去别的关)
  const resume=document.getElementById("mResume");
  const inSession=!!level;
  resume.style.display=inSession?"flex":"none";
  if(inSession) resume.onclick=()=>{ 
    document.getElementById("menuScreen").classList.remove("on");
    if(mode==='daily') resumeDailyTimer();
  };
  const mc=document.getElementById("mContinue");
  // 继续游戏 = 第一个未完成的已解锁关卡(全部完成则回到最高解锁关)
  const nextLv = LEVELS.find((l,i)=> (i+1)<=save.unlocked && !save.done[l.id]) || LEVELS[Math.min(save.unlocked,LEVELS.length)-1];
  window.__continueId = nextLv ? nextLv.id : null;
  mc.style.display = (nextLv && !inSession) ? "" : "none";
  const unlockedModes=save.unlocked>=MODE_UNLOCK;
  document.getElementById("mDaily").classList.toggle("locked",!unlockedModes);
  document.getElementById("mEndless").classList.toggle("locked",!unlockedModes);
  const dBest=save.dailyBest[todayKey()];
  document.getElementById("mDailySub").textContent=unlockedModes
    ?(dBest?`${t("result.today")}: ${dBest}`:t("menu.newdaily"))
    :t("menu.needlevel");
  const eBest=save.best["Oneindig"];
  document.getElementById("mEndlessSub").textContent=unlockedModes
    ?(eBest?`${t("result.best")}: ${eBest}`:t("menu.endlessnew"))
    :t("menu.needlevel");
  document.getElementById("menuScreen").classList.add("on");
}
function showMenuView(v){
  document.getElementById("menuMain").style.display=v==="main"?"":"none";
  document.getElementById("menuLevels").style.display=v==="levels"?"":"none";
  if(v==="levels") renderLevelGrid();
}
function renderLevelGrid(){
  const g=document.getElementById("lvGrid");
  g.innerHTML="";

    const b=document.createElement("button");

    b.className="lv-btn"+(locked?" locked":"");

    b.onclick=()=>{ document.getElementById("menuScreen").classList.remove("on"); startLevel(lv.id); };
    g.appendChild(b);
  });
}

/* ---- 设置面板 ---- */
function seg(el,opts,cur,cb){
  el.innerHTML="";
  for(const [val,label] of opts){
    const btn=document.createElement("button");
    btn.textContent=label;
    if(String(val)===String(cur)) btn.classList.add("sel");
    btn.onclick=()=>{ cb(val); persist(); applySettings(); renderSettings(); };
    el.appendChild(btn);
  }
}
function openSettings(){
  renderSettings();
  document.getElementById("settingsModal").classList.add("on");
}
function renderSettings(){
  const S=save.settings;
  updateVoiceName();
  seg(document.getElementById("setStyle"),[["A","Stijl A"],["B","Stijl B"]],save.style,v=>save.style=v);
  seg(document.getElementById("setLang"),[["nl","Nederlands"],["zh","中文"],["en","English"]],S.uiLang,v=>S.uiLang=v);
  const vol=document.getElementById("setVolume"); vol.value=S.volume;
  const tts=document.getElementById("setTts"); tts.value=S.ttsVolume;
  const hw=document.getElementById("setHintWait"); hw.value=S.hintWait;
  document.getElementById("hintWaitVal").textContent=S.hintWait>0?`${S.hintWait} s`:t("opt.off");
  seg(document.getElementById("setColor"),[[true,t("opt.on")],[false,t("opt.off")]],S.colorHint,v=>S.colorHint=(v===true||v==="true"));
  seg(document.getElementById("setShape"),[[true,t("opt.on")],[false,t("opt.off")]],S.shapeHint,v=>S.shapeHint=(v===true||v==="true"));
  seg(document.getElementById("setDark"),[[true,t("opt.on")],[false,t("opt.off")]],S.dark,v=>S.dark=(v===true||v==="true"));
}

/* ---- 图鉴 ---- */
const bookCollapsed={};
function toggleBookGroup(gid){
  bookCollapsed[gid]=!bookCollapsed[gid];
  openBook();
}
function openBook(){
  const list=document.getElementById("bookList");
  list.innerHTML="";
  const bands=[...new Set(LEVELS.map(l=>l.id.split(".")[0]))];   // A1 / A2 / B1
  for(const band of bands){
    const collapsed=!!bookCollapsed[band];
    const head=document.createElement("button");
    head.className="book-group book-toggle";
    head.innerHTML=`<i>${collapsed?"▸":"▾"}</i> ${band}`;
    head.onclick=()=>toggleBookGroup(band);
    list.appendChild(head);
    if(collapsed) continue;
    LEVELS.filter(l=>l.id.split(".")[0]===band).forEach(lv=>{
      const lvh=document.createElement("div");
      lvh.className="book-sub";
      lvh.textContent=lv.id;
      list.appendChild(lvh);
      VERBS.forEach((V,i)=>{
        if(!lv.verbs.includes(i)) return;
        const got=save.collected.includes(V.inf);
        const row=document.createElement("div");
        row.className="book-row"+(got?" viewable":"");
        row.innerHTML=got
          ?`<svg class="book-art" viewBox="0 0 120 120">${artSVG(i,save.style)}</svg>
            <div class="book-main"><b>${V.inf}</b><small>${V.sg} · ${V.pl} · ${V.pp}</small></div>
            <span class="book-tag">${glossOf(V)}<br><span class="book-count">×${save.counts[V.inf]||0}</span></span>`
          :`<div class="book-art empty">?</div>
            <div class="book-main"><b>${t("book.locked")}</b><small>${t("book.lockedsub")}</small></div>`;
        if(got){ row.title=t("book.view"); row.onclick=()=>showCard(i); }
        list.appendChild(row);
      });
    });
  }
  document.getElementById("bookDrawer").classList.add("on");
}

/* ---- 事件绑定 ---- */
document.getElementById("btnMenu").onclick=openMenu;
document.getElementById("btnHint").onclick=()=>{ lastAction=Date.now(); hint(); };
document.getElementById("btnBook").onclick=openBook;
document.getElementById("mNew").onclick=()=>{ document.getElementById("menuScreen").classList.remove("on"); startLevel(LEVELS[0].id); };
document.getElementById("mContinue").onclick=()=>{
  document.getElementById("menuScreen").classList.remove("on");
  startLevel(window.__continueId||LEVELS[0].id);
};
document.getElementById("mLevels").onclick=()=>showMenuView("levels");
document.getElementById("mDaily").onclick=()=>{ if(save.unlocked<MODE_UNLOCK) return; document.getElementById("menuScreen").classList.remove("on"); startDaily(); };
document.getElementById("mEndless").onclick=()=>{ if(save.unlocked<MODE_UNLOCK) return; document.getElementById("menuScreen").classList.remove("on"); startEndless(); };
document.getElementById("mBack").onclick=()=>showMenuView("main");
document.getElementById("mHelp").onclick=()=>document.getElementById("helpModal").classList.add("on");
document.getElementById("mSettings").onclick=openSettings;
document.getElementById("learnBanner").onclick=hideBanner;
document.getElementById("btnVoiceTest").onclick=()=>speakVerb(VERBS[8]);   // lopen 四形试听
document.getElementById("setVolume").oninput=e=>{ save.settings.volume=+e.target.value; persist(); };
document.getElementById("setTts").oninput=e=>{ save.settings.ttsVolume=+e.target.value; persist(); };
document.getElementById("setHintWait").oninput=e=>{
  save.settings.hintWait=+e.target.value; persist();
  document.getElementById("hintWaitVal").textContent=save.settings.hintWait>0?`${save.settings.hintWait} s`:t("opt.off");
};
document.getElementById("cardClose").onclick=e=>{e.stopPropagation(); closeCard();};
document.getElementById("cardPanel").onclick=()=>{
  const m=document.getElementById("cardModal");
  if(!m.classList.contains("gloss-open")){ m.classList.add("gloss-open"); document.getElementById("cardTip").textContent=t("card.tip2"); }
  else closeCard();
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("on"));
["bookDrawer","helpModal","settingsModal"].forEach(id=>{
  document.getElementById(id).addEventListener("click",e=>{ if(e.target.id===id) e.target.classList.remove("on"); });
});
window.addEventListener("error",e=>{
  window.__errors=window.__errors||[];
  window.__errors.push(String(e.message)+" @"+e.lineno);
});
window.addEventListener("unhandledrejection",e=>{
  window.__errors=window.__errors||[];
  window.__errors.push("REJ: "+String(e.reason&&e.reason.stack||e.reason));
});
window.addEventListener("resize",()=>{
  syncWidths();
  if(!level) return;
  computeLevelFont();
  applyFontToAll();
});

/* ---- 调试钩子(自动化测试用) ---- */
window.NLM3={
  state:()=>({level:level&&level.id, score:scoreRun, zetten:zettenRun, streak, collected:[...collectedRun], busy,
    board:board.map(row=>row.map(t=>t?[t.v,t.f]:null))}),
  verbs:VERBS, levels:LEVELS,
  swap:async(r1,c1,r2,c2)=>trySwap(r1,c1,r2,c2),
  findMove:()=>findHintMove(),
  countMoves:()=>countMoves(),
  getLastAction:()=>lastAction,
  setLastAction:v=>lastAction=v,
  forceTimeUp:()=>{ dailyLeft=1; },
  install(spec){ // 调试:按 [[r,c,verbIdx,form]] 覆写棋盘并重建 DOM
    for(const [r,c,v,f] of spec){ if(board[r]&&board[r][c]){ board[r][c].v=v; board[r][c].f=f; } }
    boardEl.innerHTML="";
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) boardEl.appendChild(makeTileEl(board[r][c],r,c));
  },
  settings:()=>({...save.settings}),
  banner:()=>document.getElementById("learnBanner").className,
};

initVoices();
applySettings();
syncWidths();
window.addEventListener("orientationchange",()=>setTimeout(syncWidths,250));
openMenu();
</script>
</body>
