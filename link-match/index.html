<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Koppelen · sterke werkwoorden</title>
<style>
  :root{
    --ink:#33415c;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#e4dfd4;
    --accent:#e8734a;
    --dim:rgba(51,65,92,.42);
    --tile-s:42%; --tile-l:92%; --tile-ink:28%; --tile-edge:80%;
    --hot:#e06b45;
  }
  /* ============ 主题 · Grug 手作(P2;docs/mockups/aesthetics.html 方向 D) ============ */
  body.theme-grug{
    --hand:"Chalkboard SE","Comic Sans MS","Marker Felt","Segoe Print",cursive;
    font-family:var(--hand);
  }
  body.theme-grug .tag, body.theme-grug .goal-pill, body.theme-grug .score-tag, body.theme-grug .combo-tag,
  body.theme-grug .dock-btn, body.theme-grug .menu-btn, body.theme-grug .lv-btn,
  body.theme-grug .btn, body.theme-grug .panel h1, body.theme-grug .panel h2{ font-family:var(--hand); }
  body.theme-grug:not(.dark){
    --hot:#c9563c;
    --ink:#3b332a;
    --paper:#ece1c9;
    --card:#f6efdd;
    --line:#d9ccae;
    --accent:#b3543c;
    --dim:rgba(59,51,42,.45);
  }
  body.theme-grug:not(.dark) .face{
    background:color-mix(in srgb, hsl(var(--h) 42% 62%) 12%, #faf3e3);
    color:#3b332a;
    box-shadow:inset 0 0 0 2.2px #3b332a, 3px 4px 0 rgba(59,51,42,.14);
    font-weight:500;
  }
  body.theme-grug:not(.dark) .tile.k-inf .face{ border-radius:15px 18px 14px 19px; }
  body.theme-grug:not(.dark) .tile.k-sg .face{ border-radius:20px 16px 21px 15px; }
  body.theme-grug:not(.dark) .tile.k-pl .face{ border-radius:4px 7px 3px 6px; }
  body.theme-grug:not(.dark) .tile.k-pp .face{ border-radius:18px 6px 19px 5px; clip-path:polygon(0 0, 76% 0, 100% 24%, 100% 100%, 24% 100%, 0 76%); }
  body.theme-grug:not(.dark) .tile.k-inf .face::after{
    content:""; position:absolute; left:7%; right:5%; bottom:5%;
    height:10px; border-radius:0; background:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M1.5 6 Q28 2.4 55 4.8 T99 3.6" stroke="%233b332a" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>');
    background-size:100% 100%;
  }
  body.theme-grug:not(.dark) .tile.k-inf .face::before{ display:none; }
  body.theme-grug:not(.dark) .tile.sel .face{ scale:1.05; filter:none; outline:3px dashed var(--accent); outline-offset:3px; }
  body.theme-grug:not(.dark) .hud-btn{ border:2.2px solid var(--ink); border-radius:13px 16px 12px 17px; background:var(--card); box-shadow:2px 3px 0 rgba(59,51,42,.14); }
  body.theme-grug:not(.dark) .tag{ border:2px solid var(--ink); border-radius:13px 16px 12px 17px; background:var(--card); font-size:15px; }
  body.theme-grug:not(.dark) .goal-pill{ border:2px solid var(--ink); border-radius:15px 12px 17px 13px; background:var(--card); font-size:13.5px; }
  body.theme-grug:not(.dark) .score-tag{ border:2px solid var(--ink); border-radius:16px 12px 17px 13px; background:#e3b52e; color:#3b332a; font-size:15.5px; min-width:58px; height:40px; padding:0 11px; display:inline-flex; align-items:center; justify-content:center; }
  body.theme-grug:not(.dark) .dock-btn{ border:2.2px solid var(--ink); background:var(--card); color:var(--ink); border-radius:15px 12px 17px 13px; box-shadow:2.5px 3.5px 0 rgba(59,51,42,.15); font-size:14px; }
  body.theme-grug:not(.dark) .menu-btn{ border:2.2px solid var(--ink); background:var(--card); border-radius:15px 12px 17px 13px; box-shadow:2.5px 3.5px 0 rgba(59,51,42,.12); font-size:15.5px; }
  body.theme-grug:not(.dark) .panel{ border:2.5px solid var(--ink); box-shadow:5px 7px 0 rgba(59,51,42,.14); }
  body.theme-grug:not(.dark) .lv-btn{ border:2px solid var(--ink); border-radius:14px 11px 16px 12px; font-size:14px; }
  body.theme-grug:not(.dark) .lv-btn.done{ background:#e4e6cf; border-color:var(--ink); }
  body.theme-grug:not(.dark) .btn{ border:2.2px solid var(--ink); border-radius:14px 12px 16px 13px; }
  .theme-grug #bannerArt svg,.theme-grug #cardArt svg,.theme-grug .book-art svg{ filter:url(#grugRough); }
  body.theme-grug.dark{
    --tile-s:14%; --hot:#c9563c;
  }
  .tile.lit .face{ box-shadow:inset 0 0 0 2.8px var(--hot), 0 0 12px color-mix(in srgb, var(--hot) 42%, transparent); }
  body.theme-grug:not(.dark) .tile.lit .face{ box-shadow:inset 0 0 0 2.8px var(--hot), 3px 4px 0 rgba(59,51,42,.14); }
  .score-tag.celebrate{ background:var(--hot); color:#fbf3e6; }
  .score-tag.celebrate .hico{ display:none; }
  .cele{ display:inline-block; font-size:13px; white-space:nowrap; animation:celeIn .45s ease; }
  @keyframes celeIn{ 0%{ transform:translateY(15px) rotate(5deg); opacity:0; } 100%{ transform:none; opacity:1; } }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  body.theme-grug:not(.dark) .menu-btn.primary{ background:var(--hot); color:#fbf3e6; }
  body.theme-grug:not(.dark) .btn.primary{ background:var(--hot); border-color:var(--ink); color:#fbf3e6; }
  /* ============ /主题 Grug ============ */

  body.dark{
    --ink:#dfe5f0;
    --paper:#222834;
    --card:#2b3342;
    --line:#3d4757;
    --dim:rgba(10,14,22,.55);
    --tile-s:30%; --tile-l:26%; --tile-ink:84%; --tile-edge:15%;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
    overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}

  /* ---------- HUD ---------- */
  #hud{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:10px 2px 8px;
  }
  .hud-btn{justify-self:start;}
  .hud-btn{
    width:46px; height:46px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .hud-btn:active{transform:scale(.94);}
  .ic{width:25px; height:25px; flex:none; display:block;}
  .menu-btn .ic{width:24px; height:24px;}
  .dock-btn .ic{width:22px; height:22px;}
  .hud-center{display:flex; align-items:center; gap:7px; justify-self:center;}
  .hud-right{display:flex; align-items:center; gap:6px; justify-self:end; flex:none;}
  .combo-tag{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .hico{width:17px; height:17px; flex:none; display:block;}
  .score-tag .hico{width:19px; height:19px;}
  .score-tag b{font-weight:800; margin-left:3px;}
  .tag{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:7px 13px; font-size:15px; font-weight:800; white-space:nowrap;
  }
  .goal-pill{
    position:relative; overflow:hidden; min-width:96px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:14px; font-weight:800; text-align:center;
  }
  .goal-pill i{
    position:absolute; inset:0; width:0%;
    background:linear-gradient(90deg, hsl(150 55% 65% / .5), hsl(150 60% 48% / .8));
    transition:width .45s cubic-bezier(.3,1.2,.5,1);
  }
  .goal-pill span{position:relative;}
  .score-tag{
    font-size:20px; font-weight:800; letter-spacing:.3px; line-height:1;
    padding:3px 6px;
    background:linear-gradient(135deg,#f5b942,#e8734a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .score-tag.bump{animation:scoreBump .32s ease;}
  @keyframes scoreBump{ 0%{scale:1;} 40%{scale:1.22;} 100%{scale:1;} }
  .combo-tag{
    background:linear-gradient(135deg,#ff9d2e,#e8554a); color:#fff; border:none;
    padding:6px 13px; border-radius:999px; font-size:14px; font-weight:800;
    animation:comboPop .25s ease, comboGlow 1.6s ease-in-out infinite;
  }
  @keyframes comboPop{ 0%{scale:.6;} 70%{scale:1.15;} 100%{scale:1;} }
  @keyframes comboGlow{ 0%,100%{box-shadow:0 0 8px rgba(232,85,74,.35);} 50%{box-shadow:0 0 18px rgba(232,85,74,.6);} }
  @media (max-width:430px){
    .hud-btn{width:40px; height:40px;}
    .ic{width:22px; height:22px;}
    .tag{padding:6px 10px; font-size:13.5px;}
    .goal-pill{padding:6px 10px; font-size:13px; min-width:84px;}
    .score-tag{font-size:17px;}
    .combo-tag{padding:5px 11px; font-size:13px;}
    #hud{padding-top:8px; gap:6px;}
  }

  /* ---------- Board:4×7 网格 + 外圈连线带 ---------- */
  #boardWrap{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    margin:2px 0 10px;
    box-shadow:0 6px 24px rgba(51,65,92,.06);
  }
  #grid{ position:absolute; }
  #pathSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }
  .tile{
    position:absolute; left:0; top:0;
    transition:transform .18s ease, opacity .25s;
    will-change:transform;
  }
  .face{
    width:90%; height:90%; margin:5%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:hsl(var(--h) var(--tile-s) var(--tile-l));
    color:hsl(var(--h) 45% var(--tile-ink));
    box-shadow:inset 0 -3px 0 hsl(var(--h) var(--tile-s) var(--tile-edge));
    font-weight:700; line-height:1.05; text-align:center;
    overflow:hidden; padding:0 2px;
    border-radius:18%;
    transition:filter .15s, scale .15s;
  }
  .tile.k-pl .face{border-radius:6%;}
  .tile.k-pp .face{border-radius:0; clip-path:polygon(0 0, 74% 0, 100% 26%, 100% 100%, 26% 100%, 0 74%);}
  .tile.k-inf .face::after{
    content:""; position:absolute; left:8%; right:8%; bottom:6%;
    height:4px; border-radius:2px; background:var(--accent);
  }
  .tile.k-inf .face::before{
    content:""; position:absolute; top:6%; right:8%;
    width:6px; height:6px; border-radius:50%; background:var(--accent);
  }
  .tile.sel .face{
    scale:1.07;
    filter:drop-shadow(0 0 5px hsl(var(--h) 55% 45%));
  }
  .tile.peer .face{ filter:drop-shadow(0 0 2.5px hsl(var(--h) 45% 55%)); }
  .tile.hint .face{animation:hintPulse 1.1s ease-in-out 3;}
  @keyframes hintPulse{
    0%,100%{filter:none; scale:1;}
    50%{filter:drop-shadow(0 0 7px hsl(var(--h) 60% 50%)); scale:1.08;}
  }
  .tile.gone{z-index:5;}
  .tile.gone .face{animation:goneAnim .28s ease forwards;}
  @keyframes goneAnim{ to{ scale:1.35; opacity:0; } }
  .tile.shake .face{animation:shakeX .3s ease;}
  @keyframes shakeX{ 0%,100%{translate:0;} 25%{translate:-4px 0;} 75%{translate:4px 0;} }

  /* ---------- 手感加强:闪亮 + 粒子 + 得分弹字 ---------- */
  .tile.flash .face{ animation:flashAnim .18s ease; }
  @keyframes flashAnim{ 0%{ filter:brightness(1.28) saturate(1.3); } 100%{ filter:brightness(1); } }
  #pathSvg .spark{ animation:sparkAnim .5s ease-out forwards; transform-box:fill-box; transform-origin:center; }
  @keyframes sparkAnim{ 0%{ scale:.3; opacity:.95; } 100%{ scale:2.8; opacity:0; } }
  #pathSvg .ring{ animation:ringAnim .55s ease-out forwards; transform-box:fill-box; transform-origin:center; }
  @keyframes ringAnim{ 0%{ scale:.4; opacity:.7; } 100%{ scale:3.2; opacity:0; } }
  .score-pop{
    position:absolute; z-index:8; pointer-events:none;
    font-weight:800; font-size:15px; color:var(--accent);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    animation:popRise .8s ease-out forwards; white-space:nowrap;
  }
  @keyframes popRise{ 0%{ translate:0 6px; opacity:0; scale:.7; } 18%{ opacity:1; scale:1.08; } 100%{ translate:0 -26px; opacity:0; scale:1; } }
  .score-pop.big{ font-size:22px; animation:popRiseBig 1s ease-out forwards; color:#e05645; }
  @keyframes popRiseBig{ 0%{ translate:0 10px; opacity:0; scale:.5; } 15%{ opacity:1; scale:1.25; } 70%{ opacity:1; scale:1; } 100%{ translate:0 -34px; opacity:0; } }

  /* ---- 竞品调研试点(P1/P3/P5/P6):里程碑波纹 / 分数飞行 / 彩带 / 交互演示 ---- */
  #boardWrap.ripple{ animation:boardRipple .55s ease; }
  @keyframes boardRipple{ 0%{ box-shadow:0 6px 24px rgba(51,65,92,.06); } 40%{ box-shadow:0 0 0 12px rgba(232,115,74,.22), 0 6px 32px rgba(232,115,74,.3); } 100%{ box-shadow:0 6px 24px rgba(51,65,92,.06); } }
  .score-fly{ position:fixed; z-index:60; font-weight:800; font-size:15px; color:var(--accent); pointer-events:none; text-shadow:0 1px 0 rgba(255,255,255,.6); transition:transform .6s cubic-bezier(.45,-0.15,.75,.35), opacity .6s ease-in; }
  .confetti{ position:absolute; width:8px; height:13px; border-radius:2px; z-index:9; pointer-events:none; animation:confettiFall 1.4s ease-in forwards; }
  @keyframes confettiFall{ 0%{ transform:translate(0,0) rotate(0); opacity:1; } 100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; } }
  #demoBar{ position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:9; background:var(--accent); color:#fff; font-size:12.5px; font-weight:800; padding:7px 15px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.18); pointer-events:none; white-space:nowrap; max-width:94%; overflow:hidden; text-overflow:ellipsis; }
  .tile.demo-target .face{ animation:demoPulse 1s ease infinite; }
  @keyframes demoPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(232,115,74,0); } 50%{ box-shadow:0 0 0 7px rgba(232,115,74,.4); } }


  /* ---------- 计时器紧急态 + 关卡档标题 ---------- */
  .tag.urgent{ color:#fff; background:#e05645; animation:urgentPulse .7s ease infinite; }
  @keyframes urgentPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,86,69,.5);} 50%{ box-shadow:0 0 0 5px rgba(224,86,69,0);} }
  .band-head{
    grid-column:1/-1;
    font-size:11px; font-weight:800; letter-spacing:.12em;
    color:#98a1b0; margin:10px 2px 6px;
  }

  /* ---------- 底部操作坞 + 教学横幅 ---------- */
  #dock{
    position:relative;
    display:flex; gap:12px; justify-content:center;
    margin-top:10px;
    padding:2px 14px calc(24px + env(safe-area-inset-bottom));
  }
  .dock-btn{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:14px; padding:12px 20px; font-size:15px; font-weight:700;
    box-shadow:0 2px 8px rgba(51,65,92,.06);
  }
  .dock-btn:active{transform:scale(.95);}
  #learnBanner{
    position:absolute; left:0; right:0; top:0; bottom:0; z-index:5;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 30px rgba(20,30,50,.28);
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; cursor:pointer; overflow:hidden;
    opacity:0; visibility:hidden; transform:translateY(16px);
    transition:transform .25s cubic-bezier(.3,1.2,.5,1), opacity .22s, visibility .25s;
  }
  #learnBanner.show{opacity:1; visibility:visible; transform:none;}
  #bannerArt{width:46px; height:46px; flex:none;}
  .b-main{flex:1; min-width:0;}
  .b-main b{font-size:23px; font-weight:800; line-height:1.1;}
  #bannerForm{font-size:18px; font-weight:700; color:hsl(var(--h) 45% 40%); margin-top:2px;}
  #bannerGloss{
    margin-left:auto; flex:none; max-width:34%;
    font-size:12.5px; line-height:1.35; text-align:right;
    color:var(--ink); opacity:.6;
  }
  .b-progress{position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--paper);}
  .b-progress i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff9d2e,#e8554a);}
  #learnBanner.show .b-progress i{animation:bprog var(--bdur,10s) linear forwards;}
  @keyframes bprog{ from{width:100%;} to{width:0;} }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:var(--dim);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .overlay.on{opacity:1; pointer-events:auto;}
  .panel{
    background:var(--card); border-radius:20px;
    padding:22px 22px 20px; width:min(88vw,380px);
    box-shadow:0 18px 50px rgba(20,30,50,.25);
    position:relative; max-height:86vh; overflow:auto;
  }
  .panel h1{margin:0 0 4px; font-size:22px;}
  .panel h2{margin:0 0 10px; font-size:17px;}
  .panel p{font-size:13px; line-height:1.65; color:#5a6577; margin:8px 0;}
  body.dark .panel p{color:#a8b2c4;}
  .close-x{
    position:absolute; top:10px; right:10px; width:30px; height:30px;
    border:none; background:none; font-size:18px; color:#98a1b0;
  }
  .menu-btn{
    display:flex; align-items:center; gap:12px;
    width:100%; padding:13px 16px; margin:9px 0;
    border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    font-size:15.5px; font-weight:700; text-align:left;
  }
  .menu-btn:active{transform:scale(.97);}
  .menu-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .menu-btn.ghost{background:var(--paper);}
  .menu-btn .m-label{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .menu-btn small{font-size:10.5px; font-weight:600; color:#8b93a3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .menu-btn.locked{opacity:.5;}
  .lv-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:14px 0 6px;}
  .lv-btn{
    border:1px solid var(--line); background:var(--paper); border-radius:14px;
    padding:12px 6px; text-align:center; color:var(--ink); font-weight:800; font-size:13px;
    position:relative;
  }
  .lv-btn small{display:block; color:#8b93a3; font-size:10px; font-weight:600; margin-top:3px;}
  .lv-btn .lv-round{position:absolute; top:5px; right:8px; font-size:9px; font-weight:700; color:#98a1b0;}
  .lv-btn.locked{opacity:.4; pointer-events:none;}
  .lv-btn.done{border-color:#bcd9c8; background:#eef7f1;}
  body.dark .lv-btn.done{background:#243529; border-color:#2f4a3a;}
  #cardModal{z-index:70;}
  #cardModal .panel{width:min(84vw,330px); text-align:center; cursor:pointer;}
  #cardArt{width:150px; height:150px; margin:6px auto 2px; display:block;}
  #cardInf{font-size:32px; font-weight:800;}
  #cardForms{font-size:13px; color:#8b93a3; margin-top:6px;}
  #cardGloss{
    margin-top:12px; padding:10px 12px; border-radius:12px;
    background:var(--paper); font-size:14px; color:var(--ink); display:none;
  }
  #cardModal.gloss-open #cardGloss{display:block;}
  #cardTip{font-size:11px; color:#a3abb8; margin-top:12px;}
  #resultModal .panel{text-align:center;}
  .btn{
    display:inline-block; border:none; border-radius:12px;
    padding:11px 20px; font-size:14px; font-weight:700; margin:6px 4px 0;
    background:var(--accent); color:#fff;
  }
  .btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
  .btn:active{transform:scale(.96);}
  .set-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .set-row:last-child{border-bottom:none;}
  .set-row>label{font-weight:700;}
  .seg{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .seg button{
    padding:7px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:700;
  }
  .seg button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .set-row input[type=range]{width:140px; accent-color:var(--accent);}
  .book-group{
    display:flex; align-items:center; width:100%; text-align:left;
    background:none; border:none; color:var(--ink);
    font-size:13px; font-weight:800; margin:14px 0 2px; padding:4px 2px;
  }
  .book-group i{font-style:normal; margin-right:6px; color:#98a1b0;}

TIERS.forEach((t,ti)=>{

  LV_ROUNDS.push(R);

  LINK_TYPES.forEach((ty,fi)=>{            // 形式分组:先单数过去式各轮,再复数,最后分词(用户试玩反馈 #1/#3)
    for(let round=0;round<R;round++){

      const verbs=[];
      for(let k=0;k<9;k++) verbs.push(t.pool[(start+k)%t.pool.length]);

const SAVE_KEY="linkmatch.v1";
const DEFAULT_SETTINGS={uiLang:"nl", volume:70, ttsVolume:80, hintWait:12, bannerMs:10, theme:"grug", dark:false};
let save={lUnlocked:1, done:{}, best:{}, dailyBest:{}, dailyDone:null, counts:{}, style:"A", settings:{...DEFAULT_SETTINGS}};
try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(s && typeof s==="object"){ save={...save,...s, settings:{...DEFAULT_SETTINGS, ...(s.settings||{})}}; }
}catch(e){}
// 关卡布局迁移:v1(18 关)→ v2(51 关,7 词)→ v3(42 关,9 词/18 对);done/best 按映射搬家,超出新轮次的记录丢弃
if(save.lvOrder!=="v3"){
  const R2=[3,6,8], B2=[0,9,27];                      // v2:每档轮数与档基址(7 词/关时代)
  const R3=LV_ROUNDS, B3=[0]; for(let i=1;i<R3.length;i++) B3.push(B3[i-1]+R3[i-1]*3);
  const map=k=>{                                       // v2 索引 → v3 索引(新方案无此轮返回 -1)
    const i=+String(k).slice(1);
    if(isNaN(i)||i>=51) return i>=0?i:-1;
    let b=0; while(b<2 && i>=B2[b+1]) b++;
    const w=i-B2[b], f=Math.floor(w/R2[b]), r=w%R2[b];
    if(f>2||r>=R3[b]) return -1;
    return B3[b]+f*R3[b]+r;
  };
  if(save.lvOrder==="v2"||(save.done&&Object.keys(save.done).some(k=>/^L\d+$/.test(k)))){
    const nd={}, nb={};
    for(const k in save.done){ if(save.done[k]&&/^L\d+$/.test(k)){ const m2=map(k); if(m2>=0) nd["L"+m2]=true; } }
    for(const k in save.best){ if(/^L\d+$/.test(k)){ const m2=map(k); if(m2>=0) nb["L"+m2]=save.best[k]; } else nb[k]=save.best[k]; }
    save.done=nd; save.best=nb;
  }
  save.lvOrder="v3";
}

/* ================= 音效/语音 ================= */
let actx=null;
function blip(freq,dur=.08,type="sine",gain=.12){
  const vol=(save.settings?save.settings.volume:70)/100;
  if(vol<=0) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain*vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
let nlVoice=null;
function updateVoiceName(){
  const el=document.getElementById("voiceName");
  if(el) el.textContent = nlVoice ? nlVoice.name : t("set.novoice");
}
function initVoices(){
  if(!("speechSynthesis" in window)) return;
  const pick=()=>{
    const vs=window.speechSynthesis.getVoices();
    nlVoice = vs.find(v=>(v.lang||"").toLowerCase().replace("_","-")==="nl-nl")
           || vs.find(v=>(v.lang||"").toLowerCase().startsWith("nl")) || null;
    updateVoiceName();
  };
  pick();
  window.speechSynthesis.onvoiceschanged=pick;
}
function speakPair(V,form){
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || save.settings.ttsVolume<=0){ res(); return; }
    try{
      window.speechSynthesis.cancel();
      const seq=[V.inf,form];
      let i=0;
      const next=()=>{
        if(i>=seq.length){ res(); return; }
        const u=new SpeechSynthesisUtterance(seq[i++]);
        u.lang="nl-NL"; if(nlVoice) u.voice=nlVoice;
        u.rate=0.82; u.volume=save.settings.ttsVolume/100;
        u.onend=next; u.onerror=next;
        window.speechSynthesis.speak(u);
      };
      next();
    }catch(e){ res(); }
  });
}
function stopSpeech(){ if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} } }

  let s="";
  const head=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="8.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>${ctx.sw?"":`<circle cx="${cx-2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/><circle cx="${cx+2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/>`}`;
  if(pose==="sit"){
    s+=head(x,y-38);
    s+=limb(ctx,[[x,y-29.5],[x,y-14]]);
    s+=limb(ctx,[[x,y-14],[x+9,y-11],[x+11,y]]);
    s+=limb(ctx,[[x,y-14],[x+6,y-9],[x+7,y]]);
    s+=limb(ctx,[[x,y-24],[x+8,y-17]]);
    s+=limb(ctx,[[x,y-24],[x-6,y-16]]);
    return `<g${flipG}>${s}</g>`;
  }
  if(pose==="lie"){
    s+=limb(ctx,[[x-14,y-30],[x-26,y-27]])
      +limb(ctx,[[x-6,y-31],[x-20,y-24]])
      +`<rect x="${x-24}" y="${y-40}" width="34" height="13" rx="6.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>`
      +head(x+18,y-34);
    return `<g${flipG}>${s}</g>`;
  }
  const lean=pose==="run"?3:0;
  s+=head(x+lean,y-38);
  s+=limb(ctx,[[x+lean,y-29.5],[x,y-12]]);
  const legEnds={
    stand:[[-6,0],[6,0]], open:[[-6,0],[6,0]],
    walk:[[-9,0],[8,-1]], run:[[-10,-1],[9,0]],
    hold:[[-5,0],[6,0]],  reach:[[-5,0],[6,0]],
  }[pose]||[[-6,0],[6,0]];
  s+=limb(ctx,[[x,y-12],[x+legEnds[0][0],y+legEnds[0][1]]]);
  s+=limb(ctx,[[x,y-12],[x+legEnds[1][0],y+legEnds[1][1]]]);
  const armEnds={
    stand:[[-8,-14],[8,-14]], open:[[-13,-33],[13,-33]],
    walk:[[-9,-18],[9,-15]],  run:[[-9,-20],[13,-24]],
    hold:[[10,-20],[12,-16]], reach:[[16,-24],[-7,-15]],
  }[pose]||[[-8,-14],[8,-14]];
  for(const e of armEnds) s+=limb(ctx,[[x+lean,y-26],[x+e[0],y+e[1]]]);
  return `<g${flipG}>${s}</g>`;
}

function syncSize(){

  const availH=Math.max(240, window.innerHeight - usedH) - RING*2;   // 网格可用高(扣外圈)

  const gridW=tw*COLS, gridH=th*ROWS;

  let maxW=1;
  const src=tiles.length?tiles:(curLevel&&curLevel.verbs?curLevel.verbs.map(vi=>({v:vi,f:curLevel.type,k:"inf"})):[]);

function cellCenter(r,c){   // 外圈坐标(含 0 与 ROWS+1/COLS+1 的环)

}

/* ---- 布点:14 对 + 可解性模拟 ---- */
function buildPairsFrom(picks){   // picks = [{v, f}]:每词原形×2 + 变位×2(变位形式由 f 决定)
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) cells.push([r,c]);
  const tiles=[];
  picks.forEach((p,pi)=>{
    tiles.push({v:p.v,k:"inf",f:p.f,chip:pi},{v:p.v,k:"form",f:p.f,chip:pi},{v:p.v,k:"inf",f:p.f,chip:pi},{v:p.v,k:"form",f:p.f,chip:pi});
  });
  // 洗牌(词块与位置都随机)
  for(let tries=0;tries<60;tries++){
    const pos=[...cells];
    for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pos[i],pos[j]]=[pos[j],pos[i]]; }
    const tl=[...tiles];
    for(let i=tl.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tl[i],tl[j]]=[tl[j],tl[i]]; }
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    pos.forEach(([r,c],i)=>{ g[r][c]={...tl[i]}; });
    if(simulateSolvable(g)) return g;
  }
  // 兜底:相邻成对放置(必然可解)
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  let n=0;
  picks.forEach((p,pi)=>{
    for(let k=0;k<2;k++){
      const r=Math.floor(n/COLS), c=n%COLS;
      g[r][c]={v:p.v,k:"inf",f:p.f,chip:pi}; n++;
      const r2=Math.floor(n/COLS), c2=n%COLS;
      g[r2][c2]={v:p.v,k:"form",f:p.f,chip:pi}; n++;
    }
  });
  return g;
}
function buildPairs(){ return buildPairsFrom(curLevel.verbs.map(vi=>({v:vi,f:curLevel.type}))); }
function occFrom(g){
  const o=Array.from({length:ROWS+2},()=>Array(COLS+2).fill(false));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]) o[r+1][c+1]=true;
  return o;
}
// 路径搜索:≤2 折角,BFS(方向,折角数),含外圈
function findPathOcc(occ,ar,ac,br,bc){
  const A=[ar+1,ac+1], B=[br+1,bc+1];
  const H=ROWS+2, W=COLS+2;
  const pass=(r,c)=> r>=0&&r<H&&c>=0&&c<W && ((r===B[0]&&c===B[1]) || !occ[r][c]);
  const best=Array.from({length:H},()=>Array.from({length:W},()=>[9,9,9,9]));
  const par=Array.from({length:H},()=>Array.from({length:W},()=>null));
  const q=[];
  for(let d=0;d<4;d++){
    const r=A[0]+DR[d], c=A[1]+DC[d];
    if(pass(r,c) && best[r][c][d]>0){
      best[r][c][d]=0;
      if(!par[r][c]) par[r][c]=[null,null,null,null];
      par[r][c][d]={cell:[A[0],A[1]],dir:-1};
      q.push([r,c,d,0]);
    }
  }
  let hit=null;
  while(q.length && !hit){
    const [r,c,d,t]=q.shift();
    if(r===B[0]&&c===B[1]){ hit=[r,c,d]; break; }
    for(const nd of [d,(d+1)%4,(d+3)%4]){
      const nt=t+(nd===d?0:1);
      if(nt>2) continue;
      const r2=r+DR[nd], c2=c+DC[nd];
      if(!pass(r2,c2)) continue;
      if(best[r2][c2][nd]>nt){
        best[r2][c2][nd]=nt;
        if(!par[r2][c2]) par[r2][c2]=[null,null,null,null];
        par[r2][c2][nd]={cell:[r,c],dir:d};
        q.push([r2,c2,nd,nt]);
      }
    }
  }
  if(!hit) return null;
  const pts=[];
  let cur=hit;
  while(cur){
    const [r,c,d]=cur;
    pts.push([r,c]);
    const p=par[r][c][d];
    if(!p) break;
    if(p.dir===-1){ pts.push([p.cell[0],p.cell[1]]); break; }
    cur=[p.cell[0],p.cell[1],p.dir];
  }
  pts.reverse();
  return pts;   // 外圈坐标折线(含 A、B)
}
const DR=[-1,0,1,0], DC=[0,1,0,-1];
function pairConnectable(g,a,b){   // a,b = [r,c];判定同动词 + inf/form 配对 + 路径
  const ta=g[a[0]][a[1]], tb=g[b[0]][b[1]];
  if(!ta||!tb) return false;
  if(ta.v!==tb.v) return false;
  if(ta.k===tb.k) return false;    // 必须 inf + form
  return !!findPathOcc(occFrom(g),a[0],a[1],b[0],b[1]);
}
function findAnyPair(g){
  const list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]) list.push([r,c]);
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i], b=list[j];
    const ta=g[a[0]][a[1]], tb=g[b[0]][b[1]];
    if(ta.v!==tb.v||ta.k===tb.k) continue;
    if(findPathOcc(occFrom(g),a[0],a[1],b[0],b[1])) return [a,b];
  }
  return null;
}
function simulateSolvable(g){
  const clone=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) clone[r][c]=g[r][c]?{...g[r][c]}:null;
  let left=ROWS*COLS;
  while(left>0){
    const p=findAnyPair(clone);
    if(!p) return false;
    clone[p[0][0]][p[0][1]]=null; clone[p[1][0]][p[1][1]]=null;
    left-=2;
  }
  return true;
}
function reshuffleRemaining(){
  const list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(board[r][c]) list.push({t:board[r][c],r,c});
  if(list.length<4) return;
  for(let tries=0;tries<80;tries++){
    const pos=[...list.map(p=>[p.r,p.c])];
    for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pos[i],pos[j]]=[pos[j],pos[i]]; }
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    list.forEach((p,i)=>{ g[pos[i][0]][pos[i][1]]={v:p.t.v,k:p.t.k}; });
    if(findAnyPair(g)){ applyShuffle(g,list); return; }
  }
  applyShuffleShallow(list);
}
function applyShuffle(g,list){
  for(const p of list){ board[p.r][p.c]=null; }
  for(const p of list){
    const nt=g[p.r][p.c];
    board[p.r][p.c]=nt;
    p.t.r=p.r; p.t.c=p.c;
    positionTile(p.t);
  }
}
// 兜底:把剩余块按"原形+变位"成对放入行主序相邻格(经典路径下必然可连)
function applyShuffleShallow(list){
  // 按动词分组:原形与形式各自排队,配成对
  const infs=[], forms=[];
  for(const p of list){ (p.t.k==="inf"?infs:forms).push(p.t); }
  const pairs=[];
  while(infs.length && forms.length){
    const inf=infs.shift(), form=forms.find(f=>f.v===inf.v);
    if(form){ forms.splice(forms.indexOf(form),1); pairs.push([inf,form]); }
    else pairs.push([inf, forms.shift()]);   // 数量失衡的兜底(正常不会发生)
  }
  while(infs.length) pairs.push([infs.shift(), infs.shift()]);
  while(forms.length){ const a=forms.shift(); const b=forms.shift()||a; pairs.push([a,b]); }
  // 行主序收集格子,成对放入相邻格
  const pos=[...list.map(p=>[p.r,p.c])];
  pos.sort((A,B)=> A[0]===B[0] ? A[1]-B[1] : A[0]-B[0]);
  for(const p of list){ board[p.r][p.c]=null; }
  pairs.forEach(([a,b],i)=>{
    const [r1,c1]=pos[i*2], [r2,c2]=pos[i*2+1];
    if(a){ a.r=r1; a.c=c1; board[r1][c1]=a; positionTile(a); }
    if(b){ b.r=r2; b.c=c2; board[r2][c2]=b; positionTile(b); }
  });
}

function occNow(){
  const o=Array.from({length:ROWS+2},()=>Array(COLS+2).fill(false));
  for(const t of tiles) if(t.alive) o[t.r+1][t.c+1]=true;
  return o;
}
function findAnyPairNow(){
  const alive=tiles.filter(t=>t.alive);
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
    const a=alive[i], b=alive[j];
    if(a.v!==b.v||a.k===b.k) continue;
    const o=occNow();
    if(findPathOcc(o,a.r,a.c,b.r,b.c)) return [a,b];
  }
  return null;
}

function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

function dailySeed(){        // 日期字符串 → 确定性 rng(全玩家同日同盘)
  const key=todayKey();
  let h=1779033703 ^ key.length;
  for(const ch of key){ h=Math.imul(h^ch.charCodeAt(0),3432918353); h=((h<<13)|(h>>>19))>>>0; }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
function shuffleWith(arr,r){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function collectedPool(){
  const all=new Set(); TIERS.forEach(tr=>tr.pool.forEach(vi=>all.add(vi)));
  const got=[...all].filter(vi=>(save.counts[VERBS[vi].inf]||0)>0);
  return got.length?got:[0,1,2,3,4,5,6];
}
function sampleModeVerbs(pool,n,r){   // 取 n 个 {v,f}:同一盘内变位词串不重复(同动词可换形式再入)
  const picks=[], seenStr=new Set(), seenPair=new Set();
  const tryPush=(vi)=>{
    if(picks.length>=n) return;
    for(const f of shuffleWith(MODE_FORMS,r)){
      const s=VERBS[vi][f];
      if(seenStr.has(s)||seenPair.has(vi+"/"+f)) continue;
      seenStr.add(s); seenPair.add(vi+"/"+f); picks.push({v:vi,f}); return;
    }
  };
  shuffleWith(pool,r).forEach(tryPush);
  let guard=0;
  while(picks.length<n && guard++<300){ tryPush(pool[Math.floor(r()*pool.length)]); }
  while(picks.length<n){ const vi=pool[guard++%pool.length]; picks.push({v:vi,f:MODE_FORMS[guard%3]}); }  // 极端兜底(收词过少)
  return picks;
}

function attemptPair(a,b){
  if(busy) return false;

  const validPair = a && b && a!==b && a.alive && b.alive && a.v===b.v && a.k!==b.k;

    if(a&&a.el){ a.el.classList.add("shake"); b.el.classList.add("shake");
      setTimeout(()=>{a.el.classList.remove("shake"); b.el.classList.remove("shake");},320); }

  setTimeout(()=>{ a.el.classList.add("gone"); b.el.classList.add("gone"); },170);

function drawPath(path){
  const svg=document.getElementById("pathSvg");
  svg.setAttribute("viewBox",`0 0 ${wrapEl.clientWidth} ${wrapEl.clientHeight}`);
  const hot=getComputedStyle(document.body).getPropertyValue("--hot").trim()||"#e06b45";
  // 端点取两块朝向路径一侧的「边中点」(用户反馈:不连中心)
  const edge=(pt,nxt)=>{
    const [x,y]=cellCenter(pt[0],pt[1]);
    const dx=nxt[0]-pt[0], dy=nxt[1]-pt[1];
    if(Math.abs(dx)>=Math.abs(dy)) return [x+Math.sign(dx)*layout.tw/2, y];
    return [x, y+Math.sign(dy)*layout.th/2];
  };
  const p0=edge(path[0],path[1]);
  const p1=edge(path[path.length-1],path[path.length-2]);
  const ptsStr=[p0,...path.slice(1,-1).map(([r,c])=>cellCenter(r,c)),p1]
    .map(([x,y])=>`${Math.round(x)},${Math.round(y)}`).join(" ");
  svg.innerHTML=
    `<polyline points="${ptsStr}" fill="none" stroke="${hot}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>`+
    `<polyline points="${ptsStr}" fill="none" stroke="${hot}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>`;
  for(const el of [window.__litA,window.__litB]) {}
  setTimeout(()=>{ svg.innerHTML=""; },560);
}

function flyScore(fromEl,text){   // P5:分数从消除处飞向计分器(资源流向,Royal Match 式)
  try{
    const from=fromEl.getBoundingClientRect();
    const to=document.getElementById("scoreTag").getBoundingClientRect();
    const el=document.createElement("div");
    el.className="score-fly"; el.textContent=text;
    el.style.left=(from.left+from.width/2)+"px"; el.style.top=(from.top+from.height/2)+"px";
    document.body.appendChild(el);
    void el.offsetWidth;   // 强制重流,保证 transition 从原位出发(勿用 rAF)
    const dx=(to.left+to.width/2)-(from.left+from.width/2), dy=(to.top+to.height/2)-(from.top+from.height/2);
    el.style.transform=`translate(${dx}px,${dy}px) scale(.45)`;
    el.style.opacity="0";
    setTimeout(()=>el.remove(),680);
  }catch(e){}
}
function confetti(){   // P6:清盘终章彩带
  for(let i=0;i<26;i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.style.left="50%"; el.style.top="28%";
    el.style.background=`hsl(${Math.floor(Math.random()*360)} 70% 60%)`;
    el.style.setProperty("--dx",(Math.random()*wrapEl.clientWidth-wrapEl.clientWidth/2)+"px");
    el.style.setProperty("--dy",(wrapEl.clientHeight*.6+Math.random()*90)+"px");
    el.style.setProperty("--rot",(Math.random()*720-360)+"deg");
    wrapEl.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}

function updateHUD(){

let demo=null;
function maybeStartDemo(){
  if(save.demoDone || mode!=="levels" || !curLevel || curLevel.id!=="L0") return;
  let pair=null;
  for(const vi of curLevel.verbs){
    const inf=tiles.find(t=>t.alive&&t.v===vi&&t.k==="inf");
    const form=tiles.find(t=>t.alive&&t.v===vi&&t.k==="form");
    if(inf&&form&&findPathOcc(occNow(),inf.r,inf.c,form.r,form.c)){ pair=[inf,form]; break; }
  }
  if(!pair) return;
  demo={step:1, inf:pair[0], form:pair[1], bar:null};
  busy=true;   // 演示期间接管输入
  const bar=document.createElement("div");
  bar.id="demoBar";
  bar.textContent=t("demo.step1");
  wrapEl.appendChild(bar);
  demo.bar=bar;
  demo.inf.el.classList.add("demo-target");
}
function demoClick(tile){   // 注意:参数不可叫 t,会遮蔽全局 i18n 函数 t()
  if(demo.step===1){
    if(tile===demo.inf){
      demo.inf.el.classList.remove("demo-target"); demo.form.el.classList.add("demo-target");
      demo.step=2; demo.bar.textContent=t("demo.step2"); blip(480,.05,"sine",.05);
    }else wiggle(demo.inf);
  }else if(demo.step===2){
    if(tile===demo.form){
      demo.form.el.classList.remove("demo-target");
      demo.step=3; demo.bar.textContent=t("demo.step3"); blip(560,.06,"sine",.05);
      setTimeout(()=>{
        busy=false;
        attemptPair(demo.inf,demo.form);   // 连线自己画出来
        if(demo.bar){ demo.bar.remove(); }
        demo=null;
        save.demoDone=true; persist();
        setTimeout(()=>toast(t("demo.go")),650);
      },500);
    }else wiggle(demo.form);
  }
}
function wiggle(t){
  t.el.classList.add("shake"); blip(180,.06,"sine",.04);
  setTimeout(()=>t.el.classList.remove("shake"),320);
}

  settings:()=>({...save.settings}),
  forceTimeUp:()=>{ dailyLeft=1; },
  forceSurvivalEnd:()=>{ if(survivalDeadline) survivalDeadline=Date.now()-1; },
  skipDemo:()=>{ if(demo){ demo=null; const b=document.getElementById("demoBar"); if(b) b.remove(); busy=false; save.demoDone=true; persist(); } },
  save:()=>save,
};

/* ================= 启动 ================= */
initVoices();
applySettings();
syncSize();
openMenu();
</script>
</body>
</html>
