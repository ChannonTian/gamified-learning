<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Koppelen · sterke werkwoorden</title>
<style>
  :root{
    --ink:#33415c;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#e4dfd4;
    --accent:#e8734a;
    --dim:rgba(51,65,92,.42);
    --tile-s:42%; --tile-l:92%; --tile-ink:28%; --tile-edge:80%;
  }
  body.dark{
    --ink:#dfe5f0;
    --paper:#222834;
    --card:#2b3342;
    --line:#3d4757;
    --dim:rgba(10,14,22,.55);
    --tile-s:30%; --tile-l:26%; --tile-ink:84%; --tile-edge:15%;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none;
    overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}

  /* ---------- HUD ---------- */
  #hud{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:10px 2px 8px;
  }
  .hud-btn{justify-self:start;}
  .hud-btn{
    width:46px; height:46px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .hud-btn:active{transform:scale(.94);}
  .ic{width:25px; height:25px; flex:none; display:block;}
  .menu-btn .ic{width:24px; height:24px;}
  .dock-btn .ic{width:22px; height:22px;}
  .hud-center{display:flex; align-items:center; gap:7px; justify-self:center;}
  .hud-right{display:flex; align-items:center; gap:7px; justify-self:end; min-width:0;}
  .tag{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:7px 13px; font-size:15px; font-weight:800; white-space:nowrap;
  }
  .goal-pill{
    position:relative; overflow:hidden; min-width:96px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:14px; font-weight:800; text-align:center;
  }
  .goal-pill i{
    position:absolute; inset:0; width:0%;
    background:linear-gradient(90deg, hsl(150 55% 65% / .5), hsl(150 60% 48% / .8));
    transition:width .45s cubic-bezier(.3,1.2,.5,1);
  }
  .goal-pill span{position:relative;}
  .score-tag{
    font-size:20px; font-weight:800; letter-spacing:.3px; line-height:1;
    padding:3px 6px;
    background:linear-gradient(135deg,#f5b942,#e8734a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .score-tag.bump{animation:scoreBump .32s ease;}
  @keyframes scoreBump{ 0%{scale:1;} 40%{scale:1.22;} 100%{scale:1;} }
  .combo-tag{
    background:linear-gradient(135deg,#ff9d2e,#e8554a); color:#fff; border:none;
    padding:6px 13px; border-radius:999px; font-size:14px; font-weight:800;
    animation:comboPop .25s ease, comboGlow 1.6s ease-in-out infinite;
  }
  @keyframes comboPop{ 0%{scale:.6;} 70%{scale:1.15;} 100%{scale:1;} }
  @keyframes comboGlow{ 0%,100%{box-shadow:0 0 8px rgba(232,85,74,.35);} 50%{box-shadow:0 0 18px rgba(232,85,74,.6);} }
  @media (max-width:430px){
    .hud-btn{width:40px; height:40px;}
    .ic{width:22px; height:22px;}
    .tag{padding:6px 10px; font-size:13.5px;}
    .goal-pill{padding:6px 10px; font-size:13px; min-width:84px;}
    .score-tag{font-size:17px;}
    .combo-tag{padding:5px 11px; font-size:13px;}
    #hud{padding-top:8px; gap:6px;}
  }

  /* ---------- Board:4×7 网格 + 外圈连线带 ---------- */
  #boardWrap{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    margin:2px 0 10px;
    box-shadow:0 6px 24px rgba(51,65,92,.06);
  }
  #grid{ position:absolute; }
  #pathSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }
  .tile{
    position:absolute; left:0; top:0;
    transition:transform .18s ease, opacity .25s;
    will-change:transform;
  }
  .face{
    width:90%; height:90%; margin:5%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:hsl(var(--h) var(--tile-s) var(--tile-l));
    color:hsl(var(--h) 45% var(--tile-ink));
    box-shadow:inset 0 -3px 0 hsl(var(--h) var(--tile-s) var(--tile-edge));
    font-weight:700; line-height:1.05; text-align:center;
    overflow:hidden; padding:0 2px;
    border-radius:18%;
    transition:filter .15s, scale .15s;
  }
  .tile.k-pl .face{border-radius:6%;}
  .tile.k-pp .face{border-radius:0; clip-path:polygon(0 0, 74% 0, 100% 26%, 100% 100%, 26% 100%, 0 74%);}
  .tile.k-inf .face::after{
    content:""; position:absolute; left:8%; right:8%; bottom:6%;
    height:4px; border-radius:2px; background:var(--accent);
  }
  .tile.k-inf .face::before{
    content:""; position:absolute; top:6%; right:8%;
    width:6px; height:6px; border-radius:50%; background:var(--accent);
  }
  .tile.sel .face{
    scale:1.07;
    filter:drop-shadow(0 0 5px hsl(var(--h) 55% 45%));
  }
  .tile.peer .face{ filter:drop-shadow(0 0 2.5px hsl(var(--h) 45% 55%)); }
  .tile.hint .face{animation:hintPulse 1.1s ease-in-out 3;}
  @keyframes hintPulse{
    0%,100%{filter:none; scale:1;}
    50%{filter:drop-shadow(0 0 7px hsl(var(--h) 60% 50%)); scale:1.08;}
  }
  .tile.gone{z-index:5;}
  .tile.gone .face{animation:goneAnim .28s ease forwards;}
  @keyframes goneAnim{ to{ scale:1.35; opacity:0; } }
  .tile.shake .face{animation:shakeX .3s ease;}
  @keyframes shakeX{ 0%,100%{translate:0;} 25%{translate:-4px 0;} 75%{translate:4px 0;} }

  /* ---------- 底部操作坞 + 教学横幅 ---------- */
  #dock{
    position:relative;
    display:flex; gap:12px; justify-content:center;
    margin-top:10px;
    padding:2px 14px calc(24px + env(safe-area-inset-bottom));
  }
  .dock-btn{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:14px; padding:12px 20px; font-size:15px; font-weight:700;
    box-shadow:0 2px 8px rgba(51,65,92,.06);
  }
  .dock-btn:active{transform:scale(.95);}
  #learnBanner{
    position:absolute; left:0; right:0; top:0; bottom:0; z-index:5;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 30px rgba(20,30,50,.28);
    display:flex; align-items:center; gap:10px;
    padding:8px 12px; cursor:pointer; overflow:hidden;
    opacity:0; visibility:hidden; transform:translateY(16px);
    transition:transform .25s cubic-bezier(.3,1.2,.5,1), opacity .22s, visibility .25s;
  }
  #learnBanner.show{opacity:1; visibility:visible; transform:none;}
  #bannerArt{width:46px; height:46px; flex:none;}
  .b-main{flex:1; min-width:0;}
  .b-main b{font-size:23px; font-weight:800; line-height:1.1;}
  #bannerForm{font-size:18px; font-weight:700; color:hsl(var(--h) 45% 40%); margin-top:2px;}
  #bannerGloss{
    margin-left:auto; flex:none; max-width:34%;
    font-size:12.5px; line-height:1.35; text-align:right;
    color:var(--ink); opacity:.6;
  }
  .b-progress{position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--paper);}
  .b-progress i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff9d2e,#e8554a);}
  #learnBanner.show .b-progress i{animation:bprog var(--bdur,10s) linear forwards;}
  @keyframes bprog{ from{width:100%;} to{width:0;} }

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50;
    background:var(--dim);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .22s;
  }
  .overlay.on{opacity:1; pointer-events:auto;}
  .panel{
    background:var(--card); border-radius:20px;
    padding:22px 22px 20px; width:min(88vw,380px);
    box-shadow:0 18px 50px rgba(20,30,50,.25);
    position:relative; max-height:86vh; overflow:auto;
  }
  .panel h1{margin:0 0 4px; font-size:22px;}
  .panel h2{margin:0 0 10px; font-size:17px;}
  .panel p{font-size:13px; line-height:1.65; color:#5a6577; margin:8px 0;}
  body.dark .panel p{color:#a8b2c4;}
  .close-x{
    position:absolute; top:10px; right:10px; width:30px; height:30px;
    border:none; background:none; font-size:18px; color:#98a1b0;
  }
  .menu-btn{
    display:flex; align-items:center; gap:12px;
    width:100%; padding:13px 16px; margin:9px 0;
    border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    font-size:15.5px; font-weight:700; text-align:left;
  }
  .menu-btn:active{transform:scale(.97);}
  .menu-btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .menu-btn.ghost{background:var(--paper);}
  .menu-btn .m-label{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .menu-btn small{font-size:10.5px; font-weight:600; color:#8b93a3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .menu-btn.locked{opacity:.5;}
  .lv-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:14px 0 6px;}
  .lv-btn{
    border:1px solid var(--line); background:var(--paper); border-radius:14px;
    padding:12px 6px; text-align:center; color:var(--ink); font-weight:800; font-size:13px;
  }
  .lv-btn small{display:block; color:#8b93a3; font-size:10px; font-weight:600; margin-top:3px;}
  .lv-btn.locked{opacity:.4; pointer-events:none;}
  .lv-btn.done{border-color:#bcd9c8; background:#eef7f1;}
  body.dark .lv-btn.done{background:#243529; border-color:#2f4a3a;}
  #cardModal{z-index:70;}
  #cardModal .panel{width:min(84vw,330px); text-align:center; cursor:pointer;}
  #cardArt{width:150px; height:150px; margin:6px auto 2px; display:block;}
  #cardInf{font-size:32px; font-weight:800;}
  #cardForms{font-size:13px; color:#8b93a3; margin-top:6px;}
  #cardGloss{
    margin-top:12px; padding:10px 12px; border-radius:12px;
    background:var(--paper); font-size:14px; color:var(--ink); display:none;
  }
  #cardModal.gloss-open #cardGloss{display:block;}
  #cardTip{font-size:11px; color:#a3abb8; margin-top:12px;}
  #resultModal .panel{text-align:center;}
  .btn{
    display:inline-block; border:none; border-radius:12px;
    padding:11px 20px; font-size:14px; font-weight:700; margin:6px 4px 0;
    background:var(--accent); color:#fff;
  }
  .btn.ghost{background:var(--paper); color:var(--ink); border:1px solid var(--line);}
  .btn:active{transform:scale(.96);}
  .set-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 0; border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .set-row:last-child{border-bottom:none;}
  .set-row>label{font-weight:700;}
  .seg{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .seg button{
    padding:7px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:700;
  }
  .seg button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  .set-row input[type=range]{width:140px; accent-color:var(--accent);}
  .book-group{
    display:flex; align-items:center; width:100%; text-align:left;
    background:none; border:none; color:var(--ink);
    font-size:13px; font-weight:800; margin:14px 0 2px; padding:4px 2px;
  }
  .book-group i{font-style:normal; margin-right:6px; color:#98a1b0;}
  .book-sub{font-size:11px; color:#98a1b0; margin:8px 0 2px; font-weight:700;}
  .book-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 6px; border-bottom:1px dashed var(--line);
  }
  .book-row.viewable{cursor:pointer; border-radius:10px;}
  .book-row.viewable:active{background:var(--paper);}
  .book-art{width:44px; height:44px; flex:none;}
  .book-art.empty{
    border-radius:12px; background:var(--paper); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; color:#b6bdc9; font-size:16px;
  }
  .book-main b{font-size:15px;}
  .book-main small{display:block; color:#8b93a3; font-size:11.5px; margin-top:2px;}
  .book-tag{margin-left:auto; font-size:11px; color:#8b93a3; flex:none; text-align:right; line-height:1.5;}
  .book-count{
    display:inline-block; background:var(--paper); border:1px solid var(--line);
    border-radius:8px; padding:1px 6px; font-size:10.5px; font-weight:700; color:#5a6577;
  }
  #toast{
    position:fixed; left:50%; bottom:9vh; transform:translateX(-50%) translateY(8px);
    background:rgba(51,65,92,.88); color:#fff; font-size:13px;
    padding:8px 16px; border-radius:20px; opacity:0; transition:.25s; z-index:80;
    pointer-events:none; white-space:nowrap; max-width:92vw;
  }
  #toast.on{opacity:1; transform:translateX(-50%) translateY(0);}
  .rule-legend{display:flex; gap:10px; margin:10px 0; flex-wrap:wrap;}
  .rule-legend .leg{color:#5a6577; font-size:12px; display:flex; align-items:center; gap:5px;}
  .rule-legend .leg i{
    width:15px; height:12px; display:inline-block; background:#dfe6f2;
    box-shadow:inset 0 -2px 0 #c3cfe4; border-radius:18%;
  }
  body.dark .rule-legend .leg i{background:#3a465a; box-shadow:inset 0 -2px 0 #2c3648;}
  .rule-legend .leg i.s-pl{border-radius:6%;}
  .rule-legend .leg i.s-pp{border-radius:0; clip-path:polygon(0 0, 74% 0, 100% 26%, 100% 100%, 26% 100%, 0 74%);}
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <button class="hud-btn" id="btnMenu" title="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button>
    <div class="hud-center">
      <span class="tag" id="lvlTag">A1</span>
      <span class="goal-pill" id="goalTag"><i id="goalBar"></i><span id="goalTxt">0/14</span></span>
    </div>
    <div class="hud-right">
      <span class="combo-tag" id="comboTag" style="display:none;">🔥 ×2</span>
      <span class="score-tag" id="scoreTag">⭐ 0</span>
    </div>
  </header>

  <div id="boardWrap">
    <div id="grid"></div>
    <svg id="pathSvg"></svg>
  </div>

  <div id="dock">
    <button class="dock-btn" id="btnHint"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.8a6.6 6.6 0 0 0-4.1 11.8c.8.6 1.1 1.5 1.1 2.5h6c0-1 .3-1.9 1.1-2.5A6.6 6.6 0 0 0 12 2.8z" fill="currentColor"/><rect x="9.4" y="18.4" width="5.2" height="2.4" rx="1.2" fill="currentColor"/></svg><span data-i18n="dock.hint">Hint</span></button>
    <button class="dock-btn" id="btnBook"><svg class="ic" viewBox="0 0 24 24"><path d="M11.2 5.2C9.2 3.9 6.6 3.9 5 4.9v14c1.6-1 4.2-1 6.2.3zM12.8 5.2c2-1.3 4.6-1.3 6.2-.3v14c-1.6-1-4.2-1-6.2.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-i18n="dock.book">Verzameling</span></button>
    <div id="learnBanner">
      <svg id="bannerArt" viewBox="0 0 120 120"></svg>
      <div class="b-main">
        <b id="bannerInf"></b>
        <div id="bannerForm"></div>
      </div>
      <div id="bannerGloss"></div>
      <div class="b-progress"><i></i></div>
    </div>
  </div>
</div>

<!-- Hoofdmenu -->
<div class="overlay on" id="menuScreen">
  <div class="panel">
    <div id="menuMain">
      <h1 style="margin-bottom:14px;">Koppelen</h1>
      <button class="menu-btn primary" id="mResume" style="display:none;"><svg class="ic" viewBox="0 0 24 24"><path d="M20 4v16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M15 12H5M9 8l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="menu.back">Terug naar spel</span></button>
      <button class="menu-btn" id="mContinue"><svg class="ic" viewBox="0 0 24 24"><path d="M20 4v16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M15 12H5M9 8l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="menu.continue">Verder spelen</span></button>
      <button class="menu-btn" id="mLevels"><svg class="ic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1"><rect x="3.8" y="3.8" width="7" height="7" rx="2"/><rect x="13.2" y="3.8" width="7" height="7" rx="2"/><rect x="3.8" y="13.2" width="7" height="7" rx="2"/><rect x="13.2" y="13.2" width="7" height="7" rx="2"/></g></svg><span data-i18n="menu.levels">Levels</span></button>
      <button class="menu-btn ghost" id="mHelp"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M9.6 9.8a2.5 2.5 0 1 1 3.8 2.2c-.8.5-1.4 1-1.4 1.9" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.2" fill="currentColor"/></svg><span data-i18n="menu.help">Speluitleg</span></button>
      <button class="menu-btn ghost" id="mSettings"><svg class="ic" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16" fill="none"/></g><circle cx="9.2" cy="7" r="2.3" fill="var(--card)" stroke="currentColor" stroke-width="2.1"/><circle cx="15" cy="12" r="2.3" fill="var(--card)" stroke="currentColor" stroke-width="2.1"/><circle cx="8.4" cy="17" r="2.3" fill="var(--card)" stroke="currentColor" stroke-width="2.1"/></svg><span data-i18n="menu.settings">Instellingen</span></button>
    </div>
    <div id="menuLevels" style="display:none;">
      <h2><button class="back-btn" id="mBack" style="border:none;background:none;color:var(--ink);font-size:20px;margin-left:-8px;cursor:pointer;">←</button><span data-i18n="menu.levels">Levels</span></h2>
      <div class="lv-grid" id="lvGrid"></div>
    </div>
  </div>
</div>

<!-- Instellingen -->
<div class="overlay" id="settingsModal">
  <div class="panel">
    <button class="close-x" data-close>✕</button>
    <h2 data-i18n="set.title">Instellingen</h2>
    <div class="set-row">
      <label data-i18n="set.style">Illustratiestijl</label>
      <div class="seg" id="setStyle"></div>
    </div>
    <div class="set-row">
      <label data-i18n="set.lang">Taal</label>
      <div class="seg" id="setLang"></div>
    </div>
    <div class="set-row">
      <label data-i18n="set.sound">Geluid</label>
      <input type="range" id="setVolume" min="0" max="100" step="5">
    </div>
    <div class="set-row">
      <label data-i18n="set.tts">Voorlezen</label>
      <input type="range" id="setTts" min="0" max="100" step="5">
    </div>
    <div class="set-row">
      <label data-i18n="set.voice">Stem</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <span id="voiceName" style="font-size:11.5px; color:#8b93a3; max-width:150px; text-align:right; line-height:1.35;"></span>
        <button id="btnVoiceTest" style="display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:10px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:12.5px; font-weight:700;"><svg class="ic" style="width:16px;height:16px;" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span data-i18n="set.voicetest">Probeer</span></button>
      </div>
    </div>
    <div class="set-row">
      <label data-i18n="set.hintwait">Hint wachttijd</label>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="setHintWait" min="0" max="30" step="1">
        <span id="hintWaitVal" style="font-size:12px; font-weight:700; width:38px; text-align:right;"></span>
      </div>
    </div>

/* ================= 音效/语音 ================= */
let actx=null;
function blip(freq,dur=.08,type="sine",gain=.12){
  const vol=(save.settings?save.settings.volume:70)/100;
  if(vol<=0) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain*vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
let nlVoice=null;
function updateVoiceName(){
  const el=document.getElementById("voiceName");
  if(el) el.textContent = nlVoice ? nlVoice.name : t("set.novoice");
}
function initVoices(){
  if(!("speechSynthesis" in window)) return;
  const pick=()=>{
    const vs=window.speechSynthesis.getVoices();
    nlVoice = vs.find(v=>(v.lang||"").toLowerCase().replace("_","-")==="nl-nl")
           || vs.find(v=>(v.lang||"").toLowerCase().startsWith("nl")) || null;
    updateVoiceName();
  };
  pick();
  window.speechSynthesis.onvoiceschanged=pick;
}
function speakPair(V,form){
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || save.settings.ttsVolume<=0){ res(); return; }
    try{
      window.speechSynthesis.cancel();
      const seq=[V.inf,form];
      let i=0;
      const next=()=>{
        if(i>=seq.length){ res(); return; }
        const u=new SpeechSynthesisUtterance(seq[i++]);
        u.lang="nl-NL"; if(nlVoice) u.voice=nlVoice;
        u.rate=0.82; u.volume=save.settings.ttsVolume/100;
        u.onend=next; u.onerror=next;
        window.speechSynthesis.speak(u);
      };
      next();
    }catch(e){ res(); }
  });
}
function stopSpeech(){ if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} } }

    ? {ink: dark?"#cfd8e3":"#3a4750", sw:4, body:"none", acc:"rgba(255,150,100,.25)", teal:"rgba(84,184,165,.25)", white:"rgba(255,255,255,.45)"}
    : {ink: dark?"#e8edf5":"#39424e", sw:0, body: dark?"#ff9d7a":"#ff8a66", acc:"#ffc94d", teal:"#54b8a5", white:"#ffffff"};
}
function limb(ctx,pts){
  const d=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  return `<path d="${d}" fill="none" stroke="${ctx.ink}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function person(ctx,pose,x,y,flip=false){
  const flipG=flip?` transform="translate(${2*x},0) scale(-1,1)"`:"";
  let s="";
  const head=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="8.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>${ctx.sw?"":`<circle cx="${cx-2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/><circle cx="${cx+2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/>`}`;
  if(pose==="sit"){
    s+=head(x,y-38);
    s+=limb(ctx,[[x,y-29.5],[x,y-14]]);
    s+=limb(ctx,[[x,y-14],[x+9,y-11],[x+11,y]]);
    s+=limb(ctx,[[x,y-14],[x+6,y-9],[x+7,y]]);
    s+=limb(ctx,[[x,y-24],[x+8,y-17]]);
    s+=limb(ctx,[[x,y-24],[x-6,y-16]]);
    return `<g${flipG}>${s}</g>`;
  }
  if(pose==="lie"){
    s+=limb(ctx,[[x-14,y-30],[x-26,y-27]])
      +limb(ctx,[[x-6,y-31],[x-20,y-24]])
      +`<rect x="${x-24}" y="${y-40}" width="34" height="13" rx="6.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>`
      +head(x+18,y-34);
    return `<g${flipG}>${s}</g>`;
  }
  const lean=pose==="run"?3:0;
  s+=head(x+lean,y-38);
  s+=limb(ctx,[[x+lean,y-29.5],[x,y-12]]);
  const legEnds={
    stand:[[-6,0],[6,0]], open:[[-6,0],[6,0]],
    walk:[[-9,0],[8,-1]], run:[[-10,-1],[9,0]],
    hold:[[-5,0],[6,0]],  reach:[[-5,0],[6,0]],
  }[pose]||[[-6,0],[6,0]];
  s+=limb(ctx,[[x,y-12],[x+legEnds[0][0],y+legEnds[0][1]]]);
  s+=limb(ctx,[[x,y-12],[x+legEnds[1][0],y+legEnds[1][1]]]);
  const armEnds={
    stand:[[-8,-14],[8,-14]], open:[[-13,-33],[13,-33]],
    walk:[[-9,-18],[9,-15]],  run:[[-9,-20],[13,-24]],
    hold:[[10,-20],[12,-16]], reach:[[16,-24],[-7,-15]],
  }[pose]||[[-8,-14],[8,-14]];
  for(const e of armEnds) s+=limb(ctx,[[x+lean,y-26],[x+e[0],y+e[1]]]);
  return `<g${flipG}>${s}</g>`;
}

/* ---- 尺寸:确定性布局 ---- */
function syncSize(){
  const hud=document.getElementById("hud"), dock=document.getElementById("dock");
  const usedH=hud.offsetHeight + dock.offsetHeight + 30;
  const availH=Math.max(240, window.innerHeight - usedH) - RING*2;   // 网格可用高(扣外圈)
  const th=Math.min(availH/ROWS, (window.innerWidth*0.94 - RING*2)/COLS*0.75);
  const tw=th*4/3;
  layout={ring:RING, tw, th};
  const gridW=tw*COLS, gridH=th*ROWS;
  boardEl.style.width=gridW+"px"; boardEl.style.height=gridH+"px";
  boardEl.style.left=RING+"px"; boardEl.style.top=RING+"px";
  wrapEl.style.width=(gridW+RING*2)+"px";
  wrapEl.style.height=(gridH+RING*2)+"px";
  document.getElementById("hud").style.width=(gridW+RING*2)+"px";
  document.getElementById("dock").style.width=(gridW+RING*2)+"px";
  // 字号:canvas 实测最长词(原形+形式)
  const ctx=measureCanvas.getContext("2d");
  ctx.font='700 100px -apple-system, "Segoe UI", system-ui, sans-serif';
  let maxW=1;
  if(curLevel) for(const vi of curLevel.verbs){
    const V=VERBS[vi];
    for(const w of [V.inf, V[curLevel.type]]) maxW=Math.max(maxW, ctx.measureText(w).width);
  }
  levelFont=Math.max(8.5,Math.min(20, 100*(tw*0.9-6)/maxW));
  for(const t of tiles){ if(t.el){ t.el.firstChild.style.fontSize=levelFont+"px"; positionTile(t); } }
}
const measureCanvas=document.createElement("canvas");

function positionTile(t){
  t.el.style.left=(t.c*100/COLS)+"%";
  t.el.style.top=(t.r*100/ROWS)+"%";
  t.el.style.width=(100/COLS)+"%";
  t.el.style.height=(100/ROWS)+"%";
  t.el.dataset.r=t.r; t.el.dataset.c=t.c;
}
function cellCenter(r,c){   // 外圈坐标(含 0 与 ROWS+1/COLS+1 的环)
  const x = c===0 ? layout.ring/2 : c===COLS+1 ? layout.ring+COLS*layout.tw+layout.ring/2 : layout.ring+(c-0.5)*layout.tw;
  const y = r===0 ? layout.ring/2 : r===ROWS+1 ? layout.ring+ROWS*layout.th+layout.ring/2 : layout.ring+(r-0.5)*layout.th;
  return [x,y];
}

/* ---- 布点:14 对 + 可解性模拟 ---- */
function buildPairs(){
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) cells.push([r,c]);
  const tiles=[];
  for(const vi of curLevel.verbs){
    tiles.push({v:vi,k:"inf"},{v:vi,k:"form"},{v:vi,k:"inf"},{v:vi,k:"form"});
  }
  // 洗牌(词块与位置都随机)
  for(let tries=0;tries<60;tries++){
    const pos=[...cells];
    for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pos[i],pos[j]]=[pos[j],pos[i]]; }
    const tl=[...tiles];
    for(let i=tl.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tl[i],tl[j]]=[tl[j],tl[i]]; }
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    pos.forEach(([r,c],i)=>{ g[r][c]={...tl[i]}; });
    if(simulateSolvable(g)) return g;
  }
  // 兜底:相邻成对放置(必然可解)
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  let n=0;
  for(const vi of curLevel.verbs){
    for(let k=0;k<2;k++){
      const r=Math.floor(n/COLS), c=n%COLS;
      g[r][c]={v:vi,k:"inf"}; n++;
      const r2=Math.floor(n/COLS), c2=n%COLS;
      g[r2][c2]={v:vi,k:"form"}; n++;
    }
  }
  return g;
}
function occFrom(g){
  const o=Array.from({length:ROWS+2},()=>Array(COLS+2).fill(false));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]) o[r+1][c+1]=true;
  return o;
}
// 路径搜索:≤2 折角,BFS(方向,折角数),含外圈
function findPathOcc(occ,ar,ac,br,bc){
  const A=[ar+1,ac+1], B=[br+1,bc+1];
  const H=ROWS+2, W=COLS+2;
  const pass=(r,c)=> r>=0&&r<H&&c>=0&&c<W && ((r===B[0]&&c===B[1]) || !occ[r][c]);
  const best=Array.from({length:H},()=>Array.from({length:W},()=>[9,9,9,9]));
  const par=Array.from({length:H},()=>Array.from({length:W},()=>null));
  const q=[];
  for(let d=0;d<4;d++){
    const r=A[0]+DR[d], c=A[1]+DC[d];
    if(pass(r,c) && best[r][c][d]>0){
      best[r][c][d]=0;
      if(!par[r][c]) par[r][c]=[null,null,null,null];
      par[r][c][d]={cell:[A[0],A[1]],dir:-1};
      q.push([r,c,d,0]);
    }
  }
  let hit=null;
  while(q.length && !hit){
    const [r,c,d,t]=q.shift();
    if(r===B[0]&&c===B[1]){ hit=[r,c,d]; break; }
    for(const nd of [d,(d+1)%4,(d+3)%4]){
      const nt=t+(nd===d?0:1);
      if(nt>2) continue;
      const r2=r+DR[nd], c2=c+DC[nd];
      if(!pass(r2,c2)) continue;
      if(best[r2][c2][nd]>nt){
        best[r2][c2][nd]=nt;
        if(!par[r2][c2]) par[r2][c2]=[null,null,null,null];
        par[r2][c2][nd]={cell:[r,c],dir:d};
        q.push([r2,c2,nd,nt]);
      }
    }
  }
  if(!hit) return null;
  const pts=[];
  let cur=hit;
  while(cur){
    const [r,c,d]=cur;
    pts.push([r,c]);
    const p=par[r][c][d];
    if(!p) break;
    cur=[p.cell[0],p.cell[1],p.dir===-1?0:p.dir];
    if(p.dir===-1){ break; }
  }
  pts.reverse();
  return pts;   // 外圈坐标折线(含 A、B)
}
const DR=[-1,0,1,0], DC=[0,1,0,-1];
function pairConnectable(g,a,b){   // a,b = [r,c];判定同动词 + inf/form 配对 + 路径
  const ta=g[a[0]][a[1]], tb=g[b[0]][b[1]];
  if(!ta||!tb) return false;
  if(ta.v!==tb.v) return false;
  if(ta.k===tb.k) return false;    // 必须 inf + form
  return !!findPathOcc(occFrom(g),a[0],a[1],b[0],b[1]);
}
function findAnyPair(g){
  const list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]) list.push([r,c]);
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i], b=list[j];
    const ta=g[a[0]][a[1]], tb=g[b[0]][b[1]];
    if(ta.v!==tb.v||ta.k===tb.k) continue;
    if(findPathOcc(occFrom(g),a[0],a[1],b[0],b[1])) return [a,b];
  }
  return null;
}
function simulateSolvable(g){
  const clone=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) clone[r][c]=g[r][c]?{...g[r][c]}:null;
  let left=ROWS*COLS;
  while(left>0){
    const p=findAnyPair(clone);
    if(!p) return false;
    clone[p[0][0]][p[0][1]]=null; clone[p[1][0]][p[1][1]]=null;
    left-=2;
  }
  return true;
}
function reshuffleRemaining(){
  const list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(board[r][c]) list.push({t:board[r][c],r,c});
  if(list.length<4) return;
  for(let tries=0;tries<80;tries++){
    const pos=[...list.map(p=>[p.r,p.c])];
    for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pos[i],pos[j]]=[pos[j],pos[i]]; }
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    list.forEach((p,i)=>{ g[pos[i][0]][pos[i][1]]={v:p.t.v,k:p.t.k}; });
    if(findAnyPair(g)){ applyShuffle(g,list); return; }
  }
  applyShuffleShallow(list);
}
function applyShuffle(g,list){
  for(const p of list){ board[p.r][p.c]=null; }
  for(const p of list){
    const nt=g[p.r][p.c];
    board[p.r][p.c]=nt;
    p.t.r=p.r; p.t.c=p.c;
    positionTile(p.t);
  }
}
// 兜底:把剩余块按"原形+变位"成对放入行主序相邻格(经典路径下必然可连)
function applyShuffleShallow(list){
  // 按动词分组:原形与形式各自排队,配成对
  const infs=[], forms=[];
  for(const p of list){ (p.t.k==="inf"?infs:forms).push(p.t); }
  const pairs=[];
  while(infs.length && forms.length){
    const inf=infs.shift(), form=forms.find(f=>f.v===inf.v);
    if(form){ forms.splice(forms.indexOf(form),1); pairs.push([inf,form]); }
    else pairs.push([inf, forms.shift()]);   // 数量失衡的兜底(正常不会发生)
  }
  while(infs.length) pairs.push([infs.shift(), infs.shift()]);
  while(forms.length){ const a=forms.shift(); const b=forms.shift()||a; pairs.push([a,b]); }
  // 行主序收集格子,成对放入相邻格
  const pos=[...list.map(p=>[p.r,p.c])];
  pos.sort((A,B)=> A[0]===B[0] ? A[1]-B[1] : A[0]-B[0]);
  for(const p of list){ board[p.r][p.c]=null; }
  pairs.forEach(([a,b],i)=>{
    const [r1,c1]=pos[i*2], [r2,c2]=pos[i*2+1];
    if(a){ a.r=r1; a.c=c1; board[r1][c1]=a; positionTile(a); }
    if(b){ b.r=r2; b.c=c2; board[r2][c2]=b; positionTile(b); }
  });
}

/* ---- 渲染 ---- */
function buildBoardDOM(){
  boardEl.innerHTML="";
  pathSvg.innerHTML="";
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const t=board[r][c];
    const el=document.createElement("div");
    el.className="tile "+(t.k==="inf"?"k-inf":"k-"+curLevel.type);
    el.style.setProperty("--h",VERBS[t.v].hue);
    const face=document.createElement("div");
    face.className="face";
    face.textContent=t.k==="inf"?VERBS[t.v].inf:VERBS[t.v][curLevel.type];
    face.style.fontSize=levelFont+"px";
    el.appendChild(face);
    el._t=t; t.el=el;
    positionTile(t);
    boardEl.appendChild(el);
  }
}
function occNow(){
  const o=Array.from({length:ROWS+2},()=>Array(COLS+2).fill(false));
  for(const t of tiles) if(t.alive) o[t.r+1][t.c+1]=true;
  return o;
}
function findAnyPairNow(){
  const alive=tiles.filter(t=>t.alive);
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
    const a=alive[i], b=alive[j];
    if(a.v!==b.v||a.k===b.k) continue;
    const o=occNow();
    if(findPathOcc(o,a.r+1,a.c+1,b.r+1,b.c+1)) return [a,b];
  }
  return null;
}

/* ---- 关卡流程 ---- */
async function startLink(idx){
  const lv=LINK_LEVELS[idx];
  if(!lv) return;
  abandonSession();
  curLevel=lv;
  selected=null; pendingHint=false;
  scoreRun=0; streak=0; lastScoreShown=-1;
  document.getElementById("lvlTag").textContent=displayId(lv);
  syncSize();
  // 布点(可解)
  board=buildPairs();
  tiles=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=board[r][c]; t.r=r; t.c=c; t.alive=true; tiles.push(t); }
  buildBoardDOM();
  pairsLeft=PAIR_TOTAL;
  updateHUD();
  busy=false;
  lastAction=Date.now();
}
function displayId(lv){ return `${lv.band} · ${t(SHORT_KEY[lv.type])}`; }
const PAIR_TOTAL=ROWS*COLS/2;
let pairsLeft=PAIR_TOTAL;

async function attemptPair(a,b){
  if(busy) return;
  busy=true;
  // 词对校验:同动词,且必须 原形+本关形式 各一块(修"任意两块也能消")
  const validPair = a && b && a!==b && a.v===b.v && a.k!==b.k;
  const o=occNow();
  const path=validPair ? findPathOcc(o,a.r+1,a.c+1,b.r+1,b.c+1) : null;
  if(!path){
    a.el.classList.add("shake"); b.el.classList.add("shake");
    blip(180,.08,"sine",.05);
    setTimeout(()=>{a.el.classList.remove("shake"); b.el.classList.remove("shake");},320);
    if(streak>0){ streak=0; updateHUD(); }
    busy=false;
    return;
  }
  // 成功:折线动画
  drawPath(path);
  blip(560+streak*40,.09,"triangle",.08);
  const V=VERBS[a.v];
  const formWord=a.k==="form"?wordOf(a):wordOf(b);
  // 计分:每对 15;连击(横幅窗口内)加成
  streak++;
  let pts=PAIR_POINTS;
  if(streak>=2){ pts+=10*(streak-1); }
  scoreRun+=pts;
  if(a.k==="form"||b.k==="form"){
    const inf=V.inf;
    save.counts[inf]=(save.counts[inf]||0)+1;
    persist();
  }
  a.alive=false; b.alive=false;
  occNow();
  pairsLeft--;
  a.el.classList.add("gone"); b.el.classList.add("gone");
  updateHUD();
  showLearnBanner(a.v, formWord);
  await sleep(300);
  a.el.remove(); b.el.remove();
  board[a.r][a.c]=null; board[b.r][b.c]=null;
  await sleep(150);
  busy=false;
  if(pairsLeft<=0){
    scoreRun+=CLEAR_BONUS;
    updateHUD();
    await sleep(400);
    finishLevel();
  }else if(!findAnyPairNow()){
    toast(t("toast.nopair"));
    await sleep(400);
    reshuffleRemaining();
  }
}
function drawPath(path){
  const svg=document.getElementById("pathSvg");
  svg.setAttribute("viewBox",`0 0 ${wrapEl.clientWidth} ${wrapEl.clientHeight}`);
  const pts=path.map(([r,c])=>cellCenter(r,c).map(n=>Math.round(n)).join(",")).join(" ");
  const col=getComputedStyle(document.body).getPropertyValue("--accent").trim()||"#e8734a";
  svg.innerHTML=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>`;
  setTimeout(()=>{ if(svg.firstChild) svg.removeChild(svg.firstChild); },450);
}

/* ---- 横幅(所有模式,10s=连击窗口) ---- */
let bannerTimer=null, bannerVerb=null;
function hideBanner(){
  clearTimeout(bannerTimer); bannerTimer=null; bannerVerb=null;
  stopSpeech();
  bannerEl.classList.remove("show");
  if(streak>0){ streak=0; updateHUD(); }   // 连击倒计时随卡片结束
}
function showLearnBanner(v,formWord){
  clearTimeout(bannerTimer);
  const V=VERBS[v];
  bannerVerb=v;
  document.getElementById("bannerArt").innerHTML=artSVG(v,save.style);
  document.getElementById("bannerInf").textContent=V.inf;
  document.getElementById("bannerForm").textContent="— "+formWord;
  document.getElementById("bannerGloss").textContent=glossOf(V);
  bannerEl.style.setProperty("--h",V.hue);
  bannerEl.classList.remove("show");
  void bannerEl.offsetWidth;
  bannerEl.classList.add("show");
  bannerEl.onclick=hideBanner;
  bannerTimer=setTimeout(hideBanner,BANNER_MS);
  speakPair(V,formWord);
}
function updateHUD(){
  document.getElementById("goalTxt").textContent=`${PAIR_TOTAL-pairsLeft}/${PAIR_TOTAL}`;
  document.getElementById("goalBar").style.width=Math.round((PAIR_TOTAL-pairsLeft)/PAIR_TOTAL*100)+"%";
  const st=document.getElementById("scoreTag");
  st.textContent=`⭐ ${scoreRun}`;
  if(scoreRun!==lastScoreShown){ st.classList.remove("bump"); void st.offsetWidth; st.classList.add("bump"); lastScoreShown=scoreRun; }
  const ct=document.getElementById("comboTag");
  if(streak>=2){ ct.style.display=""; ct.textContent=`🔥 ×${streak}`; }
  else ct.style.display="none";
}

/* ---- 提示 ---- */
function hint(){
  if(busy||!curLevel) return;
  const p=findAnyPairNow();
  if(!p){ toast(t("toast.nopair")); reshuffleRemaining(); return; }
  clearHint();
  for(const t of p){ t.el.classList.add("hint"); }
  hintTimer=setTimeout(clearHint,2600);
}
function clearHint(){
  if(hintTimer){ clearTimeout(hintTimer); hintTimer=null; }
  boardEl.querySelectorAll(".hint").forEach(el=>el.classList.remove("hint"));
}
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("on"),1800);
}

/* ---- 选择/配对输入 ---- */
boardEl.addEventListener("click",e=>{
  if(busy||!curLevel) return;
  const el=e.target.closest(".tile");
  if(!el) return;
  const t=el._t;
  lastAction=Date.now();
  if(!selected){
    selected=t; el.classList.add("sel"); blip(420,.04,"sine",.04);
    for(const x of tiles){ if(x.alive && x!==t && x.v===t.v) x.el.classList.add("peer"); }
    return;
  }
  if(selected===t){ clearSel(); return; }
  const a=selected, b=t;
  clearSel();
  attemptPair(a,b);
});
function clearSel(){
  if(selected){ selected.el.classList.remove("sel"); selected=null; }
  boardEl.querySelectorAll(".peer").forEach(el=>el.classList.remove("peer"));
}
</script>
<script>
"use strict";
/* ================= i18n ================= */
let board=[];                        // 由引擎脚本赋值
function abandonSession(){ stopSpeech(); hideBanner(); }
function speakVerb(word){
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || save.settings.ttsVolume<=0){ res(); return; }
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(word);
      u.lang="nl-NL"; if(nlVoice) u.voice=nlVoice;
      u.rate=0.82; u.volume=save.settings.ttsVolume/100;
      u.onend=()=>res(); u.onerror=()=>res();
      window.speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
function finishLevel(){
  const idx=LINK_LEVELS.indexOf(curLevel);
  const lvId=LINK_LEVELS[idx].id;
  const disp=displayId(curLevel);
  save.done[lvId]=true;
  if(idx+2>save.lUnlocked){ save.lUnlocked=idx+2; }
  const prev=save.best[lvId]||0;
  const rec=scoreRun>prev;
  if(rec){ save.best[lvId]=scoreRun; }
  persist();
  curLevel=null;
  document.getElementById("resultTitle").textContent=t("result.title");
  document.getElementById("resultText").innerHTML=
    t("result.done")+"<br>"+`⭐ <b>${scoreRun}</b>${rec?" — "+t("result.record"):""} · ${t("result.best")}: ${Math.max(prev,scoreRun)}`;
  const btns=document.getElementById("resultBtns");
  btns.innerHTML="";
  if(idx<LINK_LEVELS.length-1){
    const b=document.createElement("button"); b.className="btn"; b.textContent=t("btn.next");
    b.onclick=()=>{ hideResult(); startLink(idx+1); };
    btns.appendChild(b);
  }
  const b2=document.createElement("button"); b2.className="btn ghost"; b2.textContent=t("btn.again");
  b2.onclick=()=>{ hideResult(); startLink(idx); };
  btns.appendChild(b2);
  const b3=document.createElement("button"); b3.className="btn ghost"; b3.textContent=t("btn.menu");
  b3.onclick=()=>{ hideResult(); openMenu(); };
  btns.appendChild(b3);
  document.getElementById("resultModal").classList.add("on");
  blip(523,.1); setTimeout(()=>blip(659,.1),110); setTimeout(()=>blip(784,.16),220);
}
function hideResult(){ document.getElementById("resultModal").classList.remove("on"); }

/* ================= 菜单 ================= */
function openMenu(){
  if(curLevel){ stopSpeech(); hideBanner(); }   // 会话保活:棋盘保留
  showMenuView("main");
  const resume=document.getElementById("mResume");
  resume.style.display=curLevel?"flex":"none";
  resume.onclick=()=>document.getElementById("menuScreen").classList.remove("on");
  const mc=document.getElementById("mContinue");
  const nextIdx=LEVELS_done();
  mc.style.display=nextIdx<LINK_LEVELS.length?"":"none";
  document.getElementById("menuScreen").classList.add("on");
}
function LEVELS_done(){
  for(let i=0;i<LINK_LEVELS.length;i++){ if(!save.done[LINK_LEVELS[i].id]) return i; }
  return LINK_LEVELS.length;
}
function showMenuView(v){
  document.getElementById("menuMain").style.display=v==="main"?"":"none";
  document.getElementById("menuLevels").style.display=v==="levels"?"":"none";
  if(v==="levels") renderLevelGrid();
}
function renderLevelGrid(){
  const g=document.getElementById("lvGrid");
  g.innerHTML="";
  LINK_LEVELS.forEach((lv,i)=>{
    const b=document.createElement("button");
    const locked=i>save.lUnlocked-1;
    b.className="lv-btn"+(locked?" locked":"")+(save.done[lv.id]?" done":"");
    b.innerHTML=`${lv.band}<small>${t(SHORT_KEY[lv.type])}</small>`;
    b.onclick=()=>{ document.getElementById("menuScreen").classList.remove("on"); startLink(i); };
    g.appendChild(b);
  });
}

/* ================= 设置 ================= */
function seg(el,opts,cur,cb){
  el.innerHTML="";
  for(const [val,label] of opts){
    const btn=document.createElement("button");
    btn.textContent=label;
    if(String(val)===String(cur)) btn.classList.add("sel");
    btn.onclick=()=>{ cb(val); persist(); applySettings(); renderSettings(); };
    el.appendChild(btn);
  }
}
function openSettings(){
  renderSettings();
  document.getElementById("settingsModal").classList.add("on");
}
function renderSettings(){
  const S=save.settings;
  updateVoiceName();
  seg(document.getElementById("setStyle"),[["A","Stijl A"],["B","Stijl B"]],save.style,v=>save.style=v);
  seg(document.getElementById("setLang"),[["nl","Nederlands"],["zh","中文"],["en","English"]],S.uiLang,v=>S.uiLang=v);
  document.getElementById("setVolume").value=S.volume;
  document.getElementById("setTts").value=S.ttsVolume;
  const hw=document.getElementById("setHintWait"); hw.value=S.hintWait;
  document.getElementById("hintWaitVal").textContent=S.hintWait>0?`${S.hintWait} s`:t("opt.off");
  seg(document.getElementById("setDark"),[[true,t("opt.on")],[false,t("opt.off")]],S.dark,v=>S.dark=(v===true||v==="true"));
}

/* ================= 图鉴 ================= */
const bookCollapsed={};
function toggleBookGroup(band){
  bookCollapsed[band]=!bookCollapsed[band];
  openBook();
}
function openBook(){
  const list=document.getElementById("bookList");
  list.innerHTML="";
  const bands=[...new Set(TIERS.map(t=>t.band))];
  for(const band of bands){
    const collapsed=!!bookCollapsed[band];
    const head=document.createElement("button");
    head.className="book-group";
    head.innerHTML=`<i>${collapsed?"▸":"▾"}</i> ${band}`;
    head.onclick=()=>toggleBookGroup(band);
    list.appendChild(head);
    if(collapsed) continue;
    const tier=TIERS.find(t=>t.band===band);
    for(const vi of tier.pool){
      const V=VERBS[vi];
      const got=(save.counts[V.inf]||0)>0;
      const row=document.createElement("div");
      row.className="book-row"+(got?" viewable":"");
      row.innerHTML=got
        ?`<svg class="book-art" viewBox="0 0 120 120">${artSVG(vi,save.style)}</svg>
          <div class="book-main"><b>${V.inf}</b><small>${V.sg} · ${V.pl} · ${V.pp}</small></div>
          <span class="book-tag">${glossOf(V)}<br><span class="book-count">×${save.counts[V.inf]||0}</span></span>`
        :`<div class="book-art empty">?</div>
          <div class="book-main"><b>${t("book.locked")}</b><small>${t("book.lockedsub")}</small></div>`;
      if(got){ row.title=t("book.view"); row.onclick=()=>showCard(vi); }
      list.appendChild(row);
    }
  }
  document.getElementById("bookDrawer").classList.add("on");
}
let cardResolve=null;
function showCard(vi){
  return new Promise(res=>{
    cardResolve=res;
    const V=VERBS[vi];
    document.getElementById("cardArt").innerHTML=artSVG(vi,save.style);
    document.getElementById("cardInf").textContent=V.inf;
    document.getElementById("cardForms").textContent=`${V.sg} · ${V.pl} · ${V.pp}`;
    document.getElementById("cardGloss").textContent=glossOf(V);
    document.getElementById("cardTip").textContent=t("card.tip");
    document.getElementById("cardModal").classList.remove("gloss-open");
    document.getElementById("cardModal").classList.add("on");
    stopSpeech(); speakVerb(V.inf);
  });
}
function closeCard(){
  document.getElementById("cardModal").classList.remove("on");
  stopSpeech();
  if(cardResolve){ const r=cardResolve; cardResolve=null; r(); }
}

/* ================= 提示等待(闲置) ================= */
setInterval(()=>{
  const wait=(save.settings.hintWait||0)*1000;
  if(curLevel && !busy && !anyOverlayOpen() && !boardEl.querySelector(".hint") && Date.now()-lastAction>wait){
    lastAction=Date.now();
    hint();

  else closeCard();
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("on"));
["bookDrawer","helpModal","settingsModal"].forEach(id=>{
  document.getElementById(id).addEventListener("click",e=>{ if(e.target.id===id) e.target.classList.remove("on"); });
});
window.addEventListener("resize",()=>{ syncSize(); });
if(window.visualViewport) window.visualViewport.addEventListener("resize",()=>syncSize());
let lastVW=window.innerWidth, lastVH=window.innerHeight;
setInterval(()=>{ if(window.innerWidth!==lastVW || window.innerHeight!==lastVH){ lastVW=window.innerWidth; lastVH=window.innerHeight; syncSize(); } },1200);

/* ================= 调试钩子 ================= */
window.NLM3={
  state:()=>({level:curLevel&&curLevel.id, pairs:pairsLeft, score:scoreRun, streak, busy,
    board:board.map(row=>row.map(t=>t?[t.v,t.k]:null))}),
  verbs:VERBS, levels:LINK_LEVELS,
  findPair:()=>{ const p=findAnyPairNow(); return p?[p[0].r,p[0].c,p[1].r,p[1].c]:null; },
  connect:(r1,c1,r2,c2)=>attemptPair(board[r1][c1],board[r2][c2]),
  settings:()=>({...save.settings}),
};

/* ================= 启动 ================= */
initVoices();
applySettings();
syncSize();
openMenu();
</script>
</body>
</html>
