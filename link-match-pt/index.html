<style>
  :root{
    --ink:#33415c;
    --paper:#f7f5f0;
    --card:#ffffff;
    --line:#e4dfd4;
    --accent:#e8734a;
    --dim:rgba(51,65,92,.42);
    --tile-s:42%; --tile-l:92%; --tile-ink:28%; --tile-edge:80%;
    --hot:#e06b45;
  }
  /* ============ 主题 · Grug 手作(P2;docs/mockups/aesthetics.html 方向 D) ============ */
  body.theme-grug{
    --hand:"Chalkboard SE","Comic Sans MS","Marker Felt","Segoe Print",cursive;
    font-family:var(--hand);
  }
  body.theme-grug .tag, body.theme-grug .goal-pill, body.theme-grug .score-tag, body.theme-grug .score-bar, body.theme-grug .combo-tag,
  body.theme-grug .dock-btn, body.theme-grug .menu-btn, body.theme-grug .lv-btn,
  body.theme-grug .btn, body.theme-grug .panel h1, body.theme-grug .panel h2{ font-family:var(--hand); }
  body.theme-grug:not(.dark){
    --hot:#c9563c;
    --ink:#3b332a;
    --paper:#ece1c9;
    --card:#f6efdd;
    --line:#d9ccae;
    --accent:#b3543c;
    --dim:rgba(59,51,42,.45);
    --grug-ink:#3b332a;
  }
  body.theme-grug:not(.dark) .face{
    background:color-mix(in srgb, hsl(var(--h) 42% 62%) 12%, #faf3e3);
    color:#3b332a;
    box-shadow:inset 0 0 0 2.2px #3b332a, 3px 4px 0 rgba(59,51,42,.14);
    font-weight:500;
  }
  body.theme-grug .tile.k-inf .face{ border-radius:15px 18px 14px 19px; }
  body.theme-grug .tile.k-sg .face{ border-radius:20px 16px 21px 15px; }
  body.theme-grug .tile.k-pl .face{ border-radius:4px 7px 3px 6px; }
  body.theme-grug .tile.k-pp .face{ border-radius:26px 6px 27px 5px; }   /* 叶子形(手绘感对角圆角) */
  body.theme-grug .tile.k-de .face, body.theme-grug .tile.k-en .face{ border-radius:20px 16px 21px 15px; }
  body.theme-grug .tile.k-ht .face, body.theme-grug .tile.k-s .face{ border-radius:4px 7px 3px 6px; }
  body.theme-grug .tile.k-ap .face{ border-radius:26px 6px 27px 5px; }
  body.theme-grug:not(.dark) .tile.k-inf .face::after{
    content:""; position:absolute; left:32%; width:36%; right:auto; bottom:6%;
    height:10px; border-radius:0; background:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 9 C 20 6, 40 3.5, 55 5 a3.4 3.4 0 1 0 6.2 1.8 C 68 6, 84 4.5, 98 3.2" stroke="%233b332a" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>');
    background-size:100% 100%;
  }
  body.theme-grug.dark .tile.k-inf .face::after{
    content:""; position:absolute; left:32%; width:36%; right:auto; bottom:6%;
    height:10px; border-radius:0; background:none;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 9 C 20 6, 40 3.5, 55 5 a3.4 3.4 0 1 0 6.2 1.8 C 68 6, 84 4.5, 98 3.2" stroke="%23d8cdb2" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>');
    background-size:100% 100%;
  }
  body.theme-grug .tile.k-inf .face::before{ display:none; }
  body.theme-grug .tile.sel .face{ scale:1.05; filter:none; outline:3px dashed var(--accent); outline-offset:3px; }
  /* k-pp 已改叶子形(纯 border-radius):选中态走通用虚线框 */
  body.theme-grug.dark .face{
    background:color-mix(in srgb, hsl(var(--h) 20% 40%) 15%, #26282e);
    color:#e7ddc4;
    box-shadow:inset 0 0 0 2.2px var(--grug-ink), 3px 4px 0 rgba(0,0,0,.3);
    font-weight:500;
  }
  body.theme-grug:not(.dark) .hud-btn{ border:2.2px solid var(--ink); border-radius:13px 16px 12px 17px; background:var(--card); box-shadow:2px 3px 0 rgba(59,51,42,.14); }
  body.theme-grug:not(.dark) .tag{ border:2px solid var(--ink); border-radius:13px 16px 12px 17px; background:var(--card); font-size:15px; }
  body.theme-grug:not(.dark) .goal-pill{ border:2px solid var(--ink); border-radius:15px 12px 17px 13px; background:var(--card); font-size:13.5px; }
  body.theme-grug:not(.dark) .score-tag{ border:2px solid var(--ink); border-radius:16px 12px 17px 13px; background:#e3b52e; color:#3b332a; font-size:15.5px; min-width:58px; height:40px; padding:0 11px; display:inline-flex; align-items:center; justify-content:center; }
  body.theme-grug:not(.dark) .score-bar{ border:2px solid var(--ink); border-radius:15px 12px 17px 13px; background:var(--card); height:40px; }
  body.theme-grug:not(.dark) .score-bar .sb-goal{ color:#8a6d3b; }
  body.theme-grug:not(.dark) .score-bar.record .sb-goal{ color:#b3543c; }
  body.theme-grug:not(.dark) .dock-btn{ border:2.2px solid var(--ink); background:var(--card); color:var(--ink); border-radius:15px 12px 17px 13px; box-shadow:2.5px 3.5px 0 rgba(59,51,42,.15); font-size:14px; }
  body.theme-grug:not(.dark) .menu-btn{ border:2.2px solid var(--ink); background:var(--card); border-radius:15px 12px 17px 13px; box-shadow:2.5px 3.5px 0 rgba(59,51,42,.12); font-size:15.5px; }
  body.theme-grug:not(.dark) .panel{ border:2.5px solid var(--ink); box-shadow:5px 7px 0 rgba(59,51,42,.14); }
  body.theme-grug:not(.dark) .lv-btn{ border:2px solid var(--ink); border-radius:14px 11px 16px 12px; font-size:14px; }
  body.theme-grug:not(.dark) .lv-btn.done{ background:#e4e6cf; border-color:var(--ink); }
  body.theme-grug:not(.dark) .btn{ border:2.2px solid var(--ink); border-radius:14px 12px 16px 13px; }
  .theme-grug .wc-art svg,.theme-grug .book-art svg{ filter:url(#grugRough); }
  body.theme-grug.dark{
    --tile-s:14%; --hot:#c9563c;
    --grug-ink:#d8cdb2;
  }
  .tile.lit .face{ box-shadow:inset 0 0 0 2.8px var(--hot), 0 0 12px color-mix(in srgb, var(--hot) 42%, transparent); }
  body.theme-grug:not(.dark) .tile.lit .face{ box-shadow:inset 0 0 0 2.8px var(--hot), 3px 4px 0 rgba(59,51,42,.14); }
  .score-tag.celebrate, .score-bar.celebrate{ background:var(--hot); color:#fbf3e6; }
  .score-tag.celebrate .hico, .score-bar.celebrate .hico,
  .score-bar.celebrate i, .score-bar.celebrate .sb-goal{ display:none; }
  .cele{ display:inline-block; font-size:13px; white-space:nowrap; animation:celeIn .45s ease; }
  @keyframes celeIn{ 0%{ transform:translateY(15px) rotate(5deg); opacity:0; } 100%{ transform:none; opacity:1; } }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  body.theme-grug:not(.dark) .menu-btn.primary{ background:var(--hot); color:#fbf3e6; }
  body.theme-grug:not(.dark) .btn.primary{ background:var(--hot); border-color:var(--ink); color:#fbf3e6; }
  /* ============ /主题 Grug ============ */

  body.dark{
    --ink:#dfe5f0;
    --paper:#222834;
    --card:#2b3342;
    --line:#3d4757;
    --dim:rgba(10,14,22,.55);
    --tile-s:30%; --tile-l:26%; --tile-ink:84%; --tile-edge:15%;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;   /* 顶部对齐:固定 HUD 后 center 会留 ~200px 空隙 */
    user-select:none; -webkit-user-select:none;
    overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer;}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:10px; right:10px; z-index:20;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:0;
  }
  .hud-left{ display:flex; align-items:center; gap:8px; justify-self:start; }
  .hud-center .tag, .hud-center .goal-pill{ height:36px; display:inline-flex; align-items:center; }
  .hud-right .score-bar{ height:36px; }
  .hud-right .score-tag{ height:36px; display:inline-flex; align-items:center; }
  .hud-btn{
    width:46px; height:46px; border-radius:14px; border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .hud-btn:active{transform:scale(.94);}
  .ic{width:25px; height:25px; flex:none; display:block;}
  .menu-btn .ic{width:24px; height:24px;}
  .dock-btn .ic{width:22px; height:22px;}
  .hud-center{display:flex; align-items:center; gap:7px; justify-self:center;}
  .hud-right{display:flex; align-items:center; gap:6px; justify-self:end; flex:none;}
  .combo-tag{display:inline-flex; align-items:center; gap:4px; white-space:nowrap;}
  .hico{width:17px; height:17px; flex:none; display:inline-block; vertical-align:-3px; margin-right:1px;}
  .score-tag .hico{width:19px; height:19px;}
  .score-tag b{font-weight:800; margin-left:3px;}
  .tag{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:7px 13px; font-size:15px; font-weight:800; white-space:nowrap;
  }
  .goal-pill{
    position:relative; overflow:hidden; min-width:96px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:7px 13px; font-size:14px; font-weight:800; text-align:center;
  }
  .goal-pill i{
    position:absolute; inset:0; width:0%;
    background:linear-gradient(90deg, hsl(150 55% 65% / .5), hsl(150 60% 48% / .8));
    transition:width .45s cubic-bezier(.3,1.2,.5,1);
  }
  .goal-pill span{position:relative;}
  .score-tag{
    font-size:20px; font-weight:800; letter-spacing:.3px; line-height:1;
    padding:3px 6px;
    background:linear-gradient(135deg,#f5b942,#e8734a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .score-tag.bump{animation:scoreBump .32s ease;}
  /* 模式分数条:个人最佳=目标在右端,得分逐步填充(用户反馈) */
  .score-bar{
    position:relative; overflow:hidden; min-width:118px; height:34px;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    display:inline-flex; align-items:center; justify-content:space-between; gap:6px;
    padding:0 11px;
  }
  .score-bar i{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg,#f5b942,#e8734a); opacity:.8;
    transition:width .45s cubic-bezier(.3,1.2,.5,1);
  }
  .score-bar b{ position:relative; font-size:15px; letter-spacing:.3px; }
  .score-bar .sb-goal{ position:relative; display:inline-flex; align-items:center; gap:3px; font-size:12px; opacity:.72; white-space:nowrap; }
  .score-bar.record i{ opacity:1; }
  .score-bar.record .sb-goal{ opacity:1; font-weight:800; color:#b3543c; }
  .score-bar.bump{animation:scoreBump .32s ease;}
  @keyframes scoreBump{ 0%{scale:1;} 40%{scale:1.22;} 100%{scale:1;} }
  .combo-tag{
    background:linear-gradient(135deg,#ff9d2e,#e8554a); color:#fff; border:none;
    height:36px;   /* 与顶栏其他胶囊等高对齐 */
    padding:0 13px; border-radius:999px; font-size:14px; font-weight:800;
    animation:comboPop .25s ease, comboGlow 1.6s ease-in-out infinite;
  }
  @keyframes comboPop{ 0%{scale:.6;} 70%{scale:1.15;} 100%{scale:1;} }
  @keyframes comboGlow{ 0%,100%{box-shadow:0 0 8px rgba(232,85,74,.35);} 50%{box-shadow:0 0 18px rgba(232,85,74,.6);} }
  @media (max-width:430px){
    .hud-btn{width:40px; height:40px;}
    .ic{width:22px; height:22px;}
    .tag{padding:6px 10px; font-size:13.5px;}
    .goal-pill{padding:6px 10px; font-size:13px; min-width:84px;}
    .score-tag{font-size:17px;}
    .score-bar{min-width:104px; height:30px; padding:0 9px;}
    .score-bar b{font-size:13.5px;}
    .score-bar .sb-goal{font-size:11px;}
  /* 模式 HUD 紧凑档:中槽多胶囊 + 右侧条 + 连击在 390px 内必须单行 */
  body.mode-hud .goal-pill{min-width:0; padding:6px 9px;}
  body.mode-hud .tag{padding:6px 9px;}
  body.mode-hud .score-bar{min-width:88px;}
    .combo-tag{padding:0 11px; font-size:13px;}
    #hud{padding-top:8px; gap:6px;}
  }

  /* ---------- Board:4×7 网格 + 外圈连线带 ---------- */
  #boardWrap{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    margin:64px auto 0;
    box-shadow:0 6px 24px rgba(51,65,92,.06);
  }
  #grid{ position:absolute; }
  #pathSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }
  .tile{
    position:absolute; left:0; top:0;
    transition:transform .18s ease, opacity .25s;
    will-change:transform;
  }
  .face{
    width:90%; height:90%; margin:5%;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:hsl(var(--h) var(--tile-s) var(--tile-l));
    color:hsl(var(--h) 45% var(--tile-ink));
    box-shadow:inset 0 -3px 0 hsl(var(--h) var(--tile-s) var(--tile-edge));
    font-weight:700; line-height:1.05; text-align:center;
    overflow:hidden; padding:0 2px;
    border-radius:18%;
    transition:filter .15s, scale .15s;
  }
  .tile.k-pl .face{border-radius:6%;}
  .tile.k-pp .face{border-radius:24px 4px 24px 4px; line-height:1.0;}   /* 叶子形(对角大圆角):描边/选中原生跟随;双行词距收紧 */
  .tile.k-ht .face,.tile.k-s .face{border-radius:6%;}                   /* 名词组:de/en=默认圆角,ht/s=方角,ap=叶形 */
  .tile.k-ap .face{border-radius:24px 4px 24px 4px; line-height:1.0;}
  .tile.k-inf .face::after{
    content:""; position:absolute; left:32%; width:36%; right:auto; bottom:6%;
    height:4px; border-radius:2px; background:var(--accent);
  }
  .tile.k-inf .face::before{
    content:""; position:absolute; top:6%; right:8%;
    width:6px; height:6px; border-radius:50%; background:var(--accent);
  }
  .tile.sel .face{
    scale:1.07;
    filter:drop-shadow(0 0 5px hsl(var(--h) 55% 45%));
  }
  .tile.peer .face{ filter:drop-shadow(0 0 2.5px hsl(var(--h) 45% 55%)); }
  .tile.hint .face{animation:hintPulse 1.1s ease-in-out 3;}
  @keyframes hintPulse{
    0%,100%{filter:none; scale:1;}
    50%{filter:drop-shadow(0 0 7px hsl(var(--h) 60% 50%)); scale:1.08;}
  }
  .tile.gone{z-index:5;}
  .tile.gone .face{animation:goneAnim .28s ease forwards;}
  @keyframes goneAnim{ to{ scale:1.35; opacity:0; } }
  .tile.shake .face{animation:shakeX .3s ease;}
  @keyframes shakeX{ 0%,100%{translate:0;} 25%{translate:-4px 0;} 75%{translate:4px 0;} }

  /* ---------- 手感加强:闪亮 + 粒子 + 得分弹字 ---------- */
  .tile.flash .face{ animation:flashAnim .18s ease; }
  @keyframes flashAnim{ 0%{ filter:brightness(1.28) saturate(1.3); } 100%{ filter:brightness(1); } }
  #pathSvg .spark{ animation:sparkAnim .5s ease-out forwards; transform-box:fill-box; transform-origin:center; }
  @keyframes sparkAnim{ 0%{ scale:.3; opacity:.95; } 100%{ scale:2.8; opacity:0; } }
  #pathSvg .ring{ animation:ringAnim .55s ease-out forwards; transform-box:fill-box; transform-origin:center; }
  @keyframes ringAnim{ 0%{ scale:.4; opacity:.7; } 100%{ scale:3.2; opacity:0; } }
  .score-pop{
    position:absolute; z-index:8; pointer-events:none;
    font-weight:800; font-size:15px; color:var(--accent);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    animation:popRise .8s ease-out forwards; white-space:nowrap;
  }
  @keyframes popRise{ 0%{ translate:0 6px; opacity:0; scale:.7; } 18%{ opacity:1; scale:1.08; } 100%{ translate:0 -26px; opacity:0; scale:1; } }
  .score-pop.big{ font-size:22px; animation:popRiseBig 1s ease-out forwards; color:#e05645; }
  @keyframes popRiseBig{ 0%{ translate:0 10px; opacity:0; scale:.5; } 15%{ opacity:1; scale:1.25; } 70%{ opacity:1; scale:1; } 100%{ translate:0 -34px; opacity:0; } }

  /* ---- 竞品调研试点(P1/P3/P5/P6):里程碑波纹 / 分数飞行 / 彩带 / 交互演示 ---- */
  #boardWrap.ripple{ animation:boardRipple .55s ease; }
  @keyframes boardRipple{ 0%{ box-shadow:0 6px 24px rgba(51,65,92,.06); } 40%{ box-shadow:0 0 0 12px rgba(232,115,74,.22), 0 6px 32px rgba(232,115,74,.3); } 100%{ box-shadow:0 6px 24px rgba(51,65,92,.06); } }
  .score-fly{ position:fixed; z-index:60; font-weight:800; font-size:15px; color:var(--accent); pointer-events:none; text-shadow:0 1px 0 rgba(255,255,255,.6); transition:transform .6s cubic-bezier(.45,-0.15,.75,.35), opacity .6s ease-in; }
  .confetti{ position:absolute; width:8px; height:13px; border-radius:2px; z-index:9; pointer-events:none; animation:confettiFall 1.4s ease-in forwards; }
  @keyframes confettiFall{ 0%{ transform:translate(0,0) rotate(0); opacity:1; } 100%{ transform:translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity:0; } }
  #demoBar{ position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:9; background:var(--accent); color:#fff; font-size:12.5px; font-weight:800; padding:7px 15px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,.18); pointer-events:none; white-space:nowrap; max-width:94%; overflow:hidden; text-overflow:ellipsis; }
  .tile.demo-target .face{ animation:demoPulse 1s ease infinite; }
  @keyframes demoPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(232,115,74,0); } 50%{ box-shadow:0 0 0 7px rgba(232,115,74,.4); } }


  /* ---------- 计时器紧急态 + 关卡档标题 ---------- */
  .tag.urgent{ color:#fff; background:#e05645; animation:urgentPulse .7s ease infinite; }
  @keyframes urgentPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(224,86,69,.5);} 50%{ box-shadow:0 0 0 5px rgba(224,86,69,0);} }
  .band-head{
    grid-column:1/-1;
    font-size:11px; font-weight:800; letter-spacing:.12em;
    color:#98a1b0; margin:10px 2px 6px;
  }

  /* ---------- 底部操作坞 + 教学横幅 ---------- */
  /* 词卡槽:文档流、桌盘下沿留 10px 空隙(槽高含空隙,词卡本体 76/84 不变);按钮行固定屏幕底部 */
  #bannerSlot{ position:relative; height:86px; width:100%; margin:0 auto; }
  body.in-levels #bannerSlot{ height:94px; }
  #dock{
    position:fixed; bottom:calc(env(safe-area-inset-bottom) + 10px); left:50%; transform:translateX(-50%);
    z-index:20;
    display:flex; justify-content:center;
    margin:0; padding:0;
  }

    const pools=LN_FIELDS.map(f=>idxOf(f));
    const flat=[];
    for(let i=0;i<Math.max(...pools.map(p=>p.length));i++){
      for(const pool of pools){ if(pool[i]!=null) flat.push(pool[i]); }
    }
    const per=Math.ceil(flat.length/4);   // 4 组词;每组做两关(短语↔冠词 → 名词↔冠词)
    let num=0;
    for(let g=0;g<4;g++){
      const words=flat.slice(g*per,(g+1)*per);
      LINK_LEVELS.push({id:`L${LINK_LEVELS.length}`, band:"LN", grp:"LN", type:"dh", num:++num, verbs:words, noun:true, hint:true});   // 短语关
      LINK_LEVELS.push({id:`L${LINK_LEVELS.length}`, band:"LN", grp:"LN", type:"dh", num:++num, verbs:words, noun:true, hint:false});  // 裸冠词关
    }
  }
  nounLevels("MV",MV_FIELDS.map(f=>[f,idxOf(f)]));
}
TIERS.forEach((t,ti)=>{
  const R=Math.ceil(t.pool.length/9);      // 轮数=覆盖全池所需;每关 9 词×2 对=18 对
  LV_ROUNDS.push(R);
  LINK_TYPES.forEach((ty,fi)=>{            // 形式分组:先单数过去式各轮,再复数,最后分词(用户试玩反馈 #1/#3)
    for(let round=0;round<R;round++){
      const start=((fi*R)+round)*9 % t.pool.length;   // 步长 9=每关词数:切片相接铺满全池(步长 7 会漏池尾,B1 59 词漏 8 个)
      const verbs=[];
      for(let k=0;k<9;k++) verbs.push(t.pool[(start+k)%t.pool.length]);
      LINK_LEVELS.push({id:`L${LINK_LEVELS.length}`, band:t.band, grp:"PT", type:ty, num:0, verbs});
    }
  });
});
{ // 组内序号:PT 按档续号(A1.1…),其余组组内从 1;gpos=组内位置(分组解锁用)

/* ================= 存档 ================= */
const SAVE_KEY=LANG_META.save;
const DEFAULT_SETTINGS={uiLang:LANG_META.code, volume:70, ttsVolume:80, hintWait:15, bannerMs:15, theme:"grug", dark:false};
let save={gUnlocked:{}, done:{}, best:{}, dailyBest:{}, dailyDone:null, counts:{}, style:"A", settings:{...DEFAULT_SETTINGS}};
try{
  const s=JSON.parse(localStorage.getItem(SAVE_KEY));
  if(s && typeof s==="object"){ save={...save,...s, settings:{...DEFAULT_SETTINGS, ...(s.settings||{})}}; }
}catch(e){}
// 关卡布局迁移:v1(18 关)→ v2(51 关,7 词)→ v3(42 关,9 词/18 对);done/best 按映射搬家,超出新轮次的记录丢弃
// 只对 v2 及更早(无标记)的存档重排——v4/v5 存档的键已是新索引,再进 v2 映射表会损坏进度(v1.21 存量 bug,2026-10-31 修)
if(save.lvOrder==="v2"||save.lvOrder==null){
  const R2=[3,6,8], B2=[0,9,27];                      // v2:每档轮数与档基址(7 词/关时代)
  const R3=TIERS.map(t=>Math.ceil(t.pool.length/9)), B3=[0]; for(let i=1;i<R3.length;i++) B3.push(B3[i-1]+R3[i-1]*3);
  const map=k=>{                                       // v2 索引 → v3 索引(新方案无此轮返回 -1)
    const i=+String(k).slice(1);
    if(isNaN(i)||i>=51) return i>=0?i:-1;
    let b=0; while(b<2 && i>=B2[b+1]) b++;
    const w=i-B2[b], f=Math.floor(w/R2[b]), r=w%R2[b];
    if(f>2||r>=R3[b]) return -1;
    return B3[b]+f*R3[b]+r;
  };
  if(save.lvOrder==="v2"||[save.done,save.best].some(records=>Object.keys(records).some(k=>/^L\d+$/.test(k)))){
    const nd={}, nb={};
    for(const k in save.done){ if(save.done[k]&&/^L\d+$/.test(k)){ const m2=map(k); if(m2>=0) nd["L"+m2]=true; } }
    for(const k in save.best){ if(/^L\d+$/.test(k)){ const m2=map(k); if(m2>=0) nb["L"+m2]=save.best[k]; } else nb[k]=save.best[k]; }
    save.done=nd; save.best=nb;
  }
  save.lvOrder="v3";
}

  if(hasProg){

let actx=null;
function blip(freq,dur=.08,type="sine",gain=.12){
  const vol=(save.settings?save.settings.volume:70)/100;
  if(vol<=0) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(gain*vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
let appVoice=null;
function updateVoiceName(){
  const el=document.getElementById("voiceName");
  if(el) el.textContent = appVoice ? appVoice.name : t("set.novoice");
}
function initVoices(){
  if(!("speechSynthesis" in window)) return;
  const pick=()=>{
    const vs=window.speechSynthesis.getVoices();
    appVoice = vs.find(v=>(v.lang||"").toLowerCase().replace("_","-")===LANG_META.tts.toLowerCase())
           || vs.find(v=>(v.lang||"").toLowerCase().startsWith(LANG_META.code)) || null;
    updateVoiceName();
  };
  pick();
  window.speechSynthesis.onvoiceschanged=pick;
}
let speakGen=0;
let ttsBlockedWarned=false;
function warnTtsBlocked(){
  if(ttsBlockedWarned) return;
  ttsBlockedWarned=true;
  toast(t("tts.blocked"));   // 语音引擎瘫(如内嵌测试窗):utterance 永远排队、不 onstart 也不 onerror
}
function speakWords(seq){
  const gen=++speakGen;   // 代数令牌:新横幅接管后,旧链的延迟回调与 onend 链全部失效
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || save.settings.ttsVolume<=0){ res(); return; }
    try{
      const ss=window.speechSynthesis;
      const busyS=ss.speaking||ss.pending;
      if(busyS) ss.cancel();   // 空队列不要 cancel:Chrome cancel() 后同步 speak() 会被静默吞掉
      let i=0, startedAny=false;
      const next=()=>{
        if(gen!==speakGen){ res(); return; }
        if(i>=seq.length){ res(); return; }
        const u=new SpeechSynthesisUtterance(seq[i++]);
        u.lang=LANG_META.tts; if(appVoice) u.voice=appVoice;
        u.rate=0.82; u.volume=save.settings.ttsVolume/100;
        u.onstart=()=>{ startedAny=true; };
        u.onend=next; u.onerror=next;
        ss.speak(u);
      };
      if(busyS) setTimeout(next,70); else next();   // 刚 cancel 过必须延迟开口(tile-match v0.86 同款修复)
      setTimeout(()=>{ if(gen===speakGen && !startedAny && (ss.speaking||ss.pending)) warnTtsBlocked(); },1300);
    }catch(e){ res(); }
  });
}
function speakPair(V,form){ return speakWords([V.inf,form]); }
function stopSpeech(){ if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} } }

function limb(ctx,pts){

function person(ctx,pose,x,y,flip=false){
  const flipG=flip?` transform="translate(${2*x},0) scale(-1,1)"`:"";
  let s="";
  const head=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="8.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>${ctx.sw?"":`<circle cx="${cx-2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/><circle cx="${cx+2.6}" cy="${cy}" r="1.2" fill="${ctx.ink}"/>`}`;
  if(pose==="sit"){
    s+=head(x,y-38);
    s+=limb(ctx,[[x,y-29.5],[x,y-14]]);
    s+=limb(ctx,[[x,y-14],[x+9,y-11],[x+11,y]]);
    s+=limb(ctx,[[x,y-14],[x+6,y-9],[x+7,y]]);
    s+=limb(ctx,[[x,y-24],[x+8,y-17]]);
    s+=limb(ctx,[[x,y-24],[x-6,y-16]]);
    return `<g${flipG}>${s}</g>`;
  }
  if(pose==="lie"){
    s+=limb(ctx,[[x-14,y-30],[x-26,y-27]])
      +limb(ctx,[[x-6,y-31],[x-20,y-24]])
      +`<rect x="${x-24}" y="${y-40}" width="34" height="13" rx="6.5" fill="${ctx.body}" ${ctx.sw?`stroke="${ctx.ink}" stroke-width="${ctx.sw}"`:""}/>`
      +head(x+18,y-34);
    return `<g${flipG}>${s}</g>`;
  }
  const lean=pose==="run"?3:0;
  s+=head(x+lean,y-38);
  s+=limb(ctx,[[x+lean,y-29.5],[x,y-12]]);
  const legEnds={
    stand:[[-6,0],[6,0]], open:[[-6,0],[6,0]],
    walk:[[-9,0],[8,-1]], run:[[-10,-1],[9,0]],
    hold:[[-5,0],[6,0]],  reach:[[-5,0],[6,0]],
  }[pose]||[[-6,0],[6,0]];
  s+=limb(ctx,[[x,y-12],[x+legEnds[0][0],y+legEnds[0][1]]]);
  s+=limb(ctx,[[x,y-12],[x+legEnds[1][0],y+legEnds[1][1]]]);
  const armEnds={
    stand:[[-8,-14],[8,-14]], open:[[-13,-33],[13,-33]],
    walk:[[-9,-18],[9,-15]],  run:[[-9,-20],[13,-24]],
    hold:[[10,-20],[12,-16]], reach:[[16,-24],[-7,-15]],
  }[pose]||[[-8,-14],[8,-14]];
  for(const e of armEnds) s+=limb(ctx,[[x+lean,y-26],[x+e[0],y+e[1]]]);
  return `<g${flipG}>${s}</g>`;
}

  if(isArt) return t.f;   // 冠词侧:两关都只放裸冠词
  const w=A[t.v][t.f];
  return P_PRONOUN[t.f] ? P_PRONOUN[t.f]+" "+w : w;   // 人称变位:"ga"→"ik ga"(前缀随语言)
};

function cellCenter(r,c){   // 外圈坐标(含 0 与 ROWS+1/COLS+1 的环)

/* ---- 布点:14 对 + 可解性模拟 ---- */
function buildPairsFrom(picks, per=2, gapCount=0){   // per=每词对数(闯关 1 / 模式 2);gapCount=开局随机空格(闯关 2,降低难度)
  const cells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) cells.push([r,c]);
  for(let i=cells.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cells[i],cells[j]]=[cells[j],cells[i]]; }
  const gapKey=new Set(cells.slice(0,gapCount).map(([r,c])=>r+","+c));
  const open=cells.filter(([r,c])=>!gapKey.has(r+","+c));
  const tiles=[];
  picks.forEach((p,pi)=>{
    for(let k=0;k<per;k++) tiles.push({v:p.v,k:"inf",f:p.f,src:p.src,hint:p.hint,chip:pi},{v:p.v,k:"form",f:p.f,src:p.src,hint:p.hint,chip:pi});
  });
  // 洗牌(词块与位置都随机;缺口格永远空置)
  for(let tries=0;tries<60;tries++){
    const pos=[...open];
    for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pos[i],pos[j]]=[pos[j],pos[i]]; }
    pos.length=tiles.length;   // 只取实块数个格位(块数<空位时越界会生成 {...undefined} 幽灵块,demo L3/L4 实测崩坏)
    const tl=[...tiles];
    for(let i=tl.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tl[i],tl[j]]=[tl[j],tl[i]]; }
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    pos.forEach(([r,c],i)=>{ g[r][c]={...tl[i]}; });
    if(simulateSolvable(g)) return g;
  }
  // 兜底:行主序相邻成对放置(相邻 0 折角必然可连;缺口已在 open 之外)
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  tiles.forEach((tl,i)=>{ const [r,c]=open[i]; g[r][c]={...tl}; });
  return g;
}
function buildPairs(){   // 名词关:每词自带类型键(de/ht/en/s/ap,混盘);提示关给名词磁贴带冠词
  return buildPairsFrom(curLevel.verbs.map(vi=>({
    v:vi,
    f: curLevel.noun ? NOUN_FIELD(NOUNS[vi]) : curLevel.type,
    src: curLevel.noun ? "n" : undefined,
    hint: curLevel.noun && curLevel.hint ? true : undefined,
  })), 1, 2);
}
function occFrom(g){
  const o=Array.from({length:ROWS+2},()=>Array(COLS+2).fill(false));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]) o[r+1][c+1]=true;
  return o;
}
// 路径搜索:≤2 折角,BFS(方向,折角数),含外圈
function findPathOcc(occ,ar,ac,br,bc){
  const A=[ar+1,ac+1], B=[br+1,bc+1];
  const H=ROWS+2, W=COLS+2;
  const pass=(r,c)=> r>=0&&r<H&&c>=0&&c<W && ((r===B[0]&&c===B[1]) || !occ[r][c]);
  const best=Array.from({length:H},()=>Array.from({length:W},()=>[9,9,9,9]));
  const par=Array.from({length:H},()=>Array.from({length:W},()=>null));
  const q=[];
  for(let d=0;d<4;d++){
    const r=A[0]+DR[d], c=A[1]+DC[d];
    if(pass(r,c) && best[r][c][d]>0){
      best[r][c][d]=0;
      if(!par[r][c]) par[r][c]=[null,null,null,null];
      par[r][c][d]={cell:[A[0],A[1]],dir:-1};
      q.push([r,c,d,0]);
    }
  }
  let hit=null;
  while(q.length && !hit){
    const [r,c,d,t]=q.shift();
    if(r===B[0]&&c===B[1]){ hit=[r,c,d]; break; }
    for(const nd of [d,(d+1)%4,(d+3)%4]){
      const nt=t+(nd===d?0:1);
      if(nt>2) continue;
      const r2=r+DR[nd], c2=c+DC[nd];
      if(!pass(r2,c2)) continue;
      if(best[r2][c2][nd]>nt){
        best[r2][c2][nd]=nt;
        if(!par[r2][c2]) par[r2][c2]=[null,null,null,null];
        par[r2][c2][nd]={cell:[r,c],dir:d};
        q.push([r2,c2,nd,nt]);
      }
    }
  }
  if(!hit) return null;
  const pts=[];
  let cur=hit;
  while(cur){
    const [r,c,d]=cur;
    pts.push([r,c]);
    const p=par[r][c][d];
    if(!p) break;
    if(p.dir===-1){ pts.push([p.cell[0],p.cell[1]]); break; }
    cur=[p.cell[0],p.cell[1],p.dir];
  }
  pts.reverse();
  return pts;   // 外圈坐标折线(含 A、B)
}
const DR=[-1,0,1,0], DC=[0,1,0,-1];
function pairConnectable(g,a,b){   // a,b = [r,c];判定同动词 + inf/form 配对 + 路径
  const ta=g[a[0]][a[1]], tb=g[b[0]][b[1]];
  if(!ta||!tb) return false;
  if(ta.v!==tb.v) return false;
  if(ta.k===tb.k) return false;    // 必须 inf + form
  return !!findPathOcc(occFrom(g),a[0],a[1],b[0],b[1]);
}
function findAnyPair(g){
  const list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(g[r][c]) list.push([r,c]);
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i], b=list[j];
    const ta=g[a[0]][a[1]], tb=g[b[0]][b[1]];
    if(ta.v!==tb.v||ta.k===tb.k) continue;
    if(findPathOcc(occFrom(g),a[0],a[1],b[0],b[1])) return [a,b];
  }
  return null;
}
function simulateSolvable(g){
  const clone=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) clone[r][c]=g[r][c]?{...g[r][c]}:null;
  let left=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(clone[r][c]) left++;
  while(left>0){
    const p=findAnyPair(clone);
    if(!p) return false;
    clone[p[0][0]][p[0][1]]=null; clone[p[1][0]][p[1][1]]=null;
    left-=2;
  }
  return true;
}
function reshuffleRemaining(){
  const list=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++) if(board[r][c]) list.push({t:board[r][c],r,c});
  if(list.length<4) return;
  for(let tries=0;tries<80;tries++){
    const pos=[...list.map(p=>[p.r,p.c])];
    for(let i=pos.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pos[i],pos[j]]=[pos[j],pos[i]]; }
    const g=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    list.forEach((p,i)=>{ g[pos[i][0]][pos[i][1]]=p.t; });
    if(findAnyPair(g)){ applyShuffle(g,list); return; }
  }
  applyShuffleShallow(list);
}
function applyShuffle(g,list){
  clearSel(); clearHint();
  for(const p of list){ board[p.r][p.c]=null; }
  for(const p of list){
    const nt=g[p.r][p.c];
    board[p.r][p.c]=nt;
    nt.r=p.r; nt.c=p.c;
    positionTile(nt);
  }
}
// 兜底:把剩余块按"原形+变位"成对放入行主序相邻格(经典路径下必然可连)
function applyShuffleShallow(list){
  clearSel(); clearHint();
  // 按动词分组:原形与形式各自排队,配成对
  const infs=[], forms=[];
  for(const p of list){ (p.t.k==="inf"?infs:forms).push(p.t); }
  const pairs=[];
  while(infs.length && forms.length){
    const inf=infs.shift(), form=forms.find(f=>f.v===inf.v);
    if(form){ forms.splice(forms.indexOf(form),1); pairs.push([inf,form]); }
    else pairs.push([inf, forms.shift()]);   // 数量失衡的兜底(正常不会发生)
  }
  while(infs.length) pairs.push([infs.shift(), infs.shift()]);
  while(forms.length){ const a=forms.shift(); const b=forms.shift()||a; pairs.push([a,b]); }
  // 行主序收集格子,成对放入相邻格
  const pos=[...list.map(p=>[p.r,p.c])];
  pos.sort((A,B)=> A[0]===B[0] ? A[1]-B[1] : A[0]-B[0]);
  for(const p of list){ board[p.r][p.c]=null; }
  pairs.forEach(([a,b],i)=>{
    const [r1,c1]=pos[i*2], [r2,c2]=pos[i*2+1];
    if(a){ a.r=r1; a.c=c1; board[r1][c1]=a; positionTile(a); }
    if(b){ b.r=r2; b.c=c2; board[r2][c2]=b; positionTile(b); }
  });
}

function occNow(){
  const o=Array.from({length:ROWS+2},()=>Array(COLS+2).fill(false));
  for(const t of tiles) if(t.alive) o[t.r+1][t.c+1]=true;
  return o;
}
function findAnyPairNow(){
  const alive=tiles.filter(t=>t.alive);
  for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
    const a=alive[i], b=alive[j];
    if(a.v!==b.v||a.k===b.k) continue;
    const o=occNow();
    if(findPathOcc(o,a.r,a.c,b.r,b.c)) return [a,b];
  }
  return null;
}

const DAILY_SECONDS=180;

let mode="levels";           // "levels" | "endless" | "daily"

const MODE_FORMS=["sg","pl","pp"];
function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dailySeed(){        // 日期字符串 → 确定性 rng(全玩家同日同盘)
  const key=todayKey();
  let h=1779033703 ^ key.length;
  for(const ch of key){ h=Math.imul(h^ch.charCodeAt(0),3432918353); h=((h<<13)|(h>>>19))>>>0; }
  return ()=>{ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
}
function shuffleWith(arr,r){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function collectedPool(){
  const all=new Set(); TIERS.forEach(tr=>tr.pool.forEach(vi=>all.add(vi)));
  const got=[...all].filter(vi=>(save.counts[VERBS[vi].inf]||0)>0);
  return got.length?got:[0,1,2,3,4,5,6];
}
function sampleModeVerbs(pool,n,r){   // 一屏只一种词型搭配(用户反馈);同盘变位词串不重复;换盘换型不与上一盘重复
  let f;
  if(modeFormState==null||MODE_FORMS.indexOf(modeFormState)<0){ f=MODE_FORMS[Math.floor(r()*MODE_FORMS.length)]; }
  else{
    const i=MODE_FORMS.indexOf(modeFormState);
    f=MODE_FORMS[(i+1+Math.floor(r()*(MODE_FORMS.length-1)))%MODE_FORMS.length];
  }
  modeFormState=f;
  const picks=[], seenStr=new Set();
  const tryPush=(vi)=>{
    if(picks.length>=n) return;
    if(f==="pp"&&!VERBS[vi].pp) return;   // 无分词的词(如 zullen):pp 盘跳过
    const s=VERBS[vi][f];
    if(seenStr.has(s)) return;
    seenStr.add(s); picks.push({v:vi,f});
  };
  shuffleWith(pool,r).forEach(tryPush);
  let guard=0;
  while(picks.length<n && guard++<300){ tryPush(pool[Math.floor(r()*pool.length)]); }
  while(picks.length<n){ const vi=pool[guard++%pool.length]; picks.push({v:vi,f}); }  // 极端兜底(收词过少)
  return picks;
}
function dealModeBoard(){
  sessionGen++;
  ROWS=9;   // 挑战模式恢复 4×9=36 格盘(9 词×2 对,允许同屏重复)
  document.body.classList.remove("in-levels");
  const picks=sampleModeVerbs(collectedPool(),9,mode==="daily"?modeRng:Math.random);
  clearSel(); clearHint();
  board=buildPairsFrom(picks, 2, 0);
  tiles=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ const t=board[r][c]; if(!t) continue; t.r=r; t.c=c; t.alive=true; tiles.push(t); }
  buildBoardDOM();
  applyTileRotations();
  syncSize();   // 按新盘词长校字号
  PAIR_TOTAL=tiles.length/2;
  pairsLeft=PAIR_TOTAL;
  updateHUD();
}

/* 全程非阻塞(用户反馈:动效不得挡住快速连击):状态同步落账,动画与收尾走 setTimeout */
function attemptPair(a,b){
  if(busy) return false;
  // 词对校验:同动词,且必须 原形+本关形式 各一块(修"任意两块也能消")
  const validPair = a && b && a!==b && a.alive && b.alive && a.v===b.v && a.k!==b.k;
  const o=occNow();
  const path=validPair ? findPathOcc(o,a.r,a.c,b.r,b.c) : null;
  if(!path){
    if(a&&a.el){ a.el.classList.add("shake"); b.el.classList.add("shake");
      setTimeout(()=>{a.el.classList.remove("shake"); b.el.classList.remove("shake");},320); }
    blip(180,.08,"sine",.05);
    if(streak>0){ streak=0; updateHUD(); }
    reshuffleIfStuck();   // 失败尝试后同样查死局
    return false;
  }
  // 成功:折线动画 + 音效 + 闪亮 + 弹字
  drawPath(path);
  const V=wordSrc(a)[a.v];
  const formTile=a.k==="form"?a:b;
  const formWord=a.src==="n" ? wordSrc(a)[a.v][formTile.f] : wordOf(formTile);   // 冠词磁贴只显示冠词,朗读念全短语(dag, de dag)
  // 计分:每对 15;连击(横幅窗口内)加成
  streak++;
  let pts=PAIR_POINTS;
  if(streak>=2){ pts+=10*(streak-1); }
  scoreRun+=pts;
  successJingle(streak);
  if(a.src!=="n" && (a.k==="form"||b.k==="form")){   // 名词组不计入词库 counts(防 eten 名词/动词同串染)
    save.counts[V.inf]=(save.counts[V.inf]||0)+1;
    persist();
  }
  a.alive=false; b.alive=false;
  board[a.r][a.c]=null; board[b.r][b.c]=null;   // 立即腾格:后续配对即刻可判
  pairsLeft--;
  a.el.classList.add("flash","lit"); b.el.classList.add("flash","lit");
  popScore(pts,streak,b.r+1,b.c+1);
  if(trial()){   // 试点:里程碑庆祝 + 分数飞向计分器
    milestone(streak);
    flyScore(b.el,"+"+pts);
  }
  if(mode==="survival"){ survivalDeadline=Date.now()+SURVIVAL_SECONDS*1000; updateSurvivalTag(); }   // 生存:续命
  updateHUD();
  showLearnBanner(a.v, formWord, a.f, a.src==="n");   // 高亮本盘词型
  if(save.settings.ttsVolume<=0){ setTimeout(()=>{ blip(660,.09,"sine",.06); setTimeout(()=>blip(990,.12,"sine",.05),90); },160); }   // 关朗读:连对确认音
  setTimeout(()=>{ a.el.classList.add("gone"); b.el.classList.add("gone"); },170);
  setTimeout(()=>{ a.el.remove(); b.el.remove(); },470);
  if(pairsLeft<=0){
    const generation=sessionGen;
    scoreRun+=CLEAR_BONUS;
    const completion=mode==="levels"?recordLevelCompletion():null;
    updateHUD();
    if(trial()){ confetti(); [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>blip(f,.12,"triangle",.07),i*70)); }   // 试点:清盘终章
    setTimeout(()=>{
      if(generation!==sessionGen) return;
      if(mode==="levels"){ if(curLevel) finishLevel(completion); }
      else if(curLevel){ blip(660,.1,"triangle",.07); dealModeBoard(); }   // 清盘→发下一盘,连击窗口延续
    },480);
  }else reshuffleIfStuck();   // 成功一连后查死局
  return true;
}
/* ---- 死局检测:成功一连后或一次失败尝试后都要查(此前只在成功路径查——玩家点不出对时永远不洗牌) ---- */
function reshuffleIfStuck(){
  if(findAnyPairNow()) return;
  const generation=sessionGen;
  setTimeout(()=>{
    if(generation!==sessionGen || !curLevel || pairsLeft<=0) return; // 旧盘或已结束
    if(findAnyPairNow()) return;          // 500ms 内局面可能已变(背靠背连点)
    toast(t("toast.nopair"));
    reshuffleRemaining();
  },500);
}
function drawPath(path){
  const svg=document.getElementById("pathSvg");
  svg.setAttribute("viewBox",`0 0 ${wrapEl.clientWidth} ${wrapEl.clientHeight}`);
  const hot=getComputedStyle(document.body).getPropertyValue("--hot").trim()||"#e06b45";
  // 端点取两块朝向路径一侧的「边中点」(用户反馈:不连中心)
  const edge=(pt,nxt)=>{
    const [x,y]=cellCenter(pt[0],pt[1]);
    const dx=nxt[1]-pt[1], dy=nxt[0]-pt[0];   // pt=[r,c]:列差=水平、行差=垂直(此前轴序颠倒导致斜线)
    if(Math.abs(dx)>=Math.abs(dy)) return [x+Math.sign(dx)*layout.tw/2, y];
    return [x, y+Math.sign(dy)*layout.th/2];
  };
  const p0=edge(path[0],path[1]);
  const p1=edge(path[path.length-1],path[path.length-2]);
  const ptsStr=[p0,...path.slice(1,-1).map(([r,c])=>cellCenter(r,c)),p1]
    .map(([x,y])=>`${Math.round(x)},${Math.round(y)}`).join(" ");
  svg.innerHTML=
    `<polyline points="${ptsStr}" fill="none" stroke="${hot}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>`+
    `<polyline points="${ptsStr}" fill="none" stroke="${hot}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8"/>`;
  for(const el of [window.__litA,window.__litB]) {}
  setTimeout(()=>{ svg.innerHTML=""; },560);
}
// 得分弹字:在消除块位置升起 "+pts ×streak"
function popScore(pts,streak,tr,tc){
  const [x,y]=cellCenter(tr,tc);
  const el=document.createElement("div");
  el.className="score-pop";
  el.textContent=`+${pts}${streak>=2?"  ×"+streak:""}`;
  el.style.left=Math.round(x)+"px"; el.style.top=Math.round(y)+"px";
  wrapEl.appendChild(el);
  setTimeout(()=>el.remove(),820);
}
// 成功音效:低频"咚"+ 双音上扬,连击≥3 加第三个音
function successJingle(streak){
  const base=540+Math.min(streak,8)*45;
  blip(170,.06,"sine",.07);
  blip(base,.07,"triangle",.09);
  setTimeout(()=>blip(base*1.335,.09,"triangle",.07),70);
  if(streak>=3) setTimeout(()=>blip(base*1.782,.12,"triangle",.06),150);
}

/* ---- 竞品调研试点(docs/RESEARCH-competitors.md P1/P3/P5/P6;只在试验关 A1.1/A1.2 生效) ---- */
const TRIAL_LEVELS=new Set(["L0","L1"]);
const trial=()=> mode==="levels" && curLevel && TRIAL_LEVELS.has(curLevel.id);
function comboWord(streak){   // P1 里程碑:×3/×5/×8,之后每 +4 再庆祝
  if(streak===3) return "combo.m3";
  if(streak===5) return "combo.m5";
  if(streak===8) return "combo.m8";
  if(streak>=12 && (streak-12)%4===0) return "combo.m12";
  return null;
}
let celeTimer=null;
function milestone(streak){
  const word=comboWord(streak);
  if(!word) return;
  const st=document.getElementById("scoreTag");
  st.classList.add("celebrate");
  st.innerHTML=`<span class="cele">${t(word)}</span>`;
  clearTimeout(celeTimer);
  celeTimer=setTimeout(()=>{ st.classList.remove("celebrate"); updateHUD(); },1300);
  wrapEl.classList.remove("ripple"); void wrapEl.offsetWidth; wrapEl.classList.add("ripple");
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.1,"triangle",.08),i*60));
}
function flyScore(fromEl,text){   // P5:分数从消除处飞向计分器(资源流向,Royal Match 式)
  try{
    const from=fromEl.getBoundingClientRect();
    const to=document.getElementById("scoreTag").getBoundingClientRect();
    const el=document.createElement("div");
    el.className="score-fly"; el.textContent=text;
    el.style.left=(from.left+from.width/2)+"px"; el.style.top=(from.top+from.height/2)+"px";
    document.body.appendChild(el);
    void el.offsetWidth;   // 强制重流,保证 transition 从原位出发(勿用 rAF)
    const dx=(to.left+to.width/2)-(from.left+from.width/2), dy=(to.top+to.height/2)-(from.top+from.height/2);
    el.style.transform=`translate(${dx}px,${dy}px) scale(.45)`;
    el.style.opacity="0";
    setTimeout(()=>el.remove(),680);
  }catch(e){}
}
function confetti(){   // P6:清盘终章彩带
  for(let i=0;i<26;i++){
    const el=document.createElement("div");
    el.className="confetti";
    el.style.left="50%"; el.style.top="28%";
    el.style.background=`hsl(${Math.floor(Math.random()*360)} 70% 60%)`;
    el.style.setProperty("--dx",(Math.random()*wrapEl.clientWidth-wrapEl.clientWidth/2)+"px");
    el.style.setProperty("--dy",(wrapEl.clientHeight*.6+Math.random()*90)+"px");
    el.style.setProperty("--rot",(Math.random()*720-360)+"deg");
    wrapEl.appendChild(el);
    setTimeout(()=>el.remove(),1500);
  }
}

function wordCardHTML(vi,activeF){
  const V=VERBS[vi];
  const isPerson=activeF==="p1"||activeF==="p3"||activeF==="p6";
  const raw=isPerson
    ? [["inf",V.inf],["p1","ik "+V.p1],["p3","hij "+V.p3],["p6","wij "+V.p6]]   // 人称变位关:形带人称,与磁贴同源
    : [["inf",V.inf],["sg",V.sg],["pl",V.pl],["pp",V.pp]];
  const forms=raw.filter(([,w])=>w)
    .map(([k,w])=>`<span class="bf${k===activeF?" on":""}${k==="inf"?" swu":""}">${w}</span>`).join("");
  return `<svg class="wc-art" viewBox="0 0 120 120">${artSVG(vi,save.style)}</svg><div class="wc-main"><div class="wc-forms">${forms}</div></div><div class="wc-gloss">${glossOf(V)}</div>`;
}
function nounCardHTML(vi,activeF){
  const V=NOUNS[vi];
  const forms=[["inf",V.inf],[activeF,V[activeF]]]
    .map(([k,w])=>`<span class="bf${k===activeF?" on":""}${k==="inf"?" swu":""}">${w}</span>`).join("");
  return `<div class="wc-main"><div class="wc-forms">${forms}</div></div><div class="wc-gloss">${glossOf(V)}</div>`;
}
function showLearnBanner(v,formWord,activeF,noun){
  clearTimeout(bannerTimer);
  const V=noun?NOUNS[v]:VERBS[v];
  bannerVerb=v;
  bannerEl.innerHTML=(noun?nounCardHTML(v,activeF):wordCardHTML(v,activeF))+`<div class="b-progress"><i></i></div>`;
  // 词卡字号自适应:四形态换行超过槽高就逐级缩小(中文/长动词 3 行也放得下)

    while(guard++<12 && formsEl.scrollHeight>availH && fs>11){ fs-=1; formsEl.style.fontSize=fs+"px"; }

  bannerTimer=setTimeout(hideBanner,(save.settings.bannerMs||BANNER_DEFAULT_S)*1000);
  speakPair(V,formWord);
}

function updateHUD(){
  const inLevel=!!curLevel;
  const modeUI=inLevel&&mode!=="levels";
  const showGoal=inLevel&&mode==="levels";   // 每日挑战不显示对数目标(用户反馈)
  const goalEl=document.getElementById("goalTag");
  goalEl.style.display=showGoal?"":"none";
  if(showGoal){
    document.getElementById("goalTxt").textContent=`${PAIR_TOTAL-pairsLeft}/${PAIR_TOTAL}`;
    document.getElementById("goalBar").style.width=Math.round((PAIR_TOTAL-pairsLeft)/PAIR_TOTAL*100)+"%";
  }
  const lv=document.getElementById("lvlTag");
  lv.style.display=(inLevel&&mode!=="levels")?"none":"";   // 模式下中槽只留一个胶囊(修生存倒计时换行)
  document.body.classList.toggle("mode-hud", modeUI);
  const tt=document.getElementById("timerTag");
  tt.style.display=(inLevel&&mode==="survival")?"":"none";
  if(tt.style.display==="none") tt.classList.remove("urgent");
  if(scoreRun!==lastScoreShown){
    if(mode==="endless" && scoreRun>(save.best["Oneindig"]||0)){ save.best["Oneindig"]=scoreRun; persist(); }
    if(mode==="daily"){ const k=todayKey(); if(scoreRun>(save.dailyBest[k]||0)){ save.dailyBest[k]=scoreRun; persist(); } }
  }
  const bt=document.getElementById("bestTag");
  bt.style.display="none";   // 个人最佳移入右侧分数条的目标位(模式)
  const st=document.getElementById("scoreTag");
  if(!st.classList.contains("celebrate")){
    if(modeUI){
      st.className="score-bar"+((modeTargetBest>0&&scoreRun>modeTargetBest)?" record":"");
      const fill=modeTargetBest>0?Math.min(100,scoreRun/modeTargetBest*100):(scoreRun>0?100:0);
      st.innerHTML=`<i style="width:${fill}%"></i><b>${scoreRun}</b><span class="sb-goal">${ICO_STAR}${modeTargetBest}</span>`;
    }else{
      st.className="score-tag";
      st.innerHTML=`${ICO_STAR}<b>${scoreRun}</b>`;
    }
    if(scoreRun!==lastScoreShown){
      st.classList.remove("bump"); void st.offsetWidth; st.classList.add("bump");
    }
  }
  lastScoreShown=scoreRun;
  const ct=document.getElementById("comboTag");
  if(streak>=2){ ct.style.display=""; ct.innerHTML=`${ICO_FLAME}<b>×${streak}</b>`; }
  else ct.style.display="none";
}

boardEl.addEventListener("click",e=>{

/* ---- 交互式首教学(P3):首次进 A1.1 时 3 步演示,只出现一次;点对推进,点错抖目标 ---- */
let demo=null;
function maybeStartDemo(){
  if(save.demoDone || mode!=="levels" || !curLevel || curLevel.id!=="L0") return;
  let pair=null;
  for(const vi of curLevel.verbs){
    const inf=tiles.find(t=>t.alive&&t.v===vi&&t.k==="inf");
    const form=tiles.find(t=>t.alive&&t.v===vi&&t.k==="form");
    if(inf&&form&&findPathOcc(occNow(),inf.r,inf.c,form.r,form.c)){ pair=[inf,form]; break; }
  }
  if(!pair) return;
  demo={step:1, inf:pair[0], form:pair[1], bar:null};
  busy=true;   // 演示期间接管输入
  const bar=document.createElement("div");
  bar.id="demoBar";
  bar.textContent=t("demo.step1");
  wrapEl.appendChild(bar);
  demo.bar=bar;
  demo.inf.el.classList.add("demo-target");
}
function demoClick(tile){   // 注意:参数不可叫 t,会遮蔽全局 i18n 函数 t()
  if(demo.step===1){
    if(tile===demo.inf){
      demo.inf.el.classList.remove("demo-target"); demo.form.el.classList.add("demo-target");
      demo.step=2; demo.bar.textContent=t("demo.step2"); blip(480,.05,"sine",.05);
    }else wiggle(demo.inf);
  }else if(demo.step===2){
    if(tile===demo.form){
      demo.form.el.classList.remove("demo-target");
      demo.step=3; demo.bar.textContent=t("demo.step3"); blip(560,.06,"sine",.05);
      const generation=sessionGen, currentDemo=demo;
      setTimeout(()=>{
        if(generation!==sessionGen || demo!==currentDemo) return;
        busy=false;
        attemptPair(demo.inf,demo.form);   // 连线自己画出来
        if(demo.bar){ demo.bar.remove(); }
        demo=null;
        save.demoDone=true; persist();
        setTimeout(()=>toast(t("demo.go")),650);
      },500);
    }else wiggle(demo.form);
  }
}
function wiggle(t){
  t.el.classList.add("shake"); blip(180,.06,"sine",.04);
  setTimeout(()=>t.el.classList.remove("shake"),320);
}

<script>

function speakVerb(word){
  const gen=++speakGen;
  return new Promise(res=>{
    if(!("speechSynthesis" in window) || save.settings.ttsVolume<=0){ res(); return; }
    try{
      const ss=window.speechSynthesis;
      const busyS=ss.speaking||ss.pending;
      if(busyS) ss.cancel();
      const u=new SpeechSynthesisUtterance(word);
      u.lang=LANG_META.tts; if(appVoice) u.voice=appVoice;
      u.rate=0.82; u.volume=save.settings.ttsVolume/100;
      let startedAny=false;
      u.onstart=()=>{ startedAny=true; };
      u.onend=()=>res(); u.onerror=()=>res();
      if(busyS) setTimeout(()=>{ if(gen===speakGen) ss.speak(u); else res(); },70);
      else ss.speak(u);
      setTimeout(()=>{ if(gen===speakGen && !startedAny && (ss.speaking||ss.pending)) warnTtsBlocked(); },1300);
    }catch(e){ res(); }
  });
}
function recordLevelCompletion(){
  const idx=LINK_LEVELS.indexOf(curLevel);
  const lvId=LINK_LEVELS[idx].id;
  save.done[lvId]=true;
  save.gUnlocked[curLevel.grp]=Math.max(save.gUnlocked[curLevel.grp]||1, LINK_LEVELS[idx].gpos+2);   // 只推进本组(四组互不锁关)
  const prev=save.best[lvId]||0;
  const rec=scoreRun>prev;
  if(rec){ save.best[lvId]=scoreRun; }
  persist();
  return {idx,prev,rec};
}

    t("result.done")+"<br>"+`${ICO_STAR}<b>${scoreRun}</b>${rec?" — "+t("result.record"):""} · ${t("result.best")}: ${Math.max(prev,scoreRun)}`;

let cardResolve=null;
/* ---- 例句卡 prototype:把该词的各形态织进一句简单例句,词形高亮 + 中文 ---- */
function sentHTML(V){
  if(!V.st) return "";
  const forms=[V.inf,V.sg,V.pl,V.pp].filter(Boolean).sort((a,b)=>b.length-a.length);
  const re=new RegExp("("+forms.map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  const hl=V.st.replace(re,'<b class="wsh">$1</b>');
  return `<div class="wc-sent"><span class="wc-sent-label">${t("card.sent")}</span>${hl}<span class="wc-sent-zh">${V.stz||""}</span></div>`;
}
function showCard(vi){
  return new Promise(res=>{
    cardResolve=res;

    document.getElementById("cardPanel").style.setProperty("--h",V.hue);
    document.getElementById("cardModal").classList.add("on");
    stopSpeech(); speakWords([V.inf,V.sg,V.pl,V.pp].filter(Boolean));   // 开卡朗读完整四形态
  });
}

  go.onclick=()=>{ document.getElementById("modeIntro").classList.remove("on"); document.getElementById("menuScreen").classList.remove("on"); info.go(); };
  const back=document.createElement("button"); back.className="btn ghost"; back.textContent=t("mi.back");
  back.onclick=()=>document.getElementById("modeIntro").classList.remove("on");
  btns.append(go,back);
  document.getElementById("modeIntro").classList.add("on");
}
document.getElementById("mDaily").onclick=()=>modeIntro("daily");
document.getElementById("mEndless").onclick=()=>modeIntro("endless");
document.getElementById("mSurvival").onclick=()=>modeIntro("survival");
document.getElementById("mContinue").onclick=()=>{
  document.getElementById("menuScreen").classList.remove("on");
  startLink(LEVELS_done());
};
document.getElementById("mLevels").onclick=()=>showMenuView("levels");
document.getElementById("mBook").onclick=openBook;
document.getElementById("mBack").onclick=()=>showMenuView("main");
document.getElementById("mHelp").onclick=()=>document.getElementById("helpModal").classList.add("on");
document.getElementById("mSettings").onclick=openSettings;
document.getElementById("setVolume").oninput=e=>{ save.settings.volume=+e.target.value; persist(); };
document.getElementById("setTts").oninput=e=>{ save.settings.ttsVolume=+e.target.value; persist(); };
document.getElementById("setHintWait").oninput=e=>{
  save.settings.hintWait=+e.target.value; persist();
  document.getElementById("hintWaitVal").textContent=save.settings.hintWait>0?`${save.settings.hintWait} s`:t("opt.off");
};
document.getElementById("setBanner").oninput=e=>{
  save.settings.bannerMs=+e.target.value; persist();
  document.getElementById("bannerVal").textContent=`${save.settings.bannerMs} s`;
};
document.getElementById("btnVoiceTest").onclick=()=>speakVerb("lopen");
document.getElementById("cardClose").onclick=e=>{e.stopPropagation(); closeCard();};
document.getElementById("cardPanel").onclick=closeCard;   // 点卡即关(释义常显,不再两段式解锁)
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("on"));
["bookDrawer","helpModal","settingsModal"].forEach(id=>{
  document.getElementById(id).addEventListener("click",e=>{ if(e.target.id===id) e.target.classList.remove("on"); });
});
window.addEventListener("resize",()=>{ syncSize(); });
if(window.visualViewport) window.visualViewport.addEventListener("resize",()=>syncSize());
let lastVW=window.innerWidth, lastVH=window.innerHeight;
setInterval(()=>{ if(window.innerWidth!==lastVW || window.innerHeight!==lastVH){ lastVW=window.innerWidth; lastVH=window.innerHeight; syncSize(); } },1200);

/* ================= 调试钩子 ================= */
window.NLM3={
  state:()=>({level:curLevel&&curLevel.id, mode, dailyLeft, survivalLeft:survivalDeadline?Math.max(0,survivalDeadline-Date.now()):null, pairs:pairsLeft, score:scoreRun, streak, busy,
    board:board.map(row=>row.map(t=>t?[t.v,t.k]:null))}),
  verbs:VERBS, levels:LINK_LEVELS, nouns:NOUNS,
  findPair:()=>{ const p=findAnyPairNow(); return p?[p[0].r,p[0].c,p[1].r,p[1].c]:null; },
  connect:(r1,c1,r2,c2)=>attemptPair(board[r1][c1],board[r2][c2]),
  settings:()=>({...save.settings}),
  forceTimeUp:()=>{ dailyLeft=1; },
  forceSurvivalEnd:()=>{ if(survivalDeadline) survivalDeadline=Date.now()-1; },
  skipDemo:()=>{ if(demo){ demo=null; const b=document.getElementById("demoBar"); if(b) b.remove(); busy=false; save.demoDone=true; persist(); } },
  save:()=>save,
};

/* ================= 启动 ================= */
initVoices();
applySettings();
syncSize();
openMenu();
</script>
</body>
</html>
